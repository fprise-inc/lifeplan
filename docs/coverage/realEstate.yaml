# 対応範囲の一覧（収益不動産）。形は coverage.schema.json
area: realEstate
title: 収益不動産
order: 9
entries:
  - id: realEstate.rentalIncome
    title: 家賃収入と空室
    status: included
    summary: >-
      入っています。物件ごとに、満室時の家賃×(1−空室率)を貸している月ごとに受け取ります。共益費・駐車場などの月の収入と、礼金・更新料の年あたりの
      見込みも足せます。今の実際の家賃収入で入れることもできます。
    how: >-
      家賃は貸し始めの年（計算基準年より前なら計算基準年）の額で、その後の年は家賃の変化率（省略は0）で動かします。共益費・駐車場・その他の
      月の収入にも同じ空室の割合と変化率を当てます。礼金・更新料の年あたりの見込みは12か月に分けて貸している月に受け取ります（空室は掛けません）。
      家賃の入れ方を「今の実際の家賃収入で」にすると、入れた額を空室を見込んだ後の額とみなし、空室率を掛けません。家賃の段階・例外の年も入れられます。
      名義の人が万一の想定で亡くなったら、翌月から相続する人の収入にします。
    keywords: [家賃収入, 空室率, 賃料, 共益費, 礼金, 更新料, 満室想定, アパート経営]
    items: [account.property, account.owner]
    fields:
      - "「収益不動産」の入力項目の「家賃の入れ方」"
      - "「収益不動産」の入力項目の「貸し始め」"
      - "「収益不動産」の入力項目の「貸し終わり」"
    rows: [cf.income.other.rental]
    components:
      asset.realEstate: 10
    related: [realEstate.expenses, realEstate.income]

  - id: realEstate.expenses
    title: 不動産の経費と大きな修繕
    status: approximated
    summary: >-
      近似して入っています。経費は年額（持っている間。12か月に分ける）と、受け取る家賃に対する割合の経費（管理委託料など）の合計です。
      大きな修繕は、その月の一時の支出とし、全額をその年の経費にします。
    how: >-
      経費の年額は変化率（省略は0）で動かし、費目（管理費・修繕積立金・固定資産税・管理委託料など）を1つでも入れたら、その合計を年額にします。
      家賃に対する割合の経費は、家賃と家賃以外の月の収入の合計に掛けます。大きな修繕はその月に払い、貸している月なら全額をその年の
      不動産所得の経費にします。
    approximation: 大きな修繕は、資本的支出として減価償却する扱いをせず、全額をその年の経費にします。
    reason: 修繕のうち資本的支出になる部分の分け方は工事ごとに違うため、全額を経費にする形にしています。
    instead: 資本的支出として償却したいときは、取得価額の内訳の建物附属設備や減価償却の引き継ぎの欄で表せます。
    keywords: [不動産の経費, 管理費, 修繕積立金, 管理委託料, 大規模修繕, 資本的支出, 固定資産税]
    items: [account.property]
    fields:
      - "「収益不動産」の入力項目の「年額（持っている間）」"
      - "「収益不動産」の入力項目の「年額の伸び率（年）」"
      - "「収益不動産」の入力項目の「＋ 大きな修繕」"
    rows: [cf.expense.other.realEstate]
    components:
      asset.realEstate: 10
    related: [realEstate.income]

  - id: realEstate.depreciation
    title: 減価償却
    status: included
    summary: >-
      入っています。建物の取得価額を法定耐用年数（中古は簡便法）の定額法で償却し、貸している月数で月割りして、帳簿の残りが1円になるまで
      不動産所得から引きます。建物附属設備も別の耐用年数で償却できます。
    how: >-
      建物の取得価額＝取得価額×(1−土地の割合)（内訳を入れればその額）に、取得時の諸費用の建物の分を足します。償却率は1÷耐用年数を小数3桁に切り上げ。
      法定耐用年数は木造22・軽量鉄骨19・重量鉄骨34・鉄筋コンクリート47年。中古は、全部過ぎていれば法定×0.2、一部なら法定−経過＋経過×0.2
      （端数は切り捨て、2年未満は2年）。建物附属設備の省略は15年です。ある年の未償却残高と年間の償却費を入れれば、その値から引き継げます。
      貸している土地・駐車場は建物の償却がありません。取得価額の入力が無ければ減価償却費を入れません。
    keywords: [減価償却, 耐用年数, 簡便法, 中古物件, 建物附属設備, 定額法, 未償却残高, デッドクロス]
    items: [account.property, account.costBasis]
    fields:
      - "「収益不動産」の入力項目の「建物の構造」"
      - "「収益不動産」の入力項目の「建物が建った年」"
      - "「収益不動産」の入力項目の「取得時の諸費用」"
      - "「収益不動産」の入力項目の「設備の耐用年数」"
    rules:
      - 減価償却資産の耐用年数等に関する省令 別表第一
    components:
      asset.realEstate: 10
    related: [realEstate.income, realEstate.analysis]

  - id: realEstate.income
    title: 不動産所得と損益通算・物件のローン
    status: included
    summary: >-
      入っています。不動産所得＝家賃収入−経費−減価償却費−借入の利息を名義の人ごとに出し、赤字はほかの所得から引きます（損益通算）。
      土地の取得のための借入の利息の分は損失から除きます。青色申告なら引ききれない損失を3年繰り越します。
    how: >-
      物件を指すローンの年ごとの利息（貸している月数の分）を経費にし、借入額のうち建物の取得価額を超える分の割合を土地の分の利息とみなします。
      損失はほかの所得と通算し（所得税法施行令198条の順）、土地の分の利息は損失から引けません。青色申告特別控除の55万円・65万円は、
      事業的規模の目安（室数＋棟数×2が10以上）か事業所得があるときだけで、当たらなければ10万円です。白色申告の引ききれない損失は捨てます。
      物件のローンの返済は住宅ローンと同じ計算で、売るときに「売ったときにローンを返す」なら残りを一括で返します。
    keywords: [不動産所得, 損益通算, 赤字, 青色申告特別控除, 事業的規模, 5棟10室, 純損失の繰越, 不動産投資ローン]
    items: [account.property, debt.property, member.taxReturn]
    fields:
      - "「収益不動産」の入力項目の「＋ この物件のローン」"
      - "「収益不動産」の入力項目の「事業的規模の目安」"
      - "「収益不動産」の入力項目の「所得の区分」"
    rules:
      - 所得税法施行令198条（損益通算の順）
      - 租税特別措置法41条の4（土地等の負債の利子）
      - 租税特別措置法25条の2（青色申告特別控除）
      - 所得税基本通達26-9（事業的規模）
    rows: [cf.income.other.rental, cf.expense.other.realEstate]
    components:
      asset.realEstate: 10
      tax.totalIncomeBase: 3
      tax.lossCarryforward: 1
      debt.schedule: 9
    related: [realEstate.depreciation, realEstate.sale]

  - id: realEstate.sale
    title: 物件の売却と譲渡所得の税
    status: approximated
    summary: >-
      近似して入っています。売る月に売却価格から売却の費用を引いた手取りを受け取り、譲渡所得の所得税（長期15%・短期30%と復興・防衛の特別所得税）を
      翌年3月に、住民税（長期5%・短期9%）を翌年度に払います。特別控除・買換えなどの特例は入れていません。
    how: >-
      売却価格の省略はその年の評価額（土地は上昇率、建物は耐用年数で減らした目安）、売却の費用の省略は売却価格の4%です。譲渡所得＝売却価格−
      （取得費＋売却の費用）。取得費＝取得価額＋取得時の諸費用−建物と建物附属設備の償却の累計で、概算取得費（売却価格の5%）のほうが大きければそれ。
      所有期間は売った年の1月1日に5年を超えれば長期。名義の人×年で長期・短期を足し、損失は互いに引きますが、ほかの所得とは通算せず繰り越しません。
      取得の入力が無ければ概算取得費と長期で計算します。
    approximation: >-
      特別控除・買換え・取得費加算などの特例と、引ききれない所得控除を譲渡所得から引く扱いは入れていません。貸していない期間の建物の価値の減り
      （非業務用の減価）は取得費から引かないので、税が少なめに出ることがあります。
    reason: 特例の当てはめは物件ごとの要件が多く、まだ入力と計算に入れていないためです。
    instead: 税の額が分かっているときは、出るお金の行で差を入れて合わせます。
    keywords: [不動産の売却, 譲渡所得, 長期譲渡, 短期譲渡, 取得費, 概算取得費, 出口戦略, 売却益の税]
    items: [account.property, account.costBasis]
    fields:
      - "「収益不動産」の入力項目の「売る予定がある」"
      - "「収益不動産」の入力項目の「売る時期」"
      - "「収益不動産」の入力項目の「売却価格」"
      - "「収益不動産」の入力項目の「取得の年月」"
    rules:
      - 租税特別措置法31条・32条（土地建物等の譲渡所得）
    rows: [cf.income.lumpSum.realEstateSale, cf.taxSi.incomeTax.realEstateSale, cf.taxSi.residentTax.realEstateSale]
    components:
      asset.realEstate: 10
      tax.realEstateSale: 3
      debt.schedule: 9
    related: [realEstate.income, realEstate.analysis]

  - id: realEstate.analysis
    title: 利回り・手残りなどの分析の数字
    status: approximated
    summary: >-
      近似して入っています。物件ごと・年ごとに、表面利回り・実質利回り（NOI利回り）・損益分岐の入居率・返済比率・DSCR・LTV・CCR、
      税引前と税引後の手残り、デッドクロスの年、売ったときの手残りの目安と含み益を出します。
    how: >-
      表面利回り＝満室のときの収入（年換算）÷取得価額、実質利回り＝（実際に入る収入−経費）÷（取得価額＋取得時の諸費用）、損益分岐の入居率＝
      （経費＋約定の返済）÷満室のときの収入、返済比率＝約定の返済÷実際に入る収入、DSCR＝（実際に入る収入−経費）÷約定の返済、LTV＝年末のローン残高÷
      年末の評価額、CCR＝税引前の手残り÷自己資金。税引前の手残り＝実際に入る収入−経費−大きな修繕−年の返済。デッドクロスは元金の返済が
      減価償却費を上回る最初の年。計算そのもの（表・税）は変えない、見るための数字です。
    approximation: >-
      税引後の手残りの「その物件で増える税と社会保険料」は、物件の所得の分だけ課税所得を下げたときの所得税・住民税の所得割・国民健康保険などの
      所得割の差で、所得控除の段・賦課限度額・軽減・繰越控除の変わり方は見ません。
    reason: 物件ごとに税を分けるには、世帯の税を物件の有無で計算し直す必要があり、差の目安で出しています。
    keywords: [利回り, 表面利回り, 実質利回り, NOI, DSCR, LTV, CCR, 返済比率, デッドクロス, 手残り]
    items: [account.property]
    components:
      asset.realEstateAnalysis: 4
      asset.realEstate: 10
    related: [realEstate.depreciation, realEstate.sale]

  - id: realEstate.lodging
    title: 民泊・宿
    status: included
    summary: >-
      入っています。売上は「1泊の単価×稼働率×営業日数」か「月の売上の見込み」で入れ、住宅宿泊事業は営業日数を年180日までにします。
      所得の区分は営業の形から、旅館業は事業所得、住宅宿泊事業・特区民泊は雑所得にします（選び直せます）。
    how: >-
      空室の割合・家賃以外の月の収入・礼金は使わず、仲介サイトの手数料は売上に対する割合の経費に足します。減価償却・借入の利息の計算は
      家賃の物件と同じです。分析の数字では表面利回りを出さず、稼働率・1泊の単価・営業日数・年の売上を並べます。
    keywords: [民泊, 住宅宿泊事業, 旅館業, 特区民泊, 稼働率, 180日, 簡易宿所]
    items: [account.property]
    fields:
      - "「収益不動産」の入力項目の「営業の形」"
      - "「収益不動産」の入力項目の「1泊の単価」"
      - "「収益不動産」の入力項目の「稼働率」"
      - "「収益不動産」の入力項目の「営業日数（年）」"
    rules:
      - 住宅宿泊事業法2条3項（年180日）
    rows: [cf.income.other.rental, cf.expense.other.realEstate]
    components:
      asset.realEstate: 10
    related: [realEstate.businessTax]

  - id: realEstate.businessTax
    title: 個人事業税・消費税・不動産取得税
    status: notYet
    summary: >-
      まだ入っていません。事業的規模の目安に当たる貸付け・事業所得の民泊や宿の個人事業税、売上が年1,000万円を超える民泊・宿の消費税、
      物件を買ったときの不動産取得税は計算しません（個人事業税・消費税は、当たりそうなとき知らせが出ます）。
    reason: 事業税の業種の判定と、消費税の課税事業者の判定・簡易課税の選択などを、まだ計算に入れていないためです。
    instead: >-
      不動産取得税は「取得時の諸費用」に含めて入れられます（建物の分は償却の基に足します）。個人事業税・消費税は、経費の費目や出るお金の行に
      見込みの額を入れて足せます。
    keywords: [個人事業税, 消費税, 不動産取得税, 課税事業者, インボイス]
    items: [account.property]
    components:
      asset.realEstate: 10
    related: [realEstate.income, realEstate.lodging]
