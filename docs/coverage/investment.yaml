      - investment.nisa

  - id: investment.cryptoAsset
    title: 暗号資産
    status: approximated
    summary: >-
      暗号資産は金融資産の口座の種類として持てます。2028年からの申告分離課税の分は取り崩し、売った利益に税をかけます。2027年までと、雑所得として扱う
      暗号資産は取り崩さず、評価額だけを持ちます。
    how: >-
      残高は金融資産の合計に入り、口座の利回りも資産の配分も無ければ利回りは0です。申告分離課税（2028年から）の暗号資産は、既定の順番では課税口座の次に
      取り崩し、売った額と取得価額の差に所得税・復興特別所得税・防衛特別所得税と住民税をかけて、手取りで足りるだけ売ります。譲渡損失は名義人ごとに3年
      繰り越し、同じ年と翌年以後の暗号資産の利益から古い順に引きます（ほかの所得・課税口座とは通算しません）。相場の下落のストレステストの対象です。
    approximation: >-
      申告分離課税の税は、翌年の申告ではなく売った年に引きます。雑所得（総合課税）として売るときの税は計算できないので、その暗号資産は取り崩しません。
    reason: 雑所得の税は、ほかの所得と合わせた税率で決まり、取り崩しの計算の中で出せないためです。
    keywords: [暗号資産, 仮想通貨, ビットコイン, 申告分離課税, 雑所得, 暗号資産の税金]
    items: [account.kind, account.cryptoTaxation, account.costBasis, account.marketValue]
    fields:
      - 「貯蓄・運用」の入力項目の「売ったときの税」
    regulation:
      - incomeTax.cryptoAsset.rate
      - residentTax.cryptoAsset.rate
      - incomeTax.cryptoAsset.lossCarryforwardYears
    rows:
      - cf.balance.account.cryptoAsset
      - cf.transfer.savings.cryptoAsset
      - cf.taxSi.incomeTax.cryptoAsset
      - cf.taxSi.residentTax.cryptoAsset
    components:
      plan.cashflow: 27
    related:
      - investment.withdrawalOrder

  - id: investment.foreignCurrency
    title: 外貨預金
    status: approximated
    summary: >-
      外貨預金は口座の種類として持てます。円の額で持ち、預金の利回り（資産の種類ごとの利回りに外貨預金を入れたときはその利回り）で増やします。
      為替レートの動きと為替差益の税は計算しません。
    how: 既定の取り崩しの順番では預金の次に取り崩し、積立は積立預金と同じ行に載せます。残高は金融資産の合計に入ります。
    approximation: >-
      為替の動きは、利回りの中で見込むしかありません。取り崩すときの為替差益（雑所得）の税はかけません。
    reason: 口座の額を円だけで持つ作りにしているためです。
    instead: 為替の見込みを含めた利回りを、資産の種類ごとの利回りの外貨預金か、その口座の利回りに入れてください。
    keywords: [外貨預金, 外貨, ドル, 為替, 為替差益, 円安, 外貨建て]
    items: [account.kind, account.assetMix, account.expectedReturn, assumptions.depositReturn, assumptions.assetReturns]
    rows: [cf.balance.account.fxDeposit, cf.transfer.savings.deposit]
    components:
      plan.cashflow: 27
    related:
      - investment.returnSettings
