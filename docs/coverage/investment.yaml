  - id: investment.returnSettings
    title: 運用利回りの決め方（資産配分・口座ごと）
    status: included
    summary: >-
      入っています。運用利回りは、口座ごとに、資産の配分×資産の種類ごとの利回り、または口座に入れた利回りで決め、運用の費用（信託報酬など）を引きます。
      年ごとに利回りや配分を変える段階と、例外の年も入れられます。
    how: >-
      資産の配分を入れない口座は、預金・外貨預金は預金の利回り、ほかは前提の運用利回りです（暗号資産は0）。資産の配分を入れた口座は、資産の種類ごとの
      利回りを割合で按分します（割合の合計が100%でなくても合計で割ります）。入れ方は「合計」（金融資産をまとめて1つ）・「口座」・「資産配分」
      （運用する口座に共通の配分と信託報酬）から選べます。資産配分では、年に1回元の割合に戻すか（戻さないときは値上がりで割合がずれる）を選べます。
      利回りは毎年同じ値の決まった道筋で、相場の上下は計算しません。
    keywords: [運用利回り, 期待リターン, 資産配分, アセットアロケーション, 信託報酬, 運用の費用, リバランス, 利回りの段階, 預金金利]
    items:
      - account.assetMix
      - account.expectedReturn
      - account.fee
      - account.returnStages
      - account.returnExceptions
      - assumptions.investmentReturn
      - assumptions.depositReturn
      - assumptions.assetReturns
      - assumptions.investment
    fields:
      - 「前提条件」の入力項目の「運用利回り（年）」
      - 「前提条件」の入力項目の「預金の利回り（年）」
      - 「前提条件」の入力項目の「資産の種類ごとの利回り」
      - 「貯蓄・運用」の入力項目の「利回り（年）」
      - 「貯蓄・運用」の入力項目の「運用の費用（年）」
      - 「貯蓄・運用」の入力項目の「利回りの変化」
