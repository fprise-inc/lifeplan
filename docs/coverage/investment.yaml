  - id: investment.nisa
    title: NISA（つみたて投資枠・成長投資枠・生涯の枠）
    status: included
    summary: >-
      入っています。NISA への積立は、年間投資枠（つみたて投資枠・成長投資枠）と非課税保有限度額（簿価。成長投資枠は内数）の残りで止め、
      売った簿価の分の枠は翌年に戻します。NISA の運用益と売ったときの利益に税はかかりません。旧NISA・ジュニアNISA・こどもNISA も扱います。
    how: >-
      積立はつみたて投資枠から入れ、つみたて投資枠の年間の枠を超えた分は成長投資枠の残りに入れます。それも超えた分は、前提の選び方で名義人の課税口座で
      続けるか、預金に残します（計算の知らせに出ます）。口座を開けるのは、その年1月1日に18歳以上の年からです。旧NISA・ジュニアNISA は買付の年ごとの
      内訳で非課税期間を判定し、終わった年の年末に時価で課税口座へ移します（取得価額はその時価）。こどもNISA（2027年から）は子の年間投資枠と
      非課税保有限度額で止め、成人の年からは成人の NISA として数えます。NISA の枠の残りは表の「NISAの非課税保有限度額の残り」の行に出ます。
    keywords: [NISA, 新NISA, つみたて投資枠, 成長投資枠, 生涯投資枠, 非課税保有限度額, 旧NISA, ジュニアNISA, こどもNISA, 枠の復活]
