  - id: investment.idecoPayout
    title: iDeCo・企業型DCの受け取り方と退職所得控除
    status: included
    summary: >-
      入っています。受け取り方は一時金・年金・併用（一時金の割合）から選べます。一時金は退職所得として、同じ年や前の年のほかの退職金と合わせて
      退職所得控除（重複する期間の調整を含む）を計算し、年金で受け取る分は公的年金等の雑所得として税を計算します。
    how: >-
      受け取りを始められる月は、60歳の時点の通算加入者等期間で決まる年齢（10年以上なら60歳。短いほど遅く、最も遅くて65歳。60歳以後に加入したときは
      加入から5年後）からで、75歳までに始めます。始まりを空欄にすると退職の年（60〜65歳に収める）を、受け取り方も空欄なら一時金を入れます。
      一時金は始めの月にその時の残高を、年金は始めの月から毎年1回、その時の残高÷残りの回数を受け取り（受け取りの間も運用益が付く）、併用は一時金の割合
      （省略は半分）を先に受け取ります。一時金の退職所得控除は、勤続年数の代わりに通算加入者等期間（掛金を払った最後の月まで）で数え、退職一時金・
      小規模企業共済の共済金と同じ年なら合わせて、前の年に受けた一時金と期間が重なるときは重複する期間の分を引きます。受け取ったお金は預金に入れるか、
      その年の NISA の枠へ、残りを課税口座へ移して運用を続けるかを選べます。受け取る前に亡くなったときは、その時の残高を死亡一時金として遺族が受け取ります
      （相続税の対象ですが、相続税はお金の流れに入れていません）。
    keywords: [iDeCoの受け取り, 一時金, 年金受け取り, 併用, 退職所得控除, 受け取り方, 受給開始, 出口戦略, 5年ルール, 19年ルール]
    items: [account.payout, account.enrolledSince, account.withdrawalLockedUntil]
    fields:
      - 「貯蓄・運用」の入力項目の「受け取り方」
      - 「貯蓄・運用」の入力項目の「受け取りを始める時期」
      - 「貯蓄・運用」の入力項目の「受け取ったお金」
      - 「退職金・企業年金」の入力項目の受け取りの並び
    rules:
      - 確定拠出年金法
      - 所得税法30条
      - 所得税法31条
      - 所得税法35条
    regulation:
      - ideco.payout.earliestAge
      - ideco.payout.latestAge
      - ideco.payout.startAgeByMonths
