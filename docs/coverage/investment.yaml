      account.ideco: 7
    related:
      - basics.financialAssets
      - investment.resultRange

  - id: investment.resultRange
    title: 結果の幅（モンテカルロ・確率の計算）
    status: notYet
    summary: >-
      まだ入っていません。相場の上下をばらつかせて何通りも計算し、資産が尽きる確率や結果の幅を出す計算（モンテカルロ）はしていません。
      計算は、毎年決まった利回りで進む1本の道筋です。
    reason: >-
      資産の種類ごとの値動きの大きさ（標準偏差）は前提として持てますが、結果の幅の計算の方法をまだ決めていないためです。
    instead: >-
      ストレステスト（退職した年に相場が下がる・利回りが低いまま・利回りがずっと低いなど）や、利回りを変えたプランを比べて、
      悪い場合の見通しを確かめられます。
    keywords: [モンテカルロ, モンテカルロシミュレーション, 確率, 成功確率, 結果の幅, 値動き, リスク, 標準偏差, ばらつき]
    items: [assumptions.assetVolatility]
    related:
      - basics.stressTest
      - investment.returnSettings

  - id: investment.withdrawalOrder
    title: 取り崩しの順番と取り崩しの計画
    status: included
    summary: >-
      入っています。決済口座が足りない年は、決めた順番で口座を取り崩します。「毎月いくら」「毎年の初めの金融資産の〇%」を使う取り崩しの計画も
      入れられます。
    how: >-
      決済口座の年末の残高が「預金に残しておく額」を下回ると、取り崩しの順番（既定は預金・外貨預金・財形・課税口座・暗号資産・持株会・旧NISA・NISA。
      まとめた金融資産は決済口座の次）で年末に売って補います。課税口座・暗号資産は税を引いた手取りで足りるだけ売ります。iDeCo・企業型DC（受け取りまで）・
      不動産・その他の資産・引き出せない期間の口座は取り崩しません。取り崩しの計画は、始まりの月から毎月の額か年の初めの金融資産×率を使い、
      その年の収支の不足より多い分を「取り崩して使うお金」として年間収支から引きます。
    keywords: [取り崩し, 取り崩しの順番, 定額取り崩し, 定率取り崩し, 4%ルール, 出口戦略, 生活防衛資金, 預金に残す額]
    items: [assumptions.withdrawal, account.settlement, account.withdrawalLockedUntil, assumptions.investment]
    fields:
      - 「貯蓄・運用」の入力項目の「お金の行き先」
      - 「貯蓄・運用」の入力項目の「預金に残しておく額」
      - 「貯蓄・運用」の入力項目の「引き出せない期間の終わり」
    rows: [cf.transfer.withdrawal, cf.expense.living.drawdown, cf.balance.shortfall]
    components:
      plan.cashflow: 27
    related:
      - basics.shortfall
      - investment.taxableAccountTax

  - id: investment.taxableAccountTax
    title: 課税口座（特定口座）の譲渡益・配当の税
    status: approximated
    summary: >-
      課税口座を取り崩すときは、売った額と取得価額の差（譲渡益）に所得税・住民税をかけ、手取りで足りるだけ売ります。源泉徴収ありの特定口座とみなします。
      配当・分配金は分けず、運用益に含めています。
    how: >-
      売った額の取得価額は、取得価額×売る額÷時価で按分します。譲渡益に上場株式等の税率（所得税・復興特別所得税・防衛特別所得税と住民税）を掛け、
      売った年の税の行に載せます。前提の選び方で、税を毎年の運用益にかける形（その年の運用益から税を引き、取得価額を時価にそろえる）にもできます。
    approximation: >-
      配当・分配金を運用益と分けず、既定では売るときにだけ税をかけます（毎年かける形も選べますが、税の行には出しません）。ほかの課税口座・
      ほかの所得との損益通算と、損失の繰越控除はしません。
    reason: 口座ごとの配当と値上がりの内訳を持たない作りにしているためです。
    instead: 今の取得価額を入れると、今までの値上がりの分にも税がかかります（入れなければ時価と同じで、今までの値上がりには税がかかりません）。
    keywords: [課税口座, 特定口座, 譲渡益課税, 20.315%, 配当課税, 源泉徴収, 株の税金, 投資信託の税金, 取得価額]
    items: [account.costBasis, account.marketValue, assumptions.investment]
    fields:
      - 「貯蓄・運用」の入力項目の「取得価額」
    rules:
      - 租税特別措置法37条の11
    regulation:
      - incomeTax.listedSecurities.rate
      - residentTax.listedSecurities.rate
      - incomeTax.reconstructionSurtax.rate
      - incomeTax.defenseSurtax.rate
    rows: [cf.taxSi.incomeTax.capitalGains, cf.taxSi.residentTax.capitalGains, cf.balance.account.taxable, cf.transfer.investment]
