  - id: investment.ideco
    title: iDeCo の掛金と所得控除
    status: included
    summary: >-
      入っています。iDeCo の掛金は、国民年金の区分（第1号〜第3号、70歳未満の第5号）と勤め先の企業年金で決まる拠出限度額で月ごとに止め、
      本人が払った掛金は小規模企業共済等掛金控除として所得税・住民税から差し引きます。
    how: >-
      加入できるのは、国民年金の第1号・第2号・第3号の月で、加入できる年齢の上限の前の月まで（2026年12月から70歳になる前の月まで）です。
      2026年12月からは、60歳以上で国民年金の被保険者でなく老齢基礎年金を受けていない人も、前に iDeCo の掛金を出していれば加入できます（経過措置の
      間は前の加入を問いません）。第2号の拠出限度額は、勤め先の企業年金（無し・企業型DCだけ・確定給付型などの他制度あり）で分け、企業型DCの事業主掛金
      （2024年12月分からは他制度掛金相当額も）と合わせた上限を超える分も出しません。月5,000円に届かない月は出しません。受け取りを始めた月からは
      掛金を出しません。上限を超えた分を除いたときは計算の知らせに出ます。掛金は口座の間の移動として決済口座から iDeCo の口座へ移ります。
    keywords: [iDeCo, イデコ, 個人型確定拠出年金, 掛金, 拠出限度額, 小規模企業共済等掛金控除, 所得控除, 節税, 第5号]
    items: [account.kind, account.contributions, account.enrolledSince, employment.corporatePension]
    fields:
      - 「貯蓄・運用」の入力項目の iDeCo の「毎月の積立」
      - 「働き方と収入」の入力項目の「他制度掛金相当額（月額）」
    rules:
      - 確定拠出年金法
      - 所得税法75条
    regulation:
      - ideco.contributionLimit.category1
      - ideco.contributionLimit.category2.noPlan
      - ideco.contributionLimit.category2.withDc
      - ideco.contributionLimit.category2.withDb
