  - id: investment.mutualAid
    title: 小規模企業共済
    status: approximated
    summary: >-
      入っています。掛金（制度の下限・上限で止める）は全額が小規模企業共済等掛金控除になり、共済金は一括（退職所得）・分割（公的年金等の雑所得）・
      併用で受け取れます。共済金の額は、掛金の累計からの近い値です。
    how: >-
      掛金は決済口座から払い、全額を所得控除にします。受け取りの月に、一括はその時の残高を退職所得の一時金（加入の始まりから受け取りの前の月までを
      勤続期間とみなす）として、分割は10年か15年・年6回で、受け取りの始まりの残高を回数で等分して払います（併用は一括の割合。省略は半分）。
      亡くなったときは、その時の残高を死亡を事由とする共済金として遺族が一時金で受け取ります（相続税の対象ですが、相続税はお金の流れに入れていません）。
    approximation: >-
      共済金の額の表（基本共済金・付加共済金）は持たず、残高は今の時価＋掛金に、資産の配分を入れたときはその利回り（入れなければ0）の運用益を足した額です。
      分割の間の利息は扱いません。
    reason: 共済金の額は掛金の月数・受け取りの理由で決まる表によるので、掛金の累計から近い値で見ています。
    instead: 共済金の見込み額が分かれば、今の残高（時価）か資産の配分の利回りで合わせてください。
    keywords: [小規模企業共済, 共済金, 掛金, 小規模企業共済等掛金控除, 経営者の退職金, 自営業の退職金, 分割共済金]
    items: [account.kind, account.contributions, account.payout, account.enrolledSince, account.assetMix]
    fields:
