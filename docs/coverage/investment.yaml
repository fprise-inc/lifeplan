  - id: investment.corporateDc
    title: 企業型DC（事業主掛金・マッチング拠出）
    status: included
    summary: >-
      入っています。企業型DCの事業主掛金と加入者掛金（マッチング拠出）を入れ、合計を拠出限度額で止めます。事業主掛金は世帯の支払いにせず、
      加入者掛金は所得控除になります。受け取りは iDeCo と同じ決まりです。
    how: >-
      事業主掛金と加入者掛金の合計を拠出限度額（2024年12月分からは他制度掛金相当額を引いた額）で止め、超えるときは加入者掛金から先に減らします。
      2026年11月分までは、加入者掛金を事業主掛金の額以下にします。運用益・受け取り・死亡一時金の扱いは iDeCo と同じです。
    keywords: [企業型DC, 企業型確定拠出年金, DC, 事業主掛金, マッチング拠出, 加入者掛金, 選択制DC]
