  - id: pension.record
    title: 加入の記録（ねんきん定期便の値の入れ方）
    status: approximated
    summary: >-
      ねんきん定期便（50歳未満・50歳以上）・年金額改定通知書（受け取り中）・見込額・加入歴のどれかで加入の記録を入れられます。記録を入れないときは、
      働き方の入力から加入の記録を推計します。
    how: >-
      50歳未満の定期便は加入月数と老齢厚生年金の額（これまでの加入の実績）、50歳以上の定期便は60歳まで今の条件で続けたときの見込額、改定通知書は
      今受け取っている年金額を入れます。加入歴の入れ方では、期間ごとの種別と報酬から計算します。記録の時点の後は、働き方の期間から国民年金の種別と
      厚生年金の標準報酬を足していきます。
    approximation: >-
      記録を入れないときは、働き方の期間から加入歴を推計し、計算の基準の年の前の年の11月より前の標準報酬は、その勤め先の期間の給与の入力（今の賃金の水準）
      から近い値にします。推計で計算したことは計算の知らせに出ます。
    reason: 記録が手元に無くても見通しを出せるようにするためです。定期便の値を入れると、記録どおりの額になります。
    instead: ねんきん定期便や年金額改定通知書の値を「年金」の入力項目に入れると、推計の代わりにその値で計算します。
    keywords: [ねんきん定期便, 加入記録, 加入歴, 年金額改定通知書, 見込額, 年金記録, 50歳以上, 50歳未満, 推計]
    items: [pensionRecord.kind, pensionRecord.asOf, pensionRecord.months, pensionRecord.amounts, pensionRecord.history, pensionRecord.member]
    fields:
      - 「年金」の入力項目の「年金の入れ方」
      - 「年金」の入力項目の「書類の種類」
      - 「年金」の入力項目の「受給資格期間の月数」
      - 「年金」の入力項目の「＋ 加入歴の行を足す」
    regulation: [pension.revaluationRate]
    components:
      pension.record: 6
    related:
      - pension.oldAgeBasic
      - pension.oldAgeEmployee
      - pension.category

  - id: pension.category
    title: 国民年金の第1号・第2号・第3号の区分
    status: approximated
    summary: >-
      区分は入力させず、働き方の期間と健康保険の扶養から月ごとに決めています。第2号は厚生年金に入る月、第3号は20〜59歳で第2号の配偶者に扶養される月、
      それ以外の20〜59歳の月は第1号です。
    how: >-
      65歳に達した後は第2号にしません。第3号は、その月の健康保険の種類が第2号の配偶者の扶養の月だけで、収入の見込み（その月の収入の状況が1年続くと
      したときの年額）で判定します。雇用保険の基本手当を受ける月は、基本手当日額×360が基準以上なら第3号にしません。第1号の母は、出産の前の月から
      4か月が産前産後の免除で、納めた月として数えます。万一の想定で亡くなる月からはどの区分でもなく、第2号の配偶者が亡くなった月からは第1号になります。
    approximation: >-
      第1号の保険料は納めたとみなします（免除・未納は加入の記録で入れます）。第3号の判定の収入の見込みには、遺族年金・障害年金と、扶養する配偶者の
      60〜64歳の老齢年金を入れないので、健康保険の扶養の判定と食い違うことがあります。
    reason: 年金の額は加入の記録から出し、加入の記録はこの区分から出すため、年金の額を区分の判定に使えない作りだからです。
    instead: 免除・猶予の月は「年金」の入力項目の「＋ 免除・猶予の月を入れる」で入れられます。
    keywords: [第1号被保険者, 第2号被保険者, 第3号被保険者, 国民年金の種別, 扶養, 3号, 専業主婦, 被保険者の区分]
    items: [employment.type, employment.pensionCategory, employment.healthInsurance.kind]
    fields:
      - 「年金」の入力項目の「＋ 免除・猶予の月を入れる」
    rules:
      - 国民年金法7条
      - 国民年金法88条の2
    regulation:
      - socialInsurance.nationalPension.fromAge
      - socialInsurance.nationalPension.untilAge
      - socialInsurance.nationalPension.category2UntilAge
      - socialInsurance.nationalPension.maternityExemption.months
    components:
      pension.category: 7
    related:
      - pension.record

  - id: pension.foreignPension
    title: 外国の年金
    status: approximated
    summary: >-
      外国の年金は、受け取る額（円）を「年金」の入力項目の入るお金の行で入れると、公的年金の行に載り、公的年金等以外の雑所得として税を計算します。
    how: 行ごとに受け取る人・年額・始まりと終わり・伸び方を入れ、受け取る月のお金の動きにします。
    approximation: >-
      税の計算では、公的年金等控除を当てず、公的年金等以外の雑所得として扱います。為替の動きは計算しません（入れた円の額を伸び方で伸ばします）。
    reason: 外国の年金を公的年金等の雑所得として扱うかを、まだ決めていないためです。
    instead: 行の課税の扱いは変えられます。
    keywords: [外国の年金, 海外の年金, 外国年金, 社会保障協定, 海外勤務]
    items: [incomeFlow.kind, incomeFlow.amount, incomeFlow.taxTreatment, incomeFlow.recipient]
    fields:
      - 「年金」の入力項目の入るお金の行の「外国の年金」
    rows: [cf.income.pension]
    components:
      income.flows: 3
    related:
      - tax.publicPensionDeduction

  - id: pension.additionalPension
    title: 付加年金・付加保険料
    status: notYet
    summary: まだ入っていません。第1号の付加保険料と、老齢基礎年金に足す付加年金は計算していません。
    reason: 付加保険料と付加年金の計算を、まだ作っていないためです。
    instead: >-
      付加年金の見込みの年額を「年金」の入力項目の入るお金の行で、付加保険料（月額）を出るお金の行で入れると、お金の流れには入ります
      （税の扱いは行の課税の扱いで選びます）。
    keywords: [付加年金, 付加保険料, 400円, 200円, 国民年金の上乗せ, 第1号]
