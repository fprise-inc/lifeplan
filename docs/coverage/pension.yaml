# 対応範囲の一覧（公的年金）。形は coverage.schema.json
area: pension
title: 公的年金
order: 5
entries:
  - id: pension.oldAgeBasic
    title: 老齢基礎年金
    status: included
    summary: >-
      入っています。加入の記録の納付月数（免除の月は割合で数える）から、満額×納付月数÷480で計算し、年度ごとの改定率で額を動かします。
      受給資格期間（10年）に足りないときは0円にして知らせます。
    how: >-
      満額は基準額×その年度の改定率（100円単位）で、保険料を納めた月数（全額・4分の3・半額・4分の1免除の月は法定の割合で数える）÷480を掛けます。
      ねんきん定期便などで額を入れたときは、その額×（その年度の改定率÷記録の年度の改定率）です。繰上げ・繰下げの減額・増額をした後に、
      振替加算を足します。支払いは偶数月に前の2か月分で、各支払いの1円未満を切り捨てます。
    keywords: [老齢基礎年金, 国民年金, 基礎年金, 満額, 納付月数, 480月, 受給資格期間, 10年, 免除]
    items: [pensionRecord.kind, pensionRecord.months, pensionRecord.amounts, pensionRecord.history]
    fields:
      - 「年金」の入力項目の「年金の入れ方」
      - 「年金」の入力項目の「書類の種類」
    rules:
      - 国民年金法27条
      - 国民年金法26条
    regulation:
      - pension.basic.baseAmount
      - pension.basic.maxMonths
      - pension.basic.fullAmount.rounding
      - pension.qualifyingMonths
      - pension.revisionRate
      - pension.payment.rounding
    rows: [cf.income.pension]
    components:
      pension.oldAgeBase: 6
      pension.oldAge: 8
      pension.revision: 3
    related:
      - pension.oldAgeEmployee
      - pension.claimTiming
      - pension.record

  - id: pension.oldAgeEmployee
    title: 老齢厚生年金（特別支給を含む）
    status: included
    summary: >-
      入っています。報酬比例の部分（平均標準報酬額×乗率×加入月数）と経過的加算を計算し、対象の生年月日の人には65歳前の特別支給の老齢厚生年金も
      出します。記録の後に厚生年金に入る月は、働き方の期間の報酬から足していきます。
    how: >-
      報酬比例の部分は、2003年3月までと4月からで別の乗率を使い、加入の記録の報酬を再評価した額に乗率と月数を掛けます。記録の後の報酬は、改定率で
      記録の年度の水準に直して足します。経過的加算は定額部分から基礎年金の相当額を引いた額です。65歳からは在職定時改定（毎年8月までの加入を
      10月分から）、辞めたときは退職改定（資格を失った月の翌月から）で、記録の後の加入を額に入れます。特別支給の老齢厚生年金は、生年月日と性別で
      決まる開始の年齢から、厚生年金の加入が1年以上の人に出します（見込額だけの記録でも生年月日から計算します）。雇用保険の基本手当を受ける月は
      65歳前の老齢厚生年金を止め、高年齢雇用継続給付を受ける月は決まった額を止めます。
    keywords: [老齢厚生年金, 厚生年金, 報酬比例, 経過的加算, 特別支給の老齢厚生年金, 平均標準報酬額, 在職定時改定, 退職改定, 加入月数]
    items: [pensionRecord.amounts, pensionRecord.months, pensionRecord.history, employment.salary.annual, employment.pensionCategory]
    fields:
      - 「年金」の入力項目の「平均標準報酬額（月額・今の水準）」
      - 「年金」の入力項目の「経過的加算」
    rules:
      - 厚生年金保険法43条
      - 厚生年金保険法附則8条
    regulation:
      - pension.employee.accrualRate.pre2003
      - pension.employee.accrualRate.post2003
      - pension.employee.flatRate.baseAmount
      - pension.employee.flatRate.maxMonths
      - pension.specialOldAge.startAge
      - pension.specialOldAge.requiredMonths
      - pension.revaluationRate
      - pension.employee.revisionFactor
    rows: [cf.income.pension]
    components:
      pension.oldAgeBase: 6
      pension.oldAge: 8
      pension.record: 6
    related:
      - pension.workingPension
      - pension.claimTiming
      - pension.supplements

  - id: pension.claimTiming
    title: 繰上げ・繰下げ
    status: included
    summary: >-
      入っています。老齢基礎年金と老齢厚生年金の受け取り開始を、別々に月単位で入れられます。減額率・増額率は生年月日で決まる率を使います。
    how: >-
      繰上げは早めた月数×減額率、繰下げは遅らせた月数×増額率（上限の月数まで）で額を変えます。加給年金と振替加算は増額しません。繰上げは基礎と厚生を
      同時に請求する決まりなので、片方だけ早めた入力は早い方の月にそろえて計算し、知らせます。66歳になる前の受け取り始めは繰下げにならないので、
      増額なしで65歳からの分を受け取るとして計算します。繰下げの待機中に在職老齢年金で止まるはずの額は、増額の対象から除きます。66歳になる前に
      遺族年金の受給権を得ると繰り下げられず、66歳の後に得るとその時に繰下げの申出があったとみなします。
    keywords: [繰上げ, 繰下げ, 受給開始, 減額率, 増額率, 75歳, 60歳, 受け取り開始, 年金の受け取り時期]
    items: [pensionRecord.claim, member.pensionClaim]
    fields:
      - 「年金」の入力項目の「受け取り開始」
    rules:
      - 国民年金法28条
      - 国民年金法附則9条の2
      - 厚生年金保険法44条の3
    regulation:
      - pension.earlyClaim.reductionRate
      - pension.earlyClaim.maxMonths
      - pension.deferral.increaseRate
      - pension.deferral.maxMonths
      - pension.normalStartAge
    rows: [cf.income.pension]
    components:
      pension.oldAgeBase: 6
      pension.survivorRight: 3
    related:
      - pension.oldAgeBasic
      - pension.oldAgeEmployee
      - pension.survivor

  - id: pension.workingPension
    title: 在職老齢年金
    status: included
    summary: >-
      入っています。厚生年金に入って働く月（70歳以上で働く月も）は、（基本月額＋総報酬月額相当額−支給停止調整額）÷2を、老齢厚生年金から止めます。
      全部止まる月は加給年金も止めます。
    how: >-
      基本月額は老齢厚生年金の報酬比例の部分（繰上げの減額の後、繰下げの増額の前）、総報酬月額相当額はその月の標準報酬月額と、その月までの1年の
      標準賞与額の合計÷12です。働き方の期間の給与・賞与から標準報酬月額・標準賞与額を出して使います。支給停止調整額は年度ごとの制度の値で、
      制度データの後の年度は、値のある最後の年度の額に賃金上昇率（前提）を掛けて1万円単位に四捨五入します。老齢基礎年金は止めません。
    keywords: [在職老齢年金, 在老, 支給停止, 働きながら年金, 支給停止調整額, 総報酬月額相当額, 基本月額, 在職停止]
    items: [employment.salary.annual, employment.salary.bonus, employment.standardMonthlyRemuneration, assumptions.wageGrowth]
    fields:
      - 「働き方と収入」の入力項目の年収と賞与
    rules:
      - 厚生年金保険法46条
    regulation:
      - pension.workingAdjustment.threshold
      - pension.workingAdjustment.threshold.rounding
    rows: [cf.income.pension]
    components:
      pension.oldAgeBase: 6
      pension.oldAge: 8
    related:
      - pension.oldAgeEmployee
      - income.retirementAge
      - pension.claimTiming

  - id: pension.supplements
    title: 加給年金・振替加算
    status: included
    summary: >-
      入っています。厚生年金の加入が240月以上の人に、65歳未満の配偶者と子（18歳に達した後の最初の3月31日まで）の加給年金を足し、配偶者が65歳に
      なったら、配偶者の老齢基礎年金に生年月日で決まる振替加算を足します。
    how: >-
      配偶者の加給年金は、配偶者が厚生年金240月以上の老齢厚生年金の受給権を持つ月（受け取っていなくても）と、配偶者が障害年金を受ける月は止めます。
      令和10年4月以後に要件を満たした人の配偶者の加給年金と特別加算は、改正後の額です（それより前に加算された人は従前の額）。加給年金の額には、
      受給者の年齢によらず新しく受け取り始める人の改定率を掛けます。振替加算は基準額×改定率×生年月日ごとの率です。どちらも繰上げ・繰下げで増減しません。
    keywords: [加給年金, 振替加算, 配偶者加給, 特別加算, 年下の配偶者, 子の加算, 240月, 家族手当]
    items: [pensionRecord.months, member.birth]
    rules:
      - 厚生年金保険法44条
      - 厚生年金保険法46条6項
      - 国民年金法等の一部を改正する法律（昭和60年法律第34号）附則14条
    regulation:
