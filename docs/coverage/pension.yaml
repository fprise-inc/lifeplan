      - pension.spouseSupplement.specialAddition
      - pension.spouseSupplement.requiredMonths
      - pension.spouseSupplement.spouseUntilAge
      - pension.spouseSupplement.reform2028.baseAmount
      - pension.spouseSupplement.reform2028.specialAddition
      - pension.childSupplement.firstTwoBaseAmount
      - pension.childSupplement.thirdBaseAmount
      - pension.transferAddition.baseAmount
      - pension.transferAddition.coefficient
    rows: [cf.income.pension]
    components:
      pension.oldAgeBase: 6
      pension.employeeMonths: 3
      pension.oldAge: 8
    related:
      - pension.oldAgeEmployee
      - pension.workingPension

  - id: pension.survivor
    title: 遺族年金（遺族基礎年金・遺族厚生年金）
    status: approximated
    summary: >-
      入っています。万一の想定で配偶者・親が亡くなったとき、亡くなった人の加入の記録から遺族基礎年金・遺族厚生年金・中高齢寡婦加算・経過的寡婦加算・
      寡婦年金・死亡一時金を計算します。保険料の納付要件は満たすとみなし、2028年4月からの見直しは入れていません。
    how: >-
      遺族基礎年金は、子のある配偶者か子に、基本額×改定率＋子の加算（2人目まで・3人目から）です。遺族厚生年金は、死亡の月の前の月までの記録の報酬比例の額×3/4で、
      短期要件（亡くなったとき厚生年金に入っていた）は300月に満たなければ300月とみなし、長期要件は実際の月数です。妻は年齢を問わず（死亡の当時30歳未満で
      子が無ければ5年）、夫は死亡の当時55歳以上で60歳から（遺族基礎年金を受ける間は60歳前でも）受けます。死亡の当時55歳未満の夫には遺族厚生年金の受給権が無く、子が受けます。
      配偶者が65歳になった後は、自分の老齢厚生年金を先に受け、遺族厚生年金はそれを超える分だけです。中高齢寡婦加算（40〜65歳の妻）・経過的寡婦加算・
      寡婦年金（第1号の期間の夫）・死亡一時金（寡婦年金と両方なら総額の多い方）も計算します。65歳になる前に自分の老齢年金と両方受けられる月は、多い方を選ぶとします。
    approximation: >-
      保険料の納付要件は満たすとみなします。2028年4月からの遺族年金の見直し（遺族厚生年金の有期化・子の加算の見直しなど）は入れず、見直し前の制度で計算し、
      2028年4月以後に亡くなる想定では知らせを出します。寡婦年金・死亡一時金で要る国民年金の第1号の納付月数が記録に無いときは、厚生年金の月を除いた
      20〜59歳の月を納めた月とみなします。65歳前に自分の老齢年金と選ぶときは、自分の老齢年金を止めずに表に残すので、税・保険料はその前提の近い値です。
    reason: >-
      見直しの後の細かい決まり（経過措置・所得の要件など）を確かめてから入れるためです。納付要件は、記録から未納の期間を正しく判定できないためです。
    instead: >-
      今受け取っている遺族年金は、「年金」の入力項目の「受け取っている遺族年金・障害年金」で年額を入れられます。
    keywords: [遺族年金, 遺族基礎年金, 遺族厚生年金, 中高齢寡婦加算, 寡婦年金, 死亡一時金, 経過的寡婦加算, 遺族, 死亡, 万一]
    items: [contingency.kind, contingency.member, contingency.occurs, contingency.survivor, pensionRecord.history, incomeFlow.pensionType]
    fields:
      - 「万一の想定」の死亡の想定
      - 「年金」の入力項目の「受け取っている遺族年金・障害年金」
    rules:
      - 国民年金法37条
      - 国民年金法49条
      - 国民年金法52条の2
      - 厚生年金保険法58条
      - 国民年金法20条
      - 厚生年金保険法38条
    regulation:
      - pension.basic.baseAmount
      - pension.childSupplement.firstTwoBaseAmount
      - pension.childSupplement.thirdBaseAmount
      - pension.survivor.employee.ratio
      - pension.survivor.employee.deemedMonths
      - pension.survivor.husbandMinAge
      - pension.survivor.youngWidowMonths
      - pension.survivor.widowAddition.ratio
      - pension.widowPension.ratio
      - pension.deathLumpSum
