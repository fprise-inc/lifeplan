      - pension.oldAgeBasic

  - id: pension.supplementaryBenefit
    title: 年金生活者支援給付金
    status: included
    summary: >-
      老齢の年金生活者支援給付金は入っています。65歳以上で老齢基礎年金を受け、世帯全員が住民税非課税で、所得が基準以下の年に計算します。
      障害・遺族の年金生活者支援給付金は計算していません。
    how: >-
      給付の額は給付基準額×保険料納付済の月数÷480で、加入の記録に第1号の内訳（免除の月）があるときは免除期間の分も足します。所得が基準額を超え
      補足的所得基準額以下なら、補足的老齢年金生活者支援給付金（調整した額）です。10月から翌年9月までを、前の年の所得とその年度の住民税で判定し、
      年金と同じ偶数月に払います（非課税）。補足的所得基準額が制度データに無い年は、その給付を計算せず知らせます。
    keywords: [年金生活者支援給付金, 支援給付金, 低所得の年金, 補足的老齢年金生活者支援給付金, 住民税非課税]
    rules:
      - 年金生活者支援給付金の支給に関する法律
    regulation:
      - pension.supplementaryBenefit.baseMonthly
      - pension.supplementaryBenefit.incomeLimit
      - pension.supplementaryBenefit.supplementaryIncomeLimit
    rows: [cf.income.benefit]
    components:
      pension.supplementaryBenefit: 7
    related:
      - pension.oldAgeBasic

  - id: pension.revision
    title: 年金額の改定（マクロ経済スライド）
    status: approximated
    summary: >-
      制度データにある年度は国の改定率を使い、その後の年度は前提の物価上昇率・賃金上昇率とマクロ経済スライドの調整率から改定率を計算して、
      将来の年金額を動かします。
    how: >-
      年度ごとに、68歳に達した年度からは物価（賃金が物価より低いときは賃金）、それより前は賃金の伸びで改定し、マクロ経済スライドの調整率を引きます。
      名目で下がらないようにし、引ききれない調整は翌年度以後に繰り越します。基礎年金と厚生年金（報酬比例）の調整率は別に入れられます（入れなければ同じ）。
    approximation: >-
      先の年度の改定は、前の年の物価上昇率と賃金上昇率（前提）で計算し、法令の名目手取り賃金変動率（過去3年度の実質賃金の平均など）の代わりにしています。
      スライドの調整率と、調整が終わる時期は前提として入れた値のままです。延ばした年度は計算の知らせに出ます。
    reason: 将来の物価・賃金・被保険者数は分からないので、FP が入れた経済の前提から年金額の伸びを見るためです。
    keywords: [マクロ経済スライド, 年金額の改定, 改定率, 年金の伸び, 物価スライド, 賃金スライド, 年金の目減り, 調整率]
    items: [assumptions.inflation, assumptions.wageGrowth, assumptions.pensionMacroSlide, assumptions.pensionMacroSlideEmployee]
    fields:
