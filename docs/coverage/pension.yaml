  - id: pension.disability
    title: 障害年金（障害基礎年金・障害厚生年金）
    status: approximated
    summary: >-
      入っています。万一の想定の「障害」で、FP が選んだ等級（1〜3級）の障害年金を、障害認定日（初診日から1年6か月）の翌月から計算します。
      65歳からは、障害年金と老齢年金の組み合わせのうち手取りが多いものを月ごとに選びます。
    how: >-
      障害基礎年金（1・2級）は、2級が基本額×改定率、1級はその1.25倍で、子の加算を足します。障害厚生年金（初診日に厚生年金に入っていたとき。1〜3級）は、
      障害認定日の月までの記録の報酬比例の額（300月に満たなければ300月とみなす）で、1級は1.25倍、1・2級は配偶者の加給年金額（配偶者が65歳になるまで）を足し、
      3級は最低保障の額があります。初診日に厚生年金に入っていない人は障害基礎年金だけです。65歳からは、障害基礎＋障害厚生・老齢基礎＋老齢厚生・障害基礎＋
      老齢厚生のうち手取りの多い組み合わせを選びます（FP が選び直すこともできます）。働けるようになる月を入れたときは、その前の月までです。
      繰上げで老齢年金を受け始めた後に初診日がある障害で、初診日に厚生年金に入っていない人は受けられません。
    approximation: >-
      等級は FP が選ぶ「該当した場合」の仮定で、保険料の納付要件は満たすとみなします。障害認定日の障害だけを扱い、事後重症は扱いません。組み合わせを選ぶ
      ときの手取りは、その年金だけを収入とした所得税・住民税の見積もり（ほかの所得・社会保険料を入れない）で比べます。子の加算と子の加給年金の調整は扱いません。
    reason: 障害の状態や認定は個別に決まるため、FP が等級を仮定して「該当した場合」の見通しを出す作りにしています。
    instead: >-
      今受け取っている障害年金は、「年金」の入力項目の「受け取っている遺族年金・障害年金」で年額を入れられます。
    keywords: [障害年金, 障害基礎年金, 障害厚生年金, 障害等級, 障害認定日, 初診日, 1級, 2級, 3級, 障害]
    items: [contingency.kind, contingency.grade, contingency.occurs, contingency.recovery, contingency.oldAgeChoice]
    fields:
      - 「万一の想定」の障害の想定
      - 「年金」の入力項目の「受け取っている遺族年金・障害年金」
    rules:
      - 国民年金法30条
      - 国民年金法33条
      - 厚生年金保険法47条
      - 厚生年金保険法50条
      - 厚生年金保険法50条の2
