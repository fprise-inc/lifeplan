  - id: tax.publicPensionDeduction
    title: 公的年金等控除
    status: included
    summary: 入っています。公的年金や、iDeCo・企業年金を年金で受け取った額などを公的年金等の収入とし、公的年金等控除を引いて雑所得にします。
    how: >-
      公的年金等の収入は、老齢の公的年金、iDeCo・企業型DCの年金、確定給付企業年金・年金払い退職給付・国民年金基金の年金、
      小規模企業共済の分割共済金です。控除額は、その年の12月31日の年齢（65歳未満・以上）と、公的年金等以外の合計所得金額（1,000万円以下・2,000万円以下・超）の
      表（収入×率＋額）で決めます。令和9年分からは、給与所得控除額と公的年金等控除額の合計が上限を超える分を公的年金等控除額から除きます。
      確定申告不要制度（公的年金等の収入400万円以下・その他の所得20万円以下）も入っています。
    keywords: [公的年金等控除, 年金の税金, 雑所得, 確定申告不要, 65歳以上, 年金と給与]
    rules:
      - 所得税法35条
    regulation:
      - incomeTax.publicPensionDeduction.under65.tier1
      - incomeTax.publicPensionDeduction.over65.tier1
      - incomeTax.publicPensionDeduction.combinedLimit
      - incomeTax.pensionFilingExemption.revenueLimit
    components:
      tax.publicPensionIncome: 4
      incomeTax.annual: 7
    related:
      - tax.incomeTaxFlow
      - tax.incomeAdjustment

  - id: tax.retirementIncome
    title: 退職所得控除と退職所得の税
    status: included
    summary: >-
      入っています。退職金やiDeCo・企業型DCの一時金、小規模企業共済の共済金を受け取る年に、勤続年数から退職所得控除を出し、分離課税で所得税と住民税を計算します。
    how: >-
      その年に受け取る一時金を合わせ、勤続期間（重なりは1回）の年数（1年未満切り上げ）から退職所得控除額（20年以下は40万円×年数、20年超は800万円＋70万円×
      （年数−20）。最低80万円。障害者になったことによる退職は100万円を足す）を出します。前の年に受けた一時金と期間が重なるときは、退職手当等は前年以前4年内
      （確定拠出年金の一時金の後は9年内）、確定拠出年金の一時金は前年以前19年内の重なる分の控除額を引きます。退職所得は（収入−控除）×1/2で、
      役員等の勤続5年以下は1/2にせず、役員以外の勤続5年以下は控除の後の300万円を超える部分を1/2にしません。課税退職所得金額に所得税の税率と付加税、
      住民税の所得割の率を掛け、受け取る月に源泉徴収・特別徴収します（退職所得の受給に関する申告書を出したものとします）。
      役員の期間と一般の期間の一時金を同じ年に受けるときは、控除額を分ける近い値で計算し、知らせを出します。
    keywords: [退職所得控除, 退職所得, 退職金の税金, 勤続年数, 一時金, 5年ルール, 19年ルール, 分離課税]
    items: [retirementBenefit.amount, retirementBenefit.service, retirementBenefit.officerService, retirementBenefit.disability, retirementBenefit.paidAt]
    fields:
      - 「退職金・企業年金」の入力項目の退職金
      - 「退職金・企業年金」の入力項目の障害者になったことによる退職
    rules:
      - 所得税法30条
      - 所得税法施行令70条
    regulation:
      - incomeTax.retirementIncome.deduction.perYearFirst
      - incomeTax.retirementIncome.deduction.perYearAfter
      - incomeTax.retirementIncome.deduction.minimum
      - incomeTax.retirementIncome.overlap.lookbackYears
      - incomeTax.retirementIncome.overlap.lookbackYearsForDc
      - incomeTax.retirementIncome.shortTerm.halfLimit
    rows: [cf.taxSi.incomeTax.retirement, cf.taxSi.residentTax.retirement]
    components:
      tax.retirementIncome: 2
    related:
      - income.retirementBenefit
      - investment.idecoPayout

  - id: tax.residentTaxExemption
    title: 住民税の非課税
    status: approximated
    summary: >-
      近似して入っています。前の年の所得が非課税限度額以下なら、均等割・所得割をかけません。寡婦・ひとり親で前の年の合計所得金額が135万円以下の人も非課税にします。
      限度額は1級地の値で判定します。
    how: >-
      均等割は合計所得金額が「基本額×人数＋加算＋（扶養があれば）扶養の加算」以下なら、所得割は総所得金額等が同じ形の額以下なら非課税です。
      人数は本人・同一生計配偶者・扶養親族（16歳未満を含む）です。寡婦・ひとり親で前の年の合計所得金額が135万円以下の人は、均等割・所得割とも非課税です。
      非課税の判定は、保育料・高額療養費の区分・65歳以上の介護保険料の段階などの判定にも使います。
    approximation: 非課税限度額は生活保護の級地で市区町村ごとに違いますが、1級地（大都市）の値で判定します。
    reason: >-
      市区町村ごとの値を持たない作りにしているためです。1級地の基準は級地の中で最も高いので、それを超えればどの級地でも課税です。
      級地で結果が変わりうるときだけ知らせを出します。
    keywords: [住民税非課税, 非課税世帯, 非課税限度額, 均等割, 級地, 135万円]
    items: [member.maritalStatus]
    rules:
      - 地方税法295条
      - 地方税法24条の5
    regulation:
      - residentTax.exemption.perCapita.perPerson
      - residentTax.exemption.perCapita.addition
      - residentTax.exemption.incomeLevy.perPerson
      - residentTax.exemption.personal.incomeLimit
    components:
      residentTax.exemption: 6
    related:
      - tax.residentTax
      - tax.singleParentDeduction
      - socialInsurance.highCostMedical

  - id: tax.blueReturn
    title: 青色申告（特別控除・純損失の繰越）
    status: included
    summary: >-
      入っています。事業所得や不動産所得のある人は、申告の仕方（青色・白色）を入れると、青色申告特別控除（65万円・55万円・10万円）と、
      引ききれない損失（純損失）の翌年以後3年の繰越控除を計算します。入れないときは白色（控除なし）とみなします。
    how: >-
      青色申告特別控除の55万円・65万円は、事業所得があるか不動産所得が事業的規模（室数＋棟数×2が10以上。5棟10室の目安）のときだけで、当たらなければ10万円で
      計算し知らせます。控除の上限は不動産所得と事業所得の黒字の合計で、不動産所得・事業所得の順に引きます。
      損益通算をしても引ききれない損失は、青色の人だけ翌年以後3年、古い年の分から総所得金額から引きます（所得税・住民税・国民健康保険料・後期高齢者医療の保険料の
      所得割の基）。白色の人の引ききれない損失は捨てます。毎年青色申告を続けるものとします。
    keywords: [青色申告, 青色申告特別控除, 65万円控除, 白色申告, 純損失の繰越, 損失の繰越控除, 個人事業主, 確定申告]
    items: [member.taxReturn]
    fields:
      - 「働き方と収入」の入力項目の申告の仕方と青色申告特別控除
      - 「収益不動産」の入力項目の申告の仕方と青色申告特別控除
    rules:
      - 租税特別措置法25条の2
      - 所得税法70条
      - 地方税法313条8項
    regulation:
      - incomeTax.blueReturnDeduction.electronic
      - incomeTax.blueReturnDeduction.doubleEntry
      - incomeTax.blueReturnDeduction.simple
      - incomeTax.netLoss.carryforwardYears
    components:
      tax.totalIncomeBase: 3
      tax.lossCarryforward: 1
      residentTax.annual: 10
    related:
      - tax.incomeTaxFlow
      - income.business
      - realEstate.income

