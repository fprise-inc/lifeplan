  - id: income.advisoryFee
    title: FP顧問料
    status: included
    summary: >-
      入っています。FP顧問料の契約ごとに、単発の料金（相談料・プラン作成料）と継続の顧問料（月額か年額・始まりと終わり・料金の段階）を入れ、
      基本生活費とは別の行に載せます。既定では提案の側のプランにだけ入れます。
    how: >-
      単発は払う年月に一度、継続は始まりから終わりまで、月額なら毎月、年額なら毎年始まりの月に払います。料金の段階（その月からの額）と値上げの率
      （1年ごと）で額を変えられます。金額は税込みです。契約ごとに、その案で計算に入れるかを選べます（現状にも入れることもできます）。
      個人が払う顧問料は所得税・住民税の控除にしていません（家計の支出として数えます）。払う人が万一の想定で亡くなった月の翌月からは、
      相続する人が払う形にします。
    keywords: [FP顧問料, 顧問料, 相談料, プラン作成料, 継続の顧問料, FPへの報酬, 料金]
    items: [advisoryFee.terms, advisoryFee.payer, advisoryFee.enabled]
    fields:
      - 「前提条件」の入力項目の「FP顧問料」
      - 「前提条件」の入力項目の「現状にも入れる」
    rows: [cf.expense.advisoryFee]
    components:
      expense.advisoryFee: 4

  - id: income.reconcile
    title: 実際の貯蓄額との答え合わせ（使途不明金）
    status: included
    summary: >-
      入っています。実際の年間の貯蓄額を入れると、計算上の貯蓄額（その年の年間収支）との差を使途不明金として出し、将来の年にも見込みます。
    how: >-
      比べるのは12か月そろった年です（計算の基準の年の途中から始まるときは翌年）。差は、確かめる年から「差を見込む終わり」まで、物価上昇率で
      伸ばして毎月載せます。扱いは「生活費に足す」か「使途不明金として残す」を選べます。実際のほうが計算より多く貯まっている（差が0以下）ときは載せず、
      計算の知らせに出します。
    keywords: [使途不明金, 答え合わせ, 検算, 実際の貯蓄額, 家計の差, 貯蓄額]
    items: [savingsCheck.actualSavings, savingsCheck.year, savingsCheck.treatment, savingsCheck.until]
    fields:
      - 「基本生活費」の入力項目の「実際の年間の貯蓄額」
      - 「基本生活費」の入力項目の「確かめる年」
      - 「基本生活費」の入力項目の「計算との差の扱い」
    rows: [cf.expense.other.unexplained, cf.expense.living]
    components:
      expense.reconcile: 1
    related:
      - income.livingExpense
