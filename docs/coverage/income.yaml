  - id: income.car
    title: 車の費用（買い替え・ローン・維持費・リース）
    status: included
    summary: >-
      入っています。車ごとに、買い替えの周期・車両の価格・下取り・自動車ローン・車検・自動車保険・自動車税・駐車場・燃料などを入れ、
      手放す時期まで計算します。リース・長期レンタルの月額も入れられます。車の評価額は資産の表に載せます。
    how: >-
      買い替えは最初の購入の月から周期ごとに（手放す月には買わない）、車両の価格（今の値段で入れ、伸び方で伸ばす）から2回目からの下取りを引き、
      ローンで借りる分を除いた額を購入の月に払います。自動車ローンは購入のたびに固定金利で返済を計算します。車検は購入から3年後、その後2年ごと
      （変えられます）、自動車保険は毎年の購入の月、自動車税は毎年5月、維持費・駐車場・燃料は年額の12分の1を毎月です。維持費は合計か内訳の
      どちらかで数えます。評価額は、買った月の価格から次の買い替えの月の下取りの額まで定額で下がるとみなします（金融資産の合計には入れません）。
      万一のときの扱いを入れていない車は、名義の人が亡くなったら手放すとみなし、それまでのローンの返済は相続する人が続けます。
    keywords: [車, 自動車, 買い替え, 車検, 自動車税, 自動車保険, カーローン, リース, 維持費, 車の評価額]
    items:
      - car.purchase
      - car.replace
      - car.loan
      - car.inspection
      - car.insurance
      - car.tax
      - car.upkeep
      - car.upkeepMode
      - car.lease
      - car.until
      - car.onContingency
    fields:
      - 「車」の入力項目の「買い替えの周期」
      - 「車」の入力項目の「車両の価格」
      - 「車」の入力項目の「下取り」
      - 「車」の入力項目の「維持費の入れ方」
      - 「車」の入力項目の「手放す時期」
    rows:
      - cf.expense.lumpSum.car
      - cf.expense.living.car
      - cf.expense.insurance.nonLife
      - cf.expense.debt.car
      - cf.balance.account.car
    components:
      expense.car: 6
      asset.car: 4
    related:
