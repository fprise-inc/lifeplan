  - id: socialInsurance.highCostMedical
    title: 高額療養費
    status: approximated
    summary: >-
      近似して入っています。万一の想定（障害・就業不能）の医療費から、窓口の負担（3割）を高額療養費の自己負担の上限で止めた額を支出にします。
      多数回該当と、令和8年8月からの年間上限も入っています。70歳以上の区分は作っていません。
    how: >-
      万一の想定に入れた1か月の医療費（10割）と月数から、窓口の負担を出し、所得の区分の上限（基準の額＋（医療費−基準の医療費）×1%、または定額）で止めます。
      所得の区分は、勤め先の健康保険なら標準報酬月額、国民健康保険なら同じ世帯の国民健康保険の人の基準所得額（総所得金額等−住民税の基礎控除）の合計
      （療養の月が8〜12月なら前の年、1〜7月なら前々年）、住民税が非課税なら最も低い区分です。直近12か月に3回以上上限に達していれば、4回目から多数回該当の額です。
      令和8年8月からは、8月〜翌年7月の負担の合計を年間上限で止め、令和9年8月からの区分の細分化も制度データで当てます。年収約200万円以下の年間上限の
      さかのぼりの払い戻しは、高額療養費などの医療の給付の行に入れます。
    approximation: >-
      70歳以上の区分（外来の特例・2割や1割の負担）は作らず、70歳以後の月も70歳未満の区分と3割の負担で計算します。
    reason: 70歳以上の高額療養費の区分と負担の割合の判定をまだ作っていないためです。70歳以後の月があるときは知らせを出します。
    keywords: [高額療養費, 自己負担限度額, 医療費の上限, 多数回該当, 年間上限, 限度額適用認定証]
    items: [contingency.medical, contingencyPremise.medical]
    fields:
      - 万一の想定の医療費（1か月）と医療費の月数
    rules:
      - 健康保険法115条
      - 健康保険法施行令42条
      - 国民健康保険法施行令29条の3
