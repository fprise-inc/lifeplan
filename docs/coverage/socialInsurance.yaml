  - id: socialInsurance.leaveExemption
    title: 産休・育休中の保険料の免除
    status: included
    summary: 入っています。産前産後休業・育児休業の月は、勤め先の健康保険・厚生年金の保険料を免除し、年金の記録には休業の前の標準報酬月額のまま数えます。
    how: >-
      働き方の期間を「休業中」にして休業の種類（産前産後休業・育児休業）を選んだ月は、健康保険（介護・子ども・子育て支援金を含む）と厚生年金の保険料をかけません。
      休業中は直前の勤め先の保険を引き継ぎ、標準報酬月額も休業の前の額のままです。国民年金の第1号の母の産前産後の免除は、国民年金の保険料の項目にあります。
    keywords: [産休の保険料免除, 育休の保険料免除, 産前産後休業, 育児休業, 社会保険料の免除]
