# 対応範囲の一覧（社会保険〔健康保険・厚生年金・介護・雇用〕）。形は coverage.schema.json
area: socialInsurance
title: 社会保険（健康保険・厚生年金・介護・雇用）
order: 4
entries:
  - id: socialInsurance.employeeHealth
    title: 勤め先の健康保険料（標準報酬・賞与）
    status: included
    summary: >-
      入っています。勤め先の健康保険に入る月は、標準報酬月額（賞与は標準賞与額）に保険料率を掛けた本人負担分を、給与・賞与から引く形で載せます。
      40〜64歳は介護保険料も足します。
    how: >-
      標準報酬月額は、9月〜翌年8月は4〜6月の報酬の平均（定時決定）、年の途中で入った年は入った月の報酬（資格取得時決定）で、等級表に当てます。
      保険料は翌月の給与から引きます。賞与は標準賞与額（年度の累計に上限）に掛けます。率は、協会けんぽは支部ごとの料率、健康保険組合・共済組合は
      「健康保険料率（本人負担分）」の欄の率です。健康保険・介護・子ども・子育て支援金を合わせた率で1回だけ端数を処理し、折半した額を本人の負担にします。
      75歳からは後期高齢者医療に移ります。給与明細・標準報酬決定通知書の標準報酬月額を入れたときは、その額を使います。
    keywords: [健康保険料, 協会けんぽ, 健康保険組合, 標準報酬月額, 標準賞与額, 社会保険料, 給与天引き]
    items: [employment.healthInsurance.kind, employment.healthInsurance.insurer, employment.healthInsurance.employeeRate, employment.standardMonthlyRemuneration, employment.salary.annual, employment.salary.bonus]
    fields:
      - 「働き方と収入」の入力項目の健康保険
      - 「働き方と収入」の入力項目の協会けんぽの支部
      - 「働き方と収入」の入力項目の健康保険料率（本人負担分）
    rules:
      - 健康保険法156条
      - 健康保険法41条
    regulation:
      - socialInsurance.health.kyokaikenpo.rate
      - socialInsurance.health.standardMonthlyRemuneration
      - socialInsurance.health.standardBonus.annualLimit
      - socialInsurance.employeeShare.rounding
    rows: [cf.taxSi.health]
    components:
      socialInsurance.health: 4
      socialInsurance.coverage: 4
    related:
