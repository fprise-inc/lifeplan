      - socialInsurance.highCostMedical.under70.threshold
      - socialInsurance.highCostMedical.under70.multiple
      - socialInsurance.highCostMedical.under70.annualLimit
      - socialInsurance.highCostMedical.tierByStandard
      - socialInsurance.highCostMedical.tierByIncome
    rows: [cf.expense.care.medical, cf.income.benefit.medical]
