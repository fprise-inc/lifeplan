# 対応範囲の一覧（計算の基本の決まり）。形は coverage.schema.json
area: basics
title: 計算の基本の決まり
order: 1
entries:
  - id: basics.monthlyAndYearly
    title: 月ごとの計算と表の年の集計
    status: included
    summary: >-
      入っています。計算は月を単位にしています。給与・年金・税・保険料などのお金の動きを、実際に払う（受け取る）月ごとに作り、キャッシュフロー表では
      その月の属する年に集めて載せます。
    how: >-
      計算は「計算の基準の月」から始め、年額のものは月に分けて載せます（給与は年収÷12を毎月、賞与は支給月〔省略は6月・12月〕、
      基本生活費は年額を12か月に分けて毎月）。表の年の集計は、お金が出入りした月で数えます（現金の出入り）。そのため、受け取った年・払った年に
      載ります。たとえば公的年金は偶数月に前の2か月分を受け取るので、12月分は翌年2月の受け取りとして翌年の欄に入ります。住民税は前の年の所得に
      かかり6月から翌年5月に払う、確定申告の精算は翌年3月、というように、税・保険料もそれぞれの納める月の年に入ります。
      計算の基準の月が年の途中のときは、その年は数か月分しかないので、表は翌年から見せます。
      数え方は「前提条件」の入力項目の「計算の決まり: お金の数え方」に表示しています（変えられません）。
    keywords: [月単位, 月ごと, 支払月, 現金主義, 受け取った年, 払った年, 偶数月, 年の集計, 計算の基準の月, お金の数え方]
    items: [plan.baseMonth, employment.salary.bonusMonths]
    fields:
      - 「前提条件」の入力項目の「計算の基準の月」
      - "「前提条件」の入力項目の「計算の決まり: お金の数え方」"
    rows: [cf.net, cf.income.pension]
    components:
      plan.flows: 15
      pension.oldAge: 8
    related:
      - basics.ageCounting
      - basics.tableEnd

  - id: basics.ageCounting
    title: 年齢の数え方
    status: included
    summary: >-
      入っています。生年月と「1日生まれかどうか」で年齢を数え、制度ごとの決まり（〇歳に達した月・その翌月・誕生月・
      〇歳に達した後の最初の3月31日・学年など）で、切り替わる月を決めています。
    how: >-
      生年月日は「生年月」と「1日生まれか」で持ちます。年齢に達する日は誕生日の前日なので、1日生まれの人だけ、達する月が誕生月の前の月になります。
      年金の受け取りの始まり（65歳に達した月の翌月）、子の加算や児童手当の対象（18歳に達した後の最初の3月31日まで）、学校の学年（4月2日〜翌年4月1日生まれを
      同じ学年とする）など、制度ごとに決まった数え方で切り替わる月を決めます。キャッシュフロー表の年齢の行は、その年の12月末の年齢です。
    keywords: [年齢, 誕生日, 1日生まれ, 達する日, 年齢到達, 学年, 3月31日, 早生まれ, 生年月日]
    items: [member.birth]
    fields:
      - 「家族」の入力項目の生年月
    rules:
      - 年齢計算ニ関スル法律
    related:
      - basics.monthlyAndYearly

  - id: basics.growthRates
    title: 物価上昇率・賃金上昇率
    status: included
    summary: >-
      入っています。基本生活費などの支出は物価上昇率で、給与・事業所得は賃金上昇率で、毎年伸ばします。率は年ごとに変えられ、
      例外の年も入れられます。教育費の上昇率も別に入れられます（入れなければ物価上昇率と同じ）。
    how: >-
      支出の額は計算の基準の年の価格（今の値段）で入れ、伸び方を「物価に合わせる」にした額（基本生活費・何年かごとの支出・車・FP顧問料など）は、
      前提の物価上昇率で1年ごとに伸ばします（円未満切り捨て）。給与と事業所得は賃金上昇率で暦年ごとに伸ばします（働き方の期間に昇給カーブや
      増減率を入れたときはそれを使います）。どちらも年ごとの率の列で、「例外の年」でその間だけ別の率にできます。
      物価上昇率と賃金上昇率は、将来の年金額の改定の計算にも使います。新しい世帯の既定は、物価・賃金とも年1%（事務所の標準値があればその値）です。
    keywords: [物価上昇率, インフレ率, 賃金上昇率, 昇給率, 教育費の上昇率, 今の値段, 例外の年, 名目, 経済の前提]
    items: [assumptions.inflation, assumptions.wageGrowth, assumptions.educationInflation, livingExpense.growth, periodicExpense.growth]
    fields:
      - 「前提条件」の入力項目の「物価上昇率（年）」
      - 「前提条件」の入力項目の「賃金上昇率（年）」
      - 「前提条件」の入力項目の「教育費の上昇率（年）」
      - 「前提条件」の入力項目の「例外の年（経済の前提）」
    components:
      expense.living: 4
      income.salary: 8
      income.business: 4
    related:
      - income.salary
      - income.livingExpense
      - pension.revision

  - id: basics.financialAssets
    title: 運用益と金融資産の計算
    status: included
    summary: >-
      入っています。口座（器）ごとに、年初の残高に1年分の運用益と、その年の出入りを足して年末の残高を出します。
      その年の収支（収入−税・社会保険料−支出）は「収支が入る口座（決済口座）」に入ります。
    how: >-
      運用益は口座ごとに、年初の残高×年利＋その年の出入り×年利×1/2（出入りが年の真ん中にあったとみなす）で、年に1回計算し、円未満を切り捨てます。
      年末の金融資産＝年初の残高＋年間収支＋運用益です。年間収支は「収入−税・社会保険料−支出」で、NISA・課税口座などへの積立（口座の間の移動）は
      含めません。積立は決済口座から出て、積立先の口座に入ります。年利は口座ごとの利回り（資産の配分×資産の種類ごとの利回り、
      または口座に入れた利回り。預金は預金の利回り）です。不動産・車・その他の資産・保険の解約返戻金は資産と負債の表には出しますが、金融資産の合計には
      入れません。
    keywords: [運用益, 金融資産, 年末残高, 年間収支, 決済口座, 利回り, 複利, 年初の残高, 資産残高]
    items: [account.settlement, account.marketValue, assumptions.investmentReturn, assumptions.depositReturn]
    fields:
      - 「貯蓄・運用」の入力項目の「収支が入る口座（決済口座）」
      - "「前提条件」の入力項目の「計算の決まり: 運用益の数え方」"
    rows: [cf.net, cf.balance.return, cf.balance.financial, cf.balance.account]
    components:
      plan.cashflow: 27
      plan.flows: 15
    related:
      - basics.shortfall
      - investment.returnSettings

  - id: basics.shortfall
    title: 金融資産が尽きたとき（資金不足）
    status: included
    summary: >-
      入っています。決済口座が足りなくなると、取り崩しの順番でほかの口座から取り崩し、それでも足りない額は「資金不足」の行に出します。
      マイナスのまま翌年に持ち越すので、資金不足の行は不足の累計になります。
    how: >-
      決済口座の年末の残高が「預金に残しておく額」（省略は0円）を下回ると、取り崩しの順番（既定は預金・外貨預金・財形・課税口座・暗号資産・持株会・
      旧NISA・NISA）の口座から年末に売って補います。課税口座は譲渡益の税を引いた手取りで足りるだけ売ります。iDeCo・企業型DC（受け取りの年齢まで）・
      不動産・その他の資産・引き出せない期間の口座は取り崩しません。補えなかった額は決済口座のマイナスとして翌年に持ち越し、その額を表の
      「資金不足（取り崩す器が無い額）」の行に載せます。
    keywords: [資金不足, 資金ショート, 赤字, 破綻, 尽きる, マイナス, 取り崩し, 不足額, お金が足りない]
    items: [assumptions.withdrawal, account.settlement, account.withdrawalLockedUntil]
    fields:
      - 「貯蓄・運用」の入力項目の「お金の行き先」の「預金に残しておく額」
    rows: [cf.balance.shortfall, cf.transfer.withdrawal]
    components:
      plan.cashflow: 27
    related:
      - investment.withdrawalOrder
      - basics.financialAssets

  - id: basics.rounding
    title: 金額の端数の扱い
    status: included
    summary: >-
      入っています。金額は1円単位の整数で計算し、法令に端数の決まりがある所（年金・税・保険料など）はその決まりで、決まりの無い所（運用益・物価で伸ばした額など）は
      ソフトの決まり（多くは円未満切り捨て）で丸めます。
    how: >-
      率は小数の誤差が出ない正確な値で持ち、金額は円の整数です。法令の端数処理（年金額の100円単位・1円未満の切り捨て、課税所得の1,000円未満の切り捨て、
      税額の100円未満の切り捨てなど）は、制度データに持つ端数の決まりで丸めます。法令に定めの無い所は、運用益・物価や賃金で伸ばした額・
      年額を月に分けた額などを円未満切り捨てにし、月に分けたときの端数は最後の月などに寄せて、合計が年額と合うようにします。
      公的年金は支払いごとに1円未満を切り捨て、年度の切り捨ての合計を2月の支払いに足します。
    keywords: [端数, 丸め, 切り捨て, 四捨五入, 円未満, 100円未満, "1,000円未満", 端数処理]
    regulation: [pension.payment.rounding, pension.amount.rounding]
    components:
      pension.oldAge: 8

  - id: basics.regulationTiming
    title: 制度の値の時点と将来の年
    status: approximated
    summary: >-
      近似して入っています。制度の値（税率・控除額・年金額・保険料率など）は、その月・年度に適用される値を制度データから引きます。まだ決まっていない先の年は、
      最後に決まっている値をそのまま使うか、物価・賃金の前提で延ばして計算します。
    how: >-
      制度データの値には適用期間があり、計算ではお金の動きの月や年度・所得の年など、制度ごとに決まった時点で引きます。法改正で決まっている
      将来の値（施行日の決まった改正）は、その日から切り替わります。
    approximation: >-
      まだ決まっていない先の年は、最後に決まっている値をそのまま使います。ただし年金額の改定率・在職老齢年金の支給停止調整額・年金生活者支援給付金の
      額のように物価や賃金で毎年動く値は、前提の物価上昇率・賃金上昇率で延ばします。制度データが持っている時期より前の値（計算の基準の月より前の
      年金の額の推計など）は、制度データのいちばん古い値を使います。どちらの場合も画面の「計算の知らせ」に出ます。
    reason: 将来の法改正や改定の結果は分からないので、今の制度が続くとして見通しを立てるためです。
    keywords: [制度改正, 法改正, 将来の制度, 制度データ, いつの値, 先の年, 改定, 最新の制度, 税制改正]
    components:
      pension.revision: 3
    related:
      - pension.revision
      - basics.growthRates

  - id: basics.stressTest
    title: ストレステスト
    status: included
    summary: >-
      入っています。決まった型（相場の下落・利回りが低いまま・利回りがずっと低い・インフレの上振れ・変動金利の上昇・収入の減少）を、選んだプランの
      前提に重ねて計算し直せます。
    how: >-
      型ごとに、計算の前に前提を書き換えます。退職した年に資産の時価が下がる（目安は3割。その年の年末に口座の時価を下げる。既定では預金・外貨預金・
      財形・不動産・保険・小規模企業共済は下げない）、退職から一定期間運用の利回りが低いまま（目安は0.5%で10年）、運用の利回りが想定よりずっと低い
      （目安は年−1%）、インフレが一定期間上振れする（目安は4%で5年。賃金も上げるかを選べる）、変動金利が上がる（目安は＋1%。住宅ローンなどの
      変動金利に足す）、収入が一定期間減る（目安は2割を3年。その人の給与・事業所得を減らす）です。値は FP が変えられます。
      収入の減少では標準報酬月額は変えないので、健康保険・厚生年金の保険料と将来の厚生年金は減る前の額のままです。
    keywords: [ストレステスト, 暴落, 相場の下落, 低金利, インフレ, 金利上昇, 収入減少, 減収, シナリオ, 最悪の場合]
    items: [assumptions.marketShocks, assumptions.returnShifts, assumptions.inflation, assumptions.loanRateShifts, assumptions.incomeShocks]
    rows: [cf.balance.financial, cf.balance.return]
    components:
      plan.cashflow: 27
      account.ideco: 7
      income.salary: 8
      income.business: 4
    related:
      - investment.resultRange
      - basics.growthRates

  - id: basics.tableEnd
    title: 表の最後の年
    status: included
    summary: >-
      入っています。キャッシュフロー表は、既定ではご本人・配偶者のうち若い方が100歳になる年まで計算します（事務所の既定値の年齢があればその年齢）。
      90・95・100・105歳から選べ、年で直接入れることもできます。
    how: >-
      「〇歳になる年」は、その年の12月末にその年齢になる年です。子は数えず、ご本人・配偶者のうち若い方で決めます。若い方がすでにその年齢に近い・
      過ぎているときは、表を少なくとも5年分にします。家族の生年月を直すと、同じ年齢のまま最後の年が付いていきます。表の最後の年より後のお金の動きは
      計算に入りません。
    keywords: [表の最後, 何歳まで, 100歳, 計算期間, 終わりの年, 寿命, 90歳, 期間]
    items: [plan.endYear]
    fields:
      - 「前提条件」の入力項目の「表を何歳まで見るか」
      - 「前提条件」の入力項目の「表の最後の年」
    related:
      - basics.monthlyAndYearly
