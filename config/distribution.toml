# 0017 の2: 配布元の設定を1か所にまとめる。
# アプリの識別子・名前・自動通信の相手・更新の公開鍵は、このファイルだけに書く。
# Tauri の設定（app/src-tauri/tauri.conf.json の identifier・productName など）は、
# app/ で `npm run gen:distribution` を流してこのファイルから作る（CI は `npm run check:distribution` で食い違いと、
# このファイルの外に識別子・配信先のホスト名が書かれていないことを確かめる）。
# フォークは、このファイルを書き換えるだけで、識別子・名前・配信先・鍵を自分のものにできる。

identifier   = "com.fprise.lifeplan"
product_name = { ja = "ファイナンシア", en = "Financia" }
publisher    = "FPRISE, INC."

[endpoints]
# 自動通信の相手はこのホストだけ（0017 の4）。更新の仕組みはまだ入れていない（アプリは通信しない）
host        = "updates.fprise.com"
app         = "https://updates.fprise.com/v1/app/latest.json"
packs       = "https://updates.fprise.com/v1/packs/index.json"
notices     = "https://updates.fprise.com/v1/notices/notices.json"
revocations = "https://updates.fprise.com/v1/revocations/revocations.json"

[feedback]
# 「要望・不具合を送る」のフォームの URL のひな形（0087 の6）。押すと既定のブラウザでこのフォームを開く（アプリ自身は送らない・通信しない）。
# 差し込む印は {受付番号}・{版}・{OS} の3つだけ（世帯の情報・FP や PC を識別する値は入れない。0012）。https のみ。
# 受け付けのページ（financia.jp の転送のページ。受付番号・版・OS だけを付けてフォームへ移す。フォームを替えるときは転送のページだけを直す）。画面には app/ の prepare-assets が、本体には build.rs が、ここから写す
form = "https://financia.jp/feedback/?no={受付番号}&ver={版}&os={OS}"

[keys]
# 公開鍵（それぞれ現用＋次期）。署名を入れる回で足す。秘密鍵はどのリポジトリにも置かない（0017 の5・0021）
app_update    = []
data          = []
auto_delivery = []
revocation    = []
