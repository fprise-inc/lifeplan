# 0017 の2: 配布元の設定を1か所にまとめる。
# アプリの識別子・名前・自動通信の相手・更新の公開鍵は、このファイルだけに書く。
# Tauri の設定（app/src-tauri/tauri.conf.json の identifier・productName など）は、
# app/ で `npm run gen:distribution` を流してこのファイルから作る（CI は `npm run check:distribution` で食い違いと、
# このファイルの外に識別子・配信先のホスト名が書かれていないことを確かめる）。
# フォークは、このファイルを書き換えるだけで、識別子・名前・配信先・鍵を自分のものにできる。

identifier   = "com.fprise.lifeplan"
product_name = { ja = "ファイナンシア", en = "Financia" }
publisher    = "FPRISE, INC."

[endpoints]
# 自動通信の相手はこのホストだけ（0017 の4）。更新の仕組みはまだ入れていない
# 欄を足すときは、外部送信の一覧（docs/decisions/0012 の5）にも載せる（載っていないと npm run check:distribution が止める）
host        = "updates.fprise.com"
# アプリ本体の更新: 先に目録（app_catalog。段階・一時停止・通し番号・有効期限・どの鍵で確かめるか）を読み、当てるときだけ
# Tauri の updater が app（latest.json。各 OS の URL と署名）を読む（0117 の3）
app_catalog = "https://updates.fprise.com/v1/app/catalog.json"
app         = "https://updates.fprise.com/v1/app/latest.json"
packs       = "https://updates.fprise.com/v1/packs/index.json"
notices     = "https://updates.fprise.com/v1/notices/notices.json"
# 取り下げの一覧（0117 の3 (3)）。機能を有効にするコードの取り下げ（revoked.featureCodes）もここに載せる（0110 の追記 2026-11-04）。
# 今アプリが自動で取りに行くのはこれだけ（機能を有効にするコードを入れている PC だけが、起動したときと、動いている間は1日1回取りに行く。
# 送るのは取得の依頼だけで、クエリも付けない）。https で、上の host のものだけ（本体は build.rs が、ここから写す）
revocations = "https://updates.fprise.com/v1/revocations/revocations.json"

[feedback]
# 「要望・不具合を送る」のフォームの URL のひな形（0087 の6）。押すと既定のブラウザでこのフォームを開く（アプリ自身は送らない・通信しない）。
# 差し込む印は {受付番号}・{版}・{OS} の3つだけ（世帯の情報・FP や PC を識別する値は入れない。0012）。https のみ。
# 受け付けのページ（financia.jp の転送のページ。受付番号・版・OS だけを付けてフォームへ移す。フォームを替えるときは転送のページだけを直す）。画面には app/ の prepare-assets が、本体には build.rs が、ここから写す
form = "https://financia.jp/feedback/?no={受付番号}&ver={版}&os={OS}"

[keys]
# 本番の公開鍵（それぞれ現用＋次期の2本まで。0017 の5・0117 の2）。秘密鍵はどのリポジトリにも置かない（0017 の5・0021）。
# 本番の鍵は公開の前に提供元が作って足す（作り方・保管・入れ替え・失くしたときの手順は docs/decisions/0117 と 0110 の追記 2026-11-04）。
# 確かめる部品は crates/distribution（形は npm run check:distribution と、本体の build.rs も確かめる）。
# - app_update: アプリ本体の更新の鍵。`tauri signer generate` が出す公開鍵の文字列のまま（鍵の名前は中の鍵の番号から決まる）
# - data・auto_delivery・revocation・feature_code: 「鍵の名前:公開鍵（32バイトの base64url）」。鍵の名前は英小文字・数字・「-」で、dev- で始めない
# 同じ公開鍵を2つの欄に書かない（役割を分ける意味が無くなる）
app_update    = []
data          = []
auto_delivery = []
# 取り下げ用の鍵。機能を有効にするコードの取り下げ（漏れたコード・返金した人のコード）も、この鍵で署名した取り下げの一覧で止める
revocation    = []
# 機能を有効にするコードの発行の鍵（0110。`feature-code keygen --kid fc-2026a` などで作る）。空のあいだ、製品のビルドではどのコードも使えない
feature_code  = []

[dev_keys]
# 開発用の鍵（0110 の追記 2026-11-04）。開発用のビルド（debug・開発用のサーバーの代わり）だけが [keys] に足して受け付け、製品のビルドには入れない。
# 名前は dev- で始める。試しの鍵で発行したコード・署名した一覧は、製品のビルドでは「確かめられない」ものになる。
# 秘密鍵はリポジトリに置かない（作った人の手元の ~/.lifeplan-issuer/ だけ）。app_update は書けない
data          = []
auto_delivery = []
revocation    = ["dev-rv2:yLPRQrwMztHzhcKXSlCKWRKjXPJ7utpWpT7BzZtLhbM"]
feature_code  = ["dev-1:ZBASfURNQY54lJZUQjeJy59Ed87C11WGMxJHsLB1znk"]

[signing]
# OS のコード署名（0117 の4・5）。ここに書くのは秘密でない名前だけ。証明書・パスワード・鍵は CI の秘密の値に置く
# （名前の一覧は .github/workflows/app-bundle.yml）。空のまま・秘密の値が無いときは、その OS は署名せずにビルドする（フォークの既定）。
# Mac: 署名の名前（「Developer ID Application: <発行元の名前> (<チームID>)」。キーチェーンに入れた証明書の名前と同じ）
mac_signing_identity = ""
# Windows: 方式（"artifact-signing" か "none"）と、Azure Artifact Signing の場所・アカウント・証明書のプロファイルの名前
windows_method   = "artifact-signing"
windows_endpoint = ""
windows_account  = ""
windows_profile  = ""
