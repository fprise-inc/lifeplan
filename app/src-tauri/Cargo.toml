[package]
name = "financia-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "ファイナンシアのアプリ本体（Tauri 2）"
default-run = "financia"

# リポジトリ直下のワークスペース（計算エンジンのホスト）とは分ける。
# Tauri の依存は大きく、Linux ではシステムのライブラリ（WebKitGTK）が要るので、ホストの CI（3つの OS）に混ぜない
[workspace]

[[bin]]
name = "financia"
path = "src/main.rs"

[lib]
name = "financia_app"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# 0016: プラグインは入れない（ファイル・シェル・ブラウザを開く・HTTP などの権限を画面に与えない）
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0005: 正の計算は quickjs-ng（engine-host）。計算ごとに新しい実行環境
engine-host = { path = "../../crates/engine-host" }
# 0009: 提案書の PDF（Typst をライブラリとして組み込む。刻印・必須の記載・内部情報は帳票の外側で付ける）
report-pdf = { path = "../../crates/report-pdf" }
# 0020 の5: 平文の書き出しの出口で、OS の保存・開くのダイアログを本体から出す（プラグインではないので、画面には権限を与えない）
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
sha2 = "0.10"
zeroize = "1"
# 0011・0013: 世帯ファイルの保存と暗号化（OS の資格情報の保管庫を使う実装を有効にする）
household-store = { path = "../../crates/household-store", features = ["os-keyring"] }
# 0014・0015: AI接続口のアプリ本体の側（共有の台帳・縮約版・同意とAIの記録・接続口からの依頼の受け口）
ai-share = { path = "../../crates/ai-share" }
ai-ipc = { path = "../../crates/ai-ipc" }
# 0110: 機能を有効にするコード（提供元の署名を、埋め込んだ公開鍵で確かめる。ネットにはつながない）
feature-code = { path = "../../crates/feature-code" }
# 0110 の追記・0017 の4: 配信元の「止めた一覧」を取りに行く HTTP の部品（本体だけが通信する。画面には HTTP の権限を与えない）。
# reqwest は Tauri が既に使っている版。TLS は rustls（暗号は ring）で、証明書は OS の仕組みで確かめる（rustls-platform-verifier）。
# クッキー・プロキシ・圧縮・HTTP/2 は入れない（既定の機能を外す）
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.dev.package."*"]
# 開発用の起動（npx tauri dev）でも、依存の crate（Typst の組版・PDF・画像など）は最適化する。
# 最適化なしでは、提案書を組むのに約4.5秒・見本の1ページの PNG に約2秒かかっていた（最適化すると約0.5秒・約0.1秒）。
# アプリ自身のコードは最適化しない（作り直しの速さはそのまま）。CI のテストは依存の最適化を外して流す（ci.yml）
opt-level = 1
debug = false

[profile.dev.package.rquickjs-sys]
# quickjs-ng の C は debug のビルドでも最適化する（正の計算の速さを製品に近づける）
opt-level = 3
