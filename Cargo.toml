[workspace]
resolver = "2"
members = ["crates/engine-host", "crates/ai-ipc", "crates/ai-share", "crates/lifeplan", "crates/report-pdf"]
# 提案書の PDF（report-pdf。Typst を組み込むので大きい）は既定のビルドに入れない。CI の report で `-p report-pdf` を流す
# （ホストの CI（3つの OS）・一致テスト・速さの計測は report-pdf 以外をビルドする）
default-members = ["crates/engine-host", "crates/ai-ipc", "crates/ai-share", "crates/lifeplan"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
