# 秘密情報（鍵・トークンなど）がコミットに混ざっていないかを、毎回の送信で調べる
name: secret-scan
on:
  # 作業用のブランチは pull_request で、main は取り込んだときに調べる（同じ変更で2回流さない）
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan history
        run: ./gitleaks detect --source . --redact --verbose
