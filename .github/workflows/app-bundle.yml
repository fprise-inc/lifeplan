# アプリの3つの OS でのビルド（バンドル）。手で起動する（workflow_dispatch）か、リリースのときだけ（実行の分数に限りがあるため）。
# 署名はまだ入れていない（署名の鍵・証明書は後の回。0017）。できたものは成果物として7日だけ残す
name: app-bundle
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            args: --bundles nsis
          - os: ubuntu-latest
            args: --bundles deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 計算エンジンのまとめた JS と制度データ
        working-directory: engine
        run: |
          npm ci
          npm run build
      - name: Tauri が Linux で使うライブラリ
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: アプリの画面の依存
        working-directory: app
        run: npm ci
      - name: ビルド（署名なし）
        working-directory: app
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: financia-${{ matrix.os }}
          retention-days: 7
          path: |
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error
