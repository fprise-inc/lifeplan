# 計算エンジンとアプリの画面・ヒアリングシート・明細の取り込み・表計算のファイルの土台・持ち帰り用のレポート・通しの入力と欄の効き目の自動テスト（0002・0004・0005・0006・0007・0016・0017・0018・0021・0030・0034・0113・0129・0132）
# アプリの3つの OS でのビルド（バンドル）は、手で起動するかリリースのときだけ（app-bundle.yml。実行の分数に限りがあるため）
name: ci
on:
  # 同じ変更で2回流さない: 作業用のブランチは pull_request だけ、main は取り込んだときだけ（非公開の間は実行の分数に限りがあるため）
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # macOS・Windows・速さの測定は、毎晩1回（その日に main が変わったときだけ）と手で起動したときだけ流す
  schedule:
    - cron: "0 18 * * *"
permissions:
  contents: read
# 同じブランチ（PR）で新しい送信があれば、古い実行を止める。毎晩の実行は main への取り込みで止めない（グループを分ける。
# 止まると、速さの前の値に使う毎晩の計測が残らない）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'change' }}
  cancel-in-progress: true

jobs:
  # どのジョブを流すか（.github/scripts/ci-changes.sh）。重い検査（macOS・Windows・速さの測定）は手で起動したときと毎晩
  # （その日に main が変わったときだけ）だけ。それ以外は Linux だけで、前に確かめた木から変わったファイルに関わるジョブだけを流す
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
      heavy: ${{ steps.diff.outputs.heavy }}
      engine: ${{ steps.diff.outputs.engine }}
      engine_build: ${{ steps.diff.outputs.engine_build }}
      app: ${{ steps.diff.outputs.app }}
      report: ${{ steps.diff.outputs.report }}
      hearing: ${{ steps.diff.outputs.hearing }}
      statement: ${{ steps.diff.outputs.statement }}
      xlsx: ${{ steps.diff.outputs.xlsx }}
      host: ${{ steps.diff.outputs.host }}
      licenses_rust: ${{ steps.diff.outputs.licenses_rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: .github/scripts/ci-changes.sh

  # 型の検査・lint・単体テスト・まとめた JS と制度データの JSON の作成・npm の依存のライセンスの検査
  engine:
    needs: changes
    if: needs.changes.outputs.engine_build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      # 検査とテストは engine の変更のときだけ（ほかのジョブのためにまとめた JS を作るだけのときは飛ばす）
      - name: 登録簿が正本（スキーマ・部品・制度データ）と食い違っていないこと（0004 の5）
        if: needs.changes.outputs.engine == 'true'
        run: npm run registry:check
      - name: 公開側の読み取り規則・用語辞書（migration/）の形と、規則の reads.product が null であること（0113 の7・11）
        if: needs.changes.outputs.engine == 'true'
        run: npm run migration:check
      - name: 型の検査
        if: needs.changes.outputs.engine == 'true'
        run: npm run typecheck
      - name: lint
        if: needs.changes.outputs.engine == 'true'
        run: npm run lint
      - name: 単体テスト・答え合わせ（検証 L2）
        if: needs.changes.outputs.engine == 'true'
        run: npm test
      - name: 答え合わせ（検証 L2）の合格率
        if: needs.changes.outputs.engine == 'true'
        run: npm run l2
      - name: モデル世帯で制度改正の差分を見る
        if: needs.changes.outputs.engine == 'true'
        run: npm run models
      - name: まとめた JS と制度データの JSON を作る
        run: npm run build
      - name: ライセンスの検査（npm）
        if: needs.changes.outputs.engine == 'true'
        run: npm run check:licenses
      - uses: actions/upload-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
          if-no-files-found: error

  # アプリの画面（型の検査・lint・単体テスト・ビルド・npm の依存のライセンス・配布元の設定）と、
  # アプリのクレート（app/src-tauri）の書式・clippy（cargo check を兼ねる）・テスト。Linux だけで流す（WebKitGTK を入れる）
  app:
    needs: [engine, changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # Tauri の依存のビルドで実行機の空き容量が尽きることがあるため、デバッグ情報と差分のビルドの置き場を作らない
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        working-directory: app
    steps:
      - name: 実行機の空き容量を増やす（使わない開発道具を消す）
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 配布元の設定（識別子・配信先は config/distribution.toml だけ。0017 の2）
        run: npm run check:distribution
      - name: 型の検査
        run: npm run typecheck
      - name: lint（提示層の読み込みの制限・画面に保存しない。0016）
        run: npm run lint
      - name: 単体テスト
        run: npm test
      - name: 持ち帰り用のレポートを、ネットワークを切ったヘッドレスのブラウザで開く（外への通信・CSP の違反が0件・つまみで計算し直す・パスワード。0030）
        run: |
          TAKEAWAY_SAMPLE_DIR="$RUNNER_TEMP/takeaway" npx vitest run test/takeaway.test.ts -t 見本のファイル
          npm run check:takeaway -- "$RUNNER_TEMP/takeaway/見本_パスワードなし.html" "$RUNNER_TEMP/takeaway/見本_パスワードあり.html" mihon-pass-2026 --require
      - name: ビルド（Tauri のクレートが埋め込む画面）
        run: npm run build
      - name: Web のヒアリングのお客さまのページ（外のファイルを読まない・配るファイルの指紋と完全性の印。0125）
        run: npm run build:hearing-form
      - name: ライセンスの検査（npm）
        run: npm run check:licenses
      - name: Tauri が Linux で使うライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: 書式
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: app/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      # 開発用の起動のための依存の最適化（Cargo.toml の profile.dev.package."*"）は、CI では外す（依存のビルドの時間を延ばさない）
      - name: Rust のテスト（正の計算・根拠の記録・画面の移動の制限）
        working-directory: app/src-tauri
        run: cargo test --locked --config 'profile.dev.package."*".opt-level=0'

  # 通しの入力と欄の効き目（0132）: 3つの世帯を見えないブラウザで画面のキー入力で入れて結果まで出す・見本の棚の主な世帯の全部のパネルを開く・
  # 入力項目の欄を1つずつ動かして結果が変わるかを見る。app の変更のときだけ、app のジョブと並べて流す（app のジョブの時間を延ばさない）
  walkthrough:
    needs: [engine, changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 通しの入力（ヘッドレスのブラウザで画面のキー入力）と欄ごとの効き目（直す待ちの一覧の行は「まだ落ちる」で通る）
        env:
          WALKTHROUGH_SHOTS: ${{ runner.temp }}/walkthrough
        run: npm run check:walkthrough
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: walkthrough-shots
          path: ${{ runner.temp }}/walkthrough
          if-no-files-found: ignore

  # 提案書の PDF（0009）: 帳票の入力を組み立てる部品（report/）と、Typst を組み込んだ report-pdf のテスト。
  # 見本の PDF（架空のモデル世帯）を作って成果物に残す。Linux だけで流す（Typst は大きいのでホストの3つの OS には入れない）
  report:
    needs: [engine, changes]
    if: needs.changes.outputs.report == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: report/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: report-pdf
      - name: clippy（report-pdf）
        run: cargo clippy --locked -p report-pdf --all-targets -- -D warnings
      - name: Rust のテスト（刻印・必須の記載・内部情報・同梱フォントだけ・同じ入力から同じ PDF）
        run: cargo test --locked -p report-pdf
      - name: ビルド（report-pdf のコマンド）
        run: cargo build --locked -p report-pdf
      - run: npm ci
        working-directory: report
      - name: 型の検査
        working-directory: report
        run: npm run typecheck
      - name: lint
        working-directory: report
        run: npm run lint
      - name: ライセンスの検査（npm）
        working-directory: report
        run: npm run check:licenses
      - name: テスト（帳票の入力の形・エンジンの出力との一致・PDF の文字の数字との一致）
        working-directory: report
        env:
          REPORT_PDF_REQUIRED: "1"
        run: npm test
      - name: 見本の PDF
        working-directory: report
        run: npm run samples
      - uses: actions/upload-artifact@v4
        with:
          name: proposal-samples
          path: report/dist/samples
          if-no-files-found: error

  # ヒアリングシート（0018）: シート定義の検査・配置・見本・登録簿・単体テスト（取り込んだ世帯を本物のエンジンで計算する）・npm の依存のライセンス
  hearing:
    needs: [engine, changes]
    if: needs.changes.outputs.hearing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hearing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hearing/package-lock.json
      - run: npm ci
      - name: 型の検査
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: 開発中のシート定義の配置が項目の並びと食い違っていないこと
        run: npm run layout:check
      - name: ヒアリング項目のキーの登録簿（registry/hearing.yaml）がシート定義と食い違っていないこと（0004 の5）
        run: npm run registry:check
      - name: 見本のシート（架空の記入例）が記入例の JSON から作り直したものと同じこと（0018 の7）
        run: npm run sample:check
      - name: 推定の目安の写し（src/statistics.generated.ts）が正本の YAML（data/master・data/regulation）から作り直したものと同じこと（0007・0008）
        run: npm run statistics:check
      - name: 単体テスト（往復・取り込み・読み込みの安全）
        run: npm test
      - name: ライセンスの検査（npm）
        run: npm run check:licenses

  # 明細の取り込みと仕分け（0034）: 型の検査・lint・単体テスト（架空の明細）・npm の依存のライセンス。計算エンジンには頼らない
  statement:
    needs: changes
    if: needs.changes.outputs.statement == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: statement/package-lock.json
      - run: npm ci
      - name: 型の検査
        run: npm run typecheck
      - name: lint（src/ は Node の組み込みと外への通信を使わない）
        run: npm run lint
      - name: 単体テスト（番号が残らないこと・二重に数えないこと・区分・候補の数字・確認シートの書き出しと読み込み）
        run: npm test
      - name: ライセンスの検査（npm）
        run: npm run check:licenses

  # 表計算のファイル（.xlsx）の土台（ヒアリングシート 0018 と明細の確認シート 0034 で使う）: 型の検査・lint・単体テスト（読み戻し・返ってきたファイルを信用しない読み込み）・npm の依存のライセンス
  xlsx:
    needs: changes
    if: needs.changes.outputs.xlsx == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xlsx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xlsx/package-lock.json
      - run: npm ci
      - name: 型の検査
        run: npm run typecheck
      - name: lint（src/ は Node の組み込みと外への通信を使わない）
        run: npm run lint
      - name: 単体テスト（読み戻し・管理の値・返ってきたファイルを信用しない読み込み）
        run: npm test
      - name: ライセンスの検査（npm）
        run: npm run check:licenses

  # AI接続口（crates/lifeplan）に同梱する「数字の根拠」の読み方（app/src/connector/explain.ts をまとめた JS。0183）。接続口をビルドするジョブ（host・bench）が使う
  ai-explain:
    needs: [engine, changes]
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 数字の根拠の読み方とプランの動かす項目をまとめる（外の部品が入ったら止める）
        run: npm run build:explain
      - uses: actions/upload-artifact@v4
        with:
          name: ai-explain
          path: |
            crates/lifeplan/dist/explain.js
            crates/lifeplan/dist/plan.js
          if-no-files-found: error

  # Rust のホスト（quickjs-ng）のテストと、Node との一致テスト。Windows・macOS・Linux それぞれでビルドする（0005 の6）
  host:
    needs: [engine, ai-explain, changes]
    if: needs.changes.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        # 計算に関係する変更のときだけ macOS・Windows でも流す（Linux は毎回）
        os: ${{ fromJSON(needs.changes.outputs.heavy == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/download-artifact@v4
        with:
          name: ai-explain
          path: crates/lifeplan/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # JavaScriptCore の一致テストに使う（配布しない CI の道具。0005・0015 の追記）
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 書式
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: ビルド
        run: cargo build --locked --release
      - name: Rust のテスト（脱出テスト・上限・凍結の後にエンジンが動くこと）
        run: cargo test --locked --release
      - name: 一致テスト（Node・quickjs-ng・JavaScriptCore の出力の SHA-256）
        run: node --disable-warning=ExperimentalWarning engine/scripts/parity.ts --jsc
      - uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.os }}
          path: engine/dist/parity-hashes.json
          if-no-files-found: error

  # 速さの計測（0005 の「速さの回帰」と追記 2026-10-28）: 100年分の5案×4想定を Node（V8）・JavaScriptCore（Bun）・quickjs-ng で測り、
  # 時間のほかに部品の呼び出しの回数と、ubuntu では quickjs-ng の命令の数（valgrind の cachegrind）を記録する。
  # 前の値は直近の毎晩の計測（このジョブの成果物。最大5晩）の中央値（晩が3つに満たなければ engine/bench/baseline.json）。
  # 呼び出しの回数・命令の数は +5% で警告・+10% で失敗。時間は bench-time で両方の OS をそろえて決める。macOS の実行環境は Apple シリコン
  bench:
    needs: [engine, ai-explain, changes]
    if: needs.changes.outputs.heavy == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/download-artifact@v4
        with:
          name: ai-explain
          path: crates/lifeplan/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - name: ビルド（engine-bench）
        run: cargo build --locked --release
      - name: 命令の数を数える道具（valgrind。ubuntu だけ。CI の実行環境はハードウェアの数え口が無い）
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq valgrind > /dev/null
      - name: 前の値（直近の毎晩の計測の成果物）を取る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bench-history
          got=0
          for row in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule --branch main --limit 15 --json databaseId,createdAt --jq '.[] | "\(.databaseId),\(.createdAt)"'); do
            id=${row%%,*}; at=${row#*,}
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "bench-${{ matrix.os }}" -D "bench-history/$at" > /dev/null 2>&1; then got=$((got + 1)); fi
            [ "$got" -ge 5 ] && break
          done
          echo "毎晩の計測 $got 回分"
      - name: 速さを測る
        run: node --disable-warning=ExperimentalWarning engine/scripts/bench.ts --repeat 5 --history bench-history --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: engine/dist/bench/result.json
          if-no-files-found: warn

  # 時間の警告: 同じ計測が ubuntu と macOS の両方で前の値（最小値）の 1.5倍を超えたら警告、3倍を超えたら失敗
  # （片方だけの遅れは実行環境の揺れが多い。0005 の追記 2026-10-28）
  bench-time:
    needs: [bench, changes]
    if: always() && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: engine/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: bench
      - name: 両方の OS の時間の比をそろえる
        run: node --disable-warning=ExperimentalWarning engine/scripts/bench-check-os.ts bench/bench-ubuntu-latest/result.json bench/bench-macos-latest/result.json

  # OS をまたいでも同じハッシュになること
  parity-across-os:
    needs: [host, changes]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-*
          path: parity
      - name: 3つの OS のハッシュを比べる
        run: |
          ls parity
          first=$(ls parity | head -1)
          for d in parity/*; do
            diff "parity/$first/parity-hashes.json" "$d/parity-hashes.json"
          done
          echo "すべての OS で一致（$(ls parity | wc -l) 個）"

  # Rust の依存のライセンスの検査（GPL・LGPL・AGPL を止める。0021）
  licenses-rust:
    needs: changes
    if: needs.changes.outputs.licenses_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check licenses bans sources
      - name: アプリ本体（app/src-tauri。Tauri の依存の MPL-2.0 は部品ごとの例外）
        working-directory: app/src-tauri
        run: cargo deny --locked check licenses bans sources
