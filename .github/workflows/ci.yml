# 計算エンジンとアプリの画面・ヒアリングシートの自動テスト（0002・0004・0005・0006・0007・0016・0017・0018・0021）
# アプリの3つの OS でのビルド（バンドル）は、手で起動するかリリースのときだけ（app-bundle.yml。実行の分数に限りがあるため）
name: ci
on:
  # 同じ変更で2回流さない: 作業用のブランチは pull_request だけ、main は取り込んだときだけ（非公開の間は実行の分数に限りがあるため）
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # macOS・Windows・速さの測定は、毎晩1回（その日に main が変わったときだけ）と手で起動したときだけ流す
  schedule:
    - cron: "0 18 * * *"
permissions:
  contents: read
# 同じブランチで新しい送信があれば、古い実行を止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 重い検査（macOS・Windows・速さの測定）を流すか。非公開の間は実行の分数に限りがあるため、
  # pull_request と main への取り込みでは Linux だけにし、重い検査は手で起動したときと毎晩（その日に main が変わったときだけ）に流す
  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          run=true; heavy=false
          case "${{ github.event_name }}" in
            workflow_dispatch) heavy=true ;;
            schedule) if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then heavy=true; else run=false; fi ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  # 型の検査・lint・単体テスト・まとめた JS と制度データの JSON の作成・npm の依存のライセンスの検査
  engine:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - name: 登録簿が正本（スキーマ・部品・制度データ）と食い違っていないこと（0004 の5）
        run: npm run registry:check
      - name: 型の検査
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: 単体テスト・答え合わせ（検証 L2）
        run: npm test
      - name: 答え合わせ（検証 L2）の合格率
        run: npm run l2
      - name: モデル世帯で制度改正の差分を見る
        run: npm run models
      - name: まとめた JS と制度データの JSON を作る
        run: npm run build
      - name: ライセンスの検査（npm）
        run: npm run check:licenses
      - uses: actions/upload-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
          if-no-files-found: error

  # アプリの画面（型の検査・lint・単体テスト・ビルド・npm の依存のライセンス・配布元の設定）と、
  # アプリのクレート（app/src-tauri）の書式・clippy（cargo check を兼ねる）・テスト。Linux だけで流す（WebKitGTK を入れる）
  app:
    needs: engine
    runs-on: ubuntu-latest
    # Tauri の依存のビルドで実行機の空き容量が尽きることがあるため、デバッグ情報と差分のビルドの置き場を作らない
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        working-directory: app
    steps:
      - name: 実行機の空き容量を増やす（使わない開発道具を消す）
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 配布元の設定（識別子・配信先は config/distribution.toml だけ。0017 の2）
        run: npm run check:distribution
      - name: 型の検査
        run: npm run typecheck
      - name: lint（提示層の読み込みの制限・画面に保存しない。0016）
        run: npm run lint
      - name: 単体テスト
        run: npm test
      - name: ビルド（Tauri のクレートが埋め込む画面）
        run: npm run build
      - name: ライセンスの検査（npm）
        run: npm run check:licenses
      - name: Tauri が Linux で使うライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: 書式
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: app/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      # 開発用の起動のための依存の最適化（Cargo.toml の profile.dev.package."*"）は、CI では外す（依存のビルドの時間を延ばさない）
      - name: Rust のテスト（正の計算・根拠の記録・画面の移動の制限）
        working-directory: app/src-tauri
        run: cargo test --locked --config 'profile.dev.package."*".opt-level=0'

  # 提案書の PDF（0009）: 帳票の入力を組み立てる部品（report/）と、Typst を組み込んだ report-pdf のテスト。
  # 見本の PDF（架空のモデル世帯）を作って成果物に残す。Linux だけで流す（Typst は大きいのでホストの3つの OS には入れない）
  report:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: report/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: report-pdf
      - name: clippy（report-pdf）
        run: cargo clippy --locked -p report-pdf --all-targets -- -D warnings
      - name: Rust のテスト（刻印・必須の記載・内部情報・同梱フォントだけ・同じ入力から同じ PDF）
        run: cargo test --locked -p report-pdf
      - name: ビルド（report-pdf のコマンド）
        run: cargo build --locked -p report-pdf
      - run: npm ci
        working-directory: report
      - name: 型の検査
        working-directory: report
        run: npm run typecheck
      - name: lint
        working-directory: report
        run: npm run lint
      - name: ライセンスの検査（npm）
        working-directory: report
        run: npm run check:licenses
      - name: テスト（帳票の入力の形・エンジンの出力との一致・PDF の文字の数字との一致）
        working-directory: report
        env:
          REPORT_PDF_REQUIRED: "1"
        run: npm test
      - name: 見本の PDF
        working-directory: report
        run: npm run samples
      - uses: actions/upload-artifact@v4
        with:
          name: proposal-samples
          path: report/dist/samples
          if-no-files-found: error

  # ヒアリングシート（0018）: シート定義の検査・配置・見本・登録簿・単体テスト（取り込んだ世帯を本物のエンジンで計算する）・npm の依存のライセンス
  hearing:
    needs: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hearing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hearing/package-lock.json
      - run: npm ci
      - name: 型の検査
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: 開発中のシート定義の配置が項目の並びと食い違っていないこと
        run: npm run layout:check
      - name: ヒアリング項目のキーの登録簿（registry/hearing.yaml）がシート定義と食い違っていないこと（0004 の5）
        run: npm run registry:check
      - name: 見本のシート（架空の記入例）が記入例の JSON から作り直したものと同じこと（0018 の7）
        run: npm run sample:check
      - name: 単体テスト（往復・取り込み・読み込みの安全）
        run: npm test
      - name: ライセンスの検査（npm）
        run: npm run check:licenses

  # Rust のホスト（quickjs-ng）のテストと、Node との一致テスト。Windows・macOS・Linux それぞれでビルドする（0005 の6）
  host:
    needs: [engine, changes]
    strategy:
      fail-fast: false
      matrix:
        # 計算に関係する変更のときだけ macOS・Windows でも流す（Linux は毎回）
        os: ${{ fromJSON(needs.changes.outputs.heavy == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # JavaScriptCore の一致テストに使う（配布しない CI の道具。0005・0015 の追記）
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 書式
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: ビルド
        run: cargo build --locked --release
      - name: Rust のテスト（脱出テスト・上限・凍結の後にエンジンが動くこと）
        run: cargo test --locked --release
      - name: 一致テスト（Node・quickjs-ng・JavaScriptCore の出力の SHA-256）
        run: node --disable-warning=ExperimentalWarning engine/scripts/parity.ts --jsc
      - uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.os }}
          path: engine/dist/parity-hashes.json
          if-no-files-found: error

  # 速さの計測（0005 の「速さの回帰」）: 100年分の5案×4想定を Node（V8）・JavaScriptCore（Bun）・quickjs-ng で測り、
  # 目標と前の値（engine/bench/baseline.json）を表にする。前の値の1.5倍を超えたら警告、3倍を超えたら失敗。
  # 結果（result.json）は成果物として残す。macOS の実行環境は Apple シリコン
  bench:
    needs: [engine, changes]
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - name: ビルド（engine-bench）
        run: cargo build --locked --release
      - name: 速さを測る
        run: node --disable-warning=ExperimentalWarning engine/scripts/bench.ts --repeat 3 --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: engine/dist/bench/result.json
          if-no-files-found: warn

  # OS をまたいでも同じハッシュになること
  parity-across-os:
    needs: host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-*
          path: parity
      - name: 3つの OS のハッシュを比べる
        run: |
          ls parity
          first=$(ls parity | head -1)
          for d in parity/*; do
            diff "parity/$first/parity-hashes.json" "$d/parity-hashes.json"
          done
          echo "すべての OS で一致（$(ls parity | wc -l) 個）"

  # Rust の依存のライセンスの検査（GPL・LGPL・AGPL を止める。0021）
  licenses-rust:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check licenses bans sources
      - name: アプリ本体（app/src-tauri。Tauri の依存の MPL-2.0 は部品ごとの例外）
        working-directory: app/src-tauri
        run: cargo deny --locked check licenses bans sources
