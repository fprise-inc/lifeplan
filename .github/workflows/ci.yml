# 計算エンジンの自動テスト（0002・0004・0005・0006・0007・0021）
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  # 型の検査・lint・単体テスト・まとめた JS と制度データの JSON の作成・npm の依存のライセンスの検査
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - name: 登録簿が正本（スキーマ・部品・制度データ）と食い違っていないこと（0004 の5）
        run: npm run registry:check
      - name: 型の検査
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: 単体テスト・答え合わせ（検証 L2）
        run: npm test
      - name: 答え合わせ（検証 L2）の合格率
        run: npm run l2
      - name: モデル世帯で制度改正の差分を見る
        run: npm run models
      - name: まとめた JS と制度データの JSON を作る
        run: npm run build
      - name: ライセンスの検査（npm）
        run: npm run check:licenses
      - uses: actions/upload-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
          if-no-files-found: error

  # Rust のホスト（quickjs-ng）のテストと、Node との一致テスト。Windows・macOS・Linux それぞれでビルドする（0005 の6）
  host:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # JavaScriptCore の一致テストに使う（配布しない CI の道具。0005・0015 の追記）
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 書式
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: ビルド
        run: cargo build --locked --release
      - name: Rust のテスト（脱出テスト・上限・凍結の後にエンジンが動くこと）
        run: cargo test --locked --release
      - name: 一致テスト（Node・quickjs-ng・JavaScriptCore の出力の SHA-256）
        run: node --disable-warning=ExperimentalWarning engine/scripts/parity.ts --jsc
      - uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.os }}
          path: engine/dist/parity-hashes.json
          if-no-files-found: error

  # 速さの計測（0005 の「速さの回帰」）: 100年分の5案×4想定を Node（V8）・JavaScriptCore（Bun）・quickjs-ng で測り、
  # 目標と前の値（engine/bench/baseline.json）を表にする。前の値の1.5倍を超えたら警告、3倍を超えたら失敗。
  # 結果（result.json）は成果物として残す。macOS の実行環境は Apple シリコン
  bench:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - name: ビルド（engine-bench）
        run: cargo build --locked --release
      - name: 速さを測る
        run: node --disable-warning=ExperimentalWarning engine/scripts/bench.ts --repeat 3 --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: engine/dist/bench/result.json
          if-no-files-found: warn

  # OS をまたいでも同じハッシュになること
  parity-across-os:
    needs: host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-*
          path: parity
      - name: 3つの OS のハッシュを比べる
        run: |
          ls parity
          first=$(ls parity | head -1)
          for d in parity/*; do
            diff "parity/$first/parity-hashes.json" "$d/parity-hashes.json"
          done
          echo "すべての OS で一致"

  # Rust の依存のライセンスの検査（GPL・LGPL・AGPL を止める。0021）
  licenses-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check licenses bans sources
