# 学校の別名・読み・移行先の補いの辞書（0010 の2・0217）。FPライズが整理した部分で、CC0-1.0。
# 学校名の欄の検索と、ヒアリングシートの自由記述の学校名の照合に使う。文部科学省の一覧（schools.csv）を作り直しても、この辞書は残る。
#
# aliases: 学校コードごとの別名。kind は abbr（略称）・former（旧校名）・variant（別の表記）
#   - 旧校名は、一覧の「移行後の学校コード」（と下の successors）から自動で引けるので、移行先のある廃止の学校はここに書かなくてよい
#   - 略称は、学校が自分で使っている表記か、広く通る呼び方だけを足す（検索の候補を増やしすぎない）
# readings: 学校コード → 読み（ひらがな）。文部科学省の一覧に読みが無いので、学校の公式の表記で確かめた学校から足す。推測では足さない
# successors: 一覧に移行後の学校コードが無い統合・改称の補い（from は廃止した学校のコード、to は移行先、note は確かめたこと）
aliases:
  - code: F113110102700 # 東京大学
    names:
      - {name: 東大, kind: abbr}
  - code: F126110107407 # 京都大学
    names:
      - {name: 京大, kind: abbr}
readings: {}
successors:
  - {from: F113110102746, to: F113110112030, note: "2024年10月、国立大学法人東京工業大学と国立大学法人東京医科歯科大学の統合で東京科学大学になった（一覧の廃止の日は2025-05-01の時点）"}
  - {from: F113110102719, to: F113110112030, note: "2024年10月、国立大学法人東京工業大学と国立大学法人東京医科歯科大学の統合で東京科学大学になった（一覧の廃止の日は2025-05-01の時点）"}
  - {from: D113110000049, to: D113110000076, note: "東京工業大学附属科学技術高等学校が、大学の統合で東京科学大学附属科学技術高等学校になった"}
