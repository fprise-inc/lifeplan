# 学部・学科の一覧（0010 の2・0217・0219。マスタデータ master.education.schools の一部）。FPライズが整理した部分で、CC0-1.0。
# 学部・学科は「学校コード＋部局ID」（<学校コード>/d001）で表す。部局ID は学校の中の通し番号で、使い回さない（廃止しても欠番として残し、retired: true にする）。
# 学部ごとに1行。同じ学部の中で修業年数か授業料の区分が違う学科・コース（医学科と看護学科、夜間主コースなど）だけ分けて行にした。
