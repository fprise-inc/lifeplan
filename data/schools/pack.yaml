# 学校の一覧（0010 の1・2: マスタデータ master.education.schools。0217）
# 学校の主キーは文部科学省の学校コード（13桁）。名前はキーにしない。移行先（successor）で、統合・改称で廃止した学校のコードから新しいコードをたどる。
# 正本は schools.csv（文部科学省の学校コード一覧から app/scripts/school-list-import.ts で作る）と aliases.yaml（別名・読み・移行先の補いの辞書）。
# 画面に配る形は app/scripts/prepare-assets.ts が作る（app/src/generated/schools.data.js。学校名の欄を開いたときに遅れて読む）。
# 2026.1.0: 最初の版。文部科学省「学校コード一覧」令和8年5月1日時点（暫定版。一覧の更新日 2026年5月20日）の全学校種（幼稚園・幼保連携型認定こども園・
#   小学校・中学校・義務教育学校・高等学校・中等教育学校・特別支援学校・大学・短期大学・高等専門学校・専修学校・各種学校）。廃止した学校も、
#   古い世帯の学校コードを読むために残す（検索の候補には出さず、移行先があれば旧校名として移行先の学校の候補に出す）。
#   所在地と郵便番号は持たない（候補の見分けに市区町村だけを所在地から切り出して持つ）。読みは公式の一覧に無いので、まだ入れていない
