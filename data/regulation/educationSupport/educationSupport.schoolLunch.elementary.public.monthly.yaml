    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-10-20", "tools": ["HTML の本文（公表資料）", "PDF の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], "note": "令和8年4月から、給食を実施する公立の小学校（義務教育学校前期課程・特別支援学校小学部を含む）の児童に、保護者の所得によらず月5,200円（完全給食）を基準に食材費を支援（国1/2・都道府県1/2の予算補助。学校給食法は改正しない）。基準額を超える分は保護者から徴収できる。文部科学省の案内・実施要領・三省の対応方針で一致。中学校は対象外（三省の対応方針で「検討」）。基準額は毎年の調査と物価で見直す"}
