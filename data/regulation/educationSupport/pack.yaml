# 教育の公的支援の制度データ（0007 の1: パック regulation.educationSupport。0010 の5: 学費データと分ける）
# 2026.1.0: 最初の版。児童手当（令和6年10月分から）・高等学校等就学支援金（令和8年度から所得制限なし）・高等教育の修学支援新制度
#   （区分・減免の上限と割合・給付型奨学金・多子世帯）。公式のサイト（こども家庭庁・文部科学省・日本学生支援機構）にこの作業の環境から
#   届かなかったので、検索の要約で読んだ値を入れた。すべて原本での確認待ち（pendingReview）
# 2026.2.0: すべての値を原本（e-Gov法令検索の児童手当法・高等学校等就学支援金の支給に関する法律と施行令・大学等における修学の支援に関する法律と施行令・
#   日本学生支援機構法施行令の条文、こども家庭庁・文部科学省・日本学生支援機構の公表資料）と2つの読み方で照らし合わせ、reviewed の行を足した
#   （照合: claude、2026-10-09）。古い行には supersededIn を書いた。値は変えていない
# 2026.3.0: 授業料等の減免の額の端数（100円未満の切り上げ。修学支援法施行令2条1項2号）を新しいファイルで足した（PR #14 の「気づいたが直していない点」4。
#   既存のファイルは変えていない。原本で確かめる前（pendingReview））
# 2026.5.0: 保育料の国の基準（子ども・子育て支援法施行令4条2項・13条・14条。満3歳未満の保育認定の利用者負担の上限の表（保育標準時間・短時間）、
#   ひとり親世帯等の軽減、多子の軽減の割合と年齢の制限を外す所得の上限）と、公立小学校の学校給食費の負担軽減（令和8年4月から。基準額の月額と年間の月数）を
#   新しいファイルで足した。e-Gov法令検索の条文とこども家庭庁・文部科学省の公表資料で照らし合わせた（reviewed。照合: claude、2026-10-20）。既存のファイルは変えていない
# 2026.6.0: 多子世帯の判定で「子ども」に数える特定親族の合計所得金額の上限（95万円。令和8年度住民税を用いる判定から。日本学生支援機構の公表資料）を
#   新しいファイルで足した（照合: claude、2026-10-25）。既存のファイルは変えていない
# 2026.7.0: 国公立の高等専門学校（1〜3年）の高等学校等就学支援金の年額（施行令2条1項1号ハ・2号ホ）を新しいファイルで足した（0090。reviewed。照合: claude、2026-10-31）
