    approval: {method: "reviewed", paths: 2, comparedBy: "claude", comparedOn: "2026-10-25", tools: ["e-Gov法令API（条文の XML）", "PDF の本文（公表資料）", "原本の指紋（sha256）の計算"], note: "障害厚生年金の配偶者の加給年金額（50条の2第2項）。老齢厚生年金の配偶者の加給年金額（44条2項）は令和10年4月以後に加算された人から 202,200円×改定率に下がるが、50条の2の額は改正後の版でも 224,700円のまま（厚生労働省の資料も障害年金の配偶者の加算は現行を維持）なので、老齢の値ID（pension.spouseSupplement.baseAmount）と分けた。改定率は44条2項の改定率（新規裁定者の率）。施行日は e-Gov の改正履歴（2017年4月1日の版から）より前で特定できないが、2017年4月1日の版に値を定める文言（同じ引用）があるので、遅くとも2017年4月1日には施行済み（enforcedOn の notAfter）。照合: Claude Opus 5.5（原本の本文・sha256 を機械で計算）"}
