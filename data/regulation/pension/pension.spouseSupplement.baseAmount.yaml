    approval: {method: "reviewed", paths: 2, comparedBy: "claude", comparedOn: "2026-10-09", tools: ["e-Gov法令API（条文の XML）", "HTML の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], note: "条文の基準額と日本年金機構の令和8年度の額が一致（224,700円×1.085→243,800円）。令和10年4月以後に受給権を得た人は202,200円×改定率（令和7年法律第74号による改正後の44条2項。それより前に受給権を得た人は従前の額）だが、受給権の時期の条件をエンジンが扱わないため入れていない。施行日は e-Gov の改正履歴（2017年4月1日の版から）より前で特定できないが、2017年4月1日の版（329AC0000000115_20170401_424AC0000000062）に値を定める文言（同じ引用）があるので、遅くとも2017年4月1日には施行済み（enforcedOn の notAfter）。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合）"}
