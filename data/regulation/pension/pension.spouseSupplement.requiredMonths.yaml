    approval: {method: "pendingReview", paths: 2, note: "条文と日本年金機構の説明が一致。中高齢の特例（40歳以降15〜19年）は入れていない。令和10年4月から子の加算の要件は120月以上（改正後の44条1項）だが、エンジンは配偶者と同じ月数で判定する。施行日は e-Gov の改正履歴（2017年4月1日の版から）より前で特定できないため確認待ちのまま。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合）"}
