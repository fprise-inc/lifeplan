    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-10-10", "tools": ["e-Gov法令API（条文の XML）", "PDF の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], "note": "昭和60年改正法附則73条1項2号と附則別表第九の「昭和十三年四月二日から昭和十四年四月一日までの間に生まれた者」の「四百四十四分の百四十四」（厚生年金保険法の e-Gov のデータに抜き出しの形で収録。令和8年10月・平成29年4月・令和10年4月の版で同じ表。令和10年4月の版の73条は見直しの経過措置に合わせて1号の書き方が変わるが、2号（老齢基礎年金の額×別表第九の数）は同じ）と、日本年金機構の年金給付の経過措置一覧（令和8年度）の経過的寡婦加算額で一致（359,678円）。加算額＝中高齢寡婦加算の額 633,700円−（老齢基礎年金の額 844,900円×率 を先に1円未満四捨五入した額）で全29区分が1円まで一致する（633,700−844,900×率 を最後に四捨五入する順番だと8区分で1円ずれる）。633,700円は経過措置一覧、844,900円は老齢年金ガイド（令和8年度版）の昭和31年4月1日以前生まれの満額。施行日は昭和60年改正法附則1条（昭和61年4月1日）"}
