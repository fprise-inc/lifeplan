id: pension.survivor.transitionalWidowAddition.denominator
title: 経過的寡婦加算の率の分母（妻の生年月日。昭和31年4月2日以後生まれは無い）
unit: count
kind: constant
basis: "month"
entries:
  - rev: 1
    appliesFrom: "1986-04-01"
