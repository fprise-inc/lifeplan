    value: 312
    sources:
      - {"type": "web", "url": "https://www.nenkin.go.jp/service/jukyu/seido/kyotsu/nenkingaku/20150401-02.files/0804.pdf", "retrievedAt": "2026-10-10", "sha256": "64ed04ca9102f6197d0f819c1582432ed8dc742973842d6e0eacdda2ea1aa38d", "locator": "年金給付の経過措置一覧（令和8年度）の経過的寡婦加算額の欄（大正15年4月2日～昭和2年4月1日・それ以前）", "quote": "633,700円"}
      - {"type": "law", "lawNumber": "昭和六十年法律第三十四号"}
    recordedIn: "2026.9.0"
    supersededIn: "2026.9.1"
    approval: {"method": "pendingReview", "paths": 1, "note": "昭和60年改正法附則73条1項（この行を入れたときは条文と率の表を確かめていない。2026-10-10 訂正: 昭和60年改正法の附則は e-Gov の厚生年金保険法のデータに抜き出しの形で入っている）。率は、日本年金機構の年金給付の経過措置一覧（令和8年度）の経過的寡婦加算額（昭和31年4月1日以前生まれの単価: 中高齢寡婦加算 633,700円・老齢基礎年金 844,900円）から、加算額＝633,700−（844,900×率 を1円未満四捨五入した額）が全29区分で一致する率として読んだ（2026-10-10 訂正: 端数の順番。633,700−844,900×率 を最後に四捨五入すると8区分で1円ずれる）（分子は12×区分の番号、分母は300＋12×区分の番号で480が上限）。昭和2年4月1日以前生まれは率0（中高齢寡婦加算と同じ額）"}
