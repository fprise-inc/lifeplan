    approval: {method: "pendingReview", paths: 2, note: "条文の基準額と日本年金機構の令和8年度の額が一致（74,900円×1.085→81,300円。加給年金額の改定率は新規裁定者の率）。令和10年3月まで（4月からの額は rev 2）。施行日は e-Gov の改正履歴（2017年4月1日の版から）より前で特定できないため確認待ちのまま。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合）"}
