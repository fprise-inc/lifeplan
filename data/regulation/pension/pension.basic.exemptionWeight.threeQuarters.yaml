id: pension.basic.exemptionWeight.threeQuarters
title: 老齢基礎年金の額の月数に換算する保険料4分の3免除の月の割合の分子（分母は pension.basic.exemptionWeight.denominator。2009年3月以前の月は6分の3、2009年4月以後は8分の5）
