    approval: {method: "reviewed", paths: 2, comparedBy: "claude", comparedOn: "2026-10-09", tools: ["e-Gov法令API（条文の XML）", "HTML の本文（公表資料）", "PDF の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], note: "令和7年法律第74号で新設された国民年金法27条の6（老齢基礎年金の子の加算）。e-Gov の改正後の条文（令和10年4月1日の版）と衆議院の制定法律の本文が一致し、厚生労働省の概要の「一律281,700円（2024年度価格）」とも一致（269,600円×令和6年度の新規裁定者の改定率1.045＝281,732円→100円単位で281,700円）。改定率は新規裁定者の率（27条の3・27条の5の適用がないもの）。厚生年金保険法44条1項などの加算が行われている子は停止（同条1項ただし書2号）。保険料納付済期間などの月数が300に満たないときは、269,600円×改定率×月数/300（同条2項）。施行日は e-Gov の改正後の版の施行日（2028-04-01）。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合）"}
