    recordedIn: "2026.10.0"
    supersededIn: null
    approval: {method: "reviewed", paths: 2, comparedBy: "claude", comparedOn: "2026-10-25", tools: ["e-Gov法令API（条文の XML）", "PDF の本文（公表資料）", "原本の指紋（sha256）の計算"], note: "改正後の44条2項の額と、厚生労働省の資料の2024年度価格の額（特別加算を含む 367,200円）を、2024年度の新規裁定者の改定率 1.045 で式から計算し直して一致（202,200円×1.045→211,300円、149,200円×1.045→155,900円、合計 367,200円。現行は 234,800円＋173,300円＝408,100円で同じく一致）。令和10年4月より前に配偶者の加給年金額が加算された老齢厚生年金の受給権を持つ人は従前の額（附則12条4項。pension.spouseSupplement.baseAmount）。受給権の時期の条件（entitlementDate）をエンジンが読まないので、見直し前の値ID とは別の値ID にし、部品が加算の要件を満たした月で選ぶ（0007 の追記 2026-10-25）。障害厚生年金の配偶者の加給年金額は見直さない（pension.disability.spouseSupplement.baseAmount）。施行日は附則1条8号（令和十年四月一日）。照合: Claude Opus 5.5（原本の本文・sha256 を機械で計算）"}
