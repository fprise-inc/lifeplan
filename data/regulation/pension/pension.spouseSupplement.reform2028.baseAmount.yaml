    sources:
      - {type: "web", url: "https://laws.e-gov.go.jp/api/2/law_data/329AC0000000115_20280401_507AC0000000074?response_format=xml", retrievedAt: "2026-10-25", sha256: "6c3ea71940fa20510429d46664ac5e2d53ce3b4381bef01f07965d260e509060", locator: "厚生年金保険法 第44条第2項（令和10年4月1日施行の版）", quote: "同項に規定する配偶者については二十万二千二百円に国民年金法第二十七条に規定する改定率"}
      - {type: "web", url: "https://laws.e-gov.go.jp/api/2/law_data/329AC0000000115_20280401_507AC0000000074?response_format=xml", retrievedAt: "2026-10-25", sha256: "6c3ea71940fa20510429d46664ac5e2d53ce3b4381bef01f07965d260e509060", locator: "令和7年法律第74号 附則第12条第4項（e-Gov の厚生年金保険法のデータの改正法の附則）", quote: "第八号施行日前において第八号改正前厚年法第四十四条第一項の規定により配偶者に係る加給年金額が加算された老齢厚生年金の受給権を有する者については"}
      - {type: "web", url: "https://www.mhlw.go.jp/content/12401000/001592624.pdf", retrievedAt: "2026-10-25", sha256: "f29fcf6ed7169ffb3a4ac5dc495a6f42a076450c60a8d18e2b7a5f976ce09f2e", locator: "厚生労働省「年金制度改正法の概要」9ページ（Ⅲ① 配偶者に係る加算の見直し）", quote: "（現行）408,100円（見直し後）367,200円※いずれも2024年度価格の年額"}
