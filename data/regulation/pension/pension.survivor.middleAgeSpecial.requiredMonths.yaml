id: pension.survivor.middleAgeSpecial.requiredMonths
title: "中高齢者の期間短縮の特例: 40歳（女子35歳）以後の厚生年金の月数がこの月数以上なら、遺族厚生年金の長期要件・中高齢寡婦加算の240月を満たすとみなす（死亡した人の生年月日。昭和26年4月2日以後生まれは無い）"
