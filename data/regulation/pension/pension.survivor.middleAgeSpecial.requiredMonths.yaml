    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-10-10", "tools": ["e-Gov法令API（条文の XML）", "PDF の本文（公表資料）", "HTML の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], "note": "昭和60年改正法附則12条1項4号と附則別表第三の「昭和二十二年四月二日から昭和二十三年四月一日までの間に生まれた者」の「十六年」（e-Gov の国民年金法のデータに抜き出しの形で収録。令和8年10月・平成29年4月の版で同じ文）。遺族厚生年金への当てはめは、厚生年金保険法のデータ（令和8年10月の版）の昭和60年改正法附則57条（12条1項各号に当たる人は長期要件の25年を満たすとみなす）と附則61条1項（12条1項4号〜7号に当たる人の62条1項（中高齢寡婦加算）の月数は240とみなす）。2つ目の読み方は、日本年金機構の老齢年金ガイド（令和8年度版）の【特例2】、年金給付の経過措置一覧（令和8年度）の老齢基礎年金の「厚年の中高齢加入期間」の欄、遺族厚生年金のページの中高齢寡婦加算の※1で一致（16年＝192月）。数えるのは第一号厚生年金被保険者期間（共済組合等の期間を除く）。うち7年6月以上は第四種被保険者・船員任意継続被保険者以外の期間であることの要件と、坑内員・船員の特例（同項5号）は扱わない。施行日は昭和60年改正法附則1条（昭和61年4月1日）"}
