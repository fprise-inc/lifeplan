      - {"type": "web", "url": "https://www.nenkin.go.jp/service/jukyu/seido/kyotsu/nenkingaku/20150401-02.files/0804.pdf", "retrievedAt": "2026-10-10", "sha256": "64ed04ca9102f6197d0f819c1582432ed8dc742973842d6e0eacdda2ea1aa38d", "locator": "年金給付の経過措置一覧（令和8年度）（日本年金機構）の老齢基礎年金の「厚年の中高齢加入期間」の欄", "quote": "15年"}
