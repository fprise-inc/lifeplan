    approval: {method: "reviewed", paths: 2, comparedBy: "claude", comparedOn: "2026-10-09", tools: ["e-Gov法令API（条文の XML）", "HTML の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], note: "子の加給年金の要件の月数を配偶者（pension.spouseSupplement.requiredMonths）と分けるために足した行。令和10年3月までは配偶者と同じ44条1項の240月で、条文と日本年金機構の説明が一致。施行日は e-Gov の改正履歴（2017年4月1日の版から）より前で特定できないが、2017年4月1日の版（329AC0000000115_20170401_424AC0000000062）に同じ文言があるので、遅くとも2017年4月1日には施行済み（enforcedOn の notAfter）。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合）"}
