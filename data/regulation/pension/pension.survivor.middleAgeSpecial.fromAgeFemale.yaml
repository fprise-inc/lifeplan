    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-10-10", "tools": ["e-Gov法令API（条文の XML）", "PDF の本文（公表資料）", "HTML の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], "note": "昭和60年改正法附則12条1項4号の「四十歳（女子については、三十五歳）に達した月以後」（e-Gov の国民年金法のデータに抜き出しの形で収録。令和8年10月・平成29年4月の版で同じ文）。遺族厚生年金への当てはめは、厚生年金保険法のデータ（令和8年10月の版）の昭和60年改正法附則57条（12条1項各号に当たる人は長期要件の25年を満たすとみなす）と附則61条1項（12条1項4号〜7号に当たる人の62条1項（中高齢寡婦加算）の月数は240とみなす）。2つ目の読み方は、日本年金機構の老齢年金ガイド（令和8年度版）の【特例2】、年金給付の経過措置一覧（令和8年度）の老齢基礎年金の「厚年の中高齢加入期間」の欄、遺族厚生年金のページの中高齢寡婦加算の※1で一致（女子35歳）。坑内員・船員の35歳（同項5号）と、うち7年6月以上は第四種被保険者・船員任意継続被保険者以外の期間であることの要件は扱わない。施行日は昭和60年改正法附則1条（昭和61年4月1日）"}
