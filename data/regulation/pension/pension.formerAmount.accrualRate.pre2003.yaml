# 従前額保障（平成12年改正法附則21条）に使う値。計算部品はまだ無い（値だけを入れた）
id: pension.formerAmount.accrualRate.pre2003
title: 従前額保障の報酬比例の乗率（平成15年3月以前の期間。生年月日による）
unit: rate
kind: constant
basis: "month"
entries:
  - rev: 1
    appliesFrom: "2003-04-01"
    appliesTo: null
    enforcedOn: {notAfter: "2017-04-01"}
    status: "enacted"
    jurisdiction: "national"
    conditions:
      - {key: "birthDate", from: null, to: "1927-04-01"}
    value: "0.01"
    sources:
      - {type: "web", url: "https://www.shugiin.go.jp/internet/itdb_housei.nsf/html/houritsu/10219850501034.htm", retrievedAt: "2026-10-09", sha256: "b42320de8aeb8c413c40a434daabd1242f41a412c87780b1a49ed1ae09233a14", locator: "衆議院 制定法律「国民年金法等の一部を改正する法律」（昭和60年法律第34号）附則別表第七", quote: "大正十五年四月二日から昭和二年四月一日までの間に生まれた者千分の十"}
      - {type: "web", url: "https://laws.e-gov.go.jp/api/2/law_data/412CO0000000180_20151001_427CO0000000342?response_format=xml", retrievedAt: "2026-10-09", sha256: "1464617c62df4e61a6b49eacefb5f379c8354e80d8df0145ab883e58fc64e964", locator: "平成十二年度、平成十四年度及び平成十五年度の国民年金制度及び厚生年金保険制度の改正に伴う経過措置に関する政令 第18条（旧厚生年金保険法による年金の額の規定の読替え）", quote: "平均標準報酬月額（旧厚生年金保険法第三十四条第一項第二号に規定する平均標準報酬月額をいう。）の千分の十"}
      - {type: "web", url: "https://laws.e-gov.go.jp/api/2/law_data/412CO0000000180_20151001_427CO0000000342?response_format=xml", retrievedAt: "2026-10-09", sha256: "1464617c62df4e61a6b49eacefb5f379c8354e80d8df0145ab883e58fc64e964", locator: "同政令 第21条（平成15年4月以後の期間の率。改正前の附則別表第七の率を1.3で除した率を基準とする）", quote: "昭和二年四月一日以前に生まれた者千分の七・六九二"}
      - {type: "web", url: "https://laws.e-gov.go.jp/api/2/law_data/329AC0000000115_20170401_424AC0000000062?response_format=xml", retrievedAt: "2026-10-09", sha256: "b06d8a935013ae17699ff39cae5e4311a3068297c6f555499ab354120d930ca6", locator: "厚生年金保険法 附則（平成12年法律第18号）第21条第7項（e-Gov の2017年4月1日の版）", quote: "附則別表第七の規定はなおその効力を有する"}
      - {type: "web", url: "https://www.nenkin.go.jp/service/jukyu/seido/kyotsu/nenkingaku/20150401-01.files/hirei.pdf", retrievedAt: "2026-10-09", sha256: "1c50981e21f06b66393ed944236773e050615805b2903e874f4f0e00e760d58c", locator: "日本年金機構「報酬比例部分の乗率」（従前額保障の年金額計算に用いる報酬比例部分の乗率。画像の PDF で文字が無いため引用なし）"}
      - {type: "law", lawNumber: "昭和六十年法律第三十四号"}
      - {type: "law", lawNumber: "平成十二年法律第十八号"}
    recordedIn: "2026.4.0"
    supersededIn: null
    approval: {method: "reviewed", paths: 2, comparedBy: "claude", comparedOn: "2026-10-09", tools: ["e-Gov法令API（条文の XML）", "HTML の本文（公表資料）", "PDF の画像（公表資料。目視）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], note: "昭和2年4月1日以前生まれは千分の1E+1。平成12年改正法附則21条7項で効力を残した改正前の昭和60年改正法附則別表第七の率で、衆議院の制定法律の本文（昭和60年法律第34号）の表と、経過措置政令（平成12年政令第180号）21条の平成15年4月以後の率（附則21条8項: 改正前の附則別表第七の率を1.3で除した率を基準）を1.3倍して戻した値が一致（1E+1÷1.3を小数3桁に四捨五入すると政令の7.692）。日本年金機構の表（画像）とも一致（目視）。制定法律の表は大正15年4月2日〜昭和2年4月1日生まれからで、大正15年4月1日以前生まれ（旧法の年金）は経過措置政令18条の読替えで千分の十（機構の表も「〜昭和2年4月1日」で10.000）なので、1つの行にした。附則別表第七がその後（平成12年改正まで）に改正されていないことは、1.3で除した政令の率と全区分で一致することで確かめた。施行日は e-Gov の最初の版（2017年4月1日）の厚生年金保険法の附則21条7項に効力を残す文言があるので遅くとも2017年4月1日（notAfter）。平成15年3月以前・4月以後の期間ごとの乗率で、従前額保障の額＝（平均標準報酬月額×従前の再評価率×この乗率×月数＋平均標準報酬額×従前の再評価率×4月以後の乗率×月数）×従前額改定率。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合。機構の表は画像なので目視）"}
