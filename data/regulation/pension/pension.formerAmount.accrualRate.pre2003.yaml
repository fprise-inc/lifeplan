    approval: {method: "reviewed", paths: 2, comparedBy: "claude", comparedOn: "2026-10-09", tools: ["e-Gov法令API（条文の XML）", "HTML の本文（公表資料）", "PDF の画像（公表資料。目視）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], note: "昭和10年4月2日〜昭和11年4月1日生まれは千分の8.79。平成12年改正法附則21条7項で効力を残した改正前の昭和60年改正法附則別表第七の率で、衆議院の制定法律の本文（昭和60年法律第34号）の表と、経過措置政令（平成12年政令第180号）21条の平成15年4月以後の率（附則21条8項: 改正前の附則別表第七の率を1.3で除した率を基準）を1.3倍して戻した値が一致（8.79÷1.3を小数3桁に四捨五入すると政令の6.762）。日本年金機構の表（画像）とも一致（目視）。附則別表第七がその後（平成12年改正まで）に改正されていないことは、1.3で除した政令の率と全区分で一致することで確かめた。施行日は e-Gov の最初の版（2017年4月1日）の厚生年金保険法の附則21条7項に効力を残す文言があるので遅くとも2017年4月1日（notAfter）。平成15年3月以前・4月以後の期間ごとの乗率で、従前額保障の額＝（平均標準報酬月額×従前の再評価率×この乗率×月数＋平均標準報酬額×従前の再評価率×4月以後の乗率×月数）×従前額改定率。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合。機構の表は画像なので目視）"}
