    sources:
      - {type: "web", url: "https://laws.e-gov.go.jp/api/2/law_data/430CO0000000364_20251001_507CO0000000253?response_format=xml", retrievedAt: "2026-10-08", sha256: "ac58b84174714d3ba468b05269599fea481a21faf565911d7d356075e2d0f219", locator: "年金生活者支援給付金の支給に関する法律施行令 第4条の2", quote: "令和七年四月以降の月分の給付基準額（法第三条第一号に規定する給付基準額をいう。）については、法第四条第一項中「五千円」とあるのは、「五千四百五十円」と読み替えて"}
      - {type: "web", url: "https://www.nenkin.go.jp/section/faq/jukyu/seido/sonota-kyufu/shienkyufukin/kaiteitsuchi/keisan.html", retrievedAt: "2026-10-08", sha256: "96c54a4c7228e30e83f39e6b6abff90958e9ab0718e12ef058034888de7b4622", locator: "日本年金機構 年金Q&A（年金生活者支援給付金の支給金額）", quote: "令和7年度基準額（5,450円）から令和8年度基準額（5,620円）へ変更になります"}
      - {type: "law", lawNumber: "平成三十年政令第三百六十四号", egovRevisionId: "430CO0000000364_20251001_507CO0000000253"}
    recordedIn: "2026.1.0"
