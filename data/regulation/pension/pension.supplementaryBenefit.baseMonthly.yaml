    approval: {method: "reviewed", paths: 2, note: "施行令の読替えと日本年金機構の説明が一致。施行日はその額が最初に現れた施行令の版の施行日（e-Gov の改正履歴）。免除期間に基づく額（老齢基礎年金の満額の6分の1）は入れていない。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合）"}
