      - {type: "web", url: "https://laws.e-gov.go.jp/api/2/law_data/334AC0000000141_20261001_507AC0000000074?response_format=xml", retrievedAt: "2026-10-08", sha256: "04c88d7cd38da702595e915f5e517c109371553efd1282873956c6d6273c0362", locator: "国民年金法 第26条ただし書", quote: "その者の保険料納付済期間と保険料免除期間とを合算した期間が十年に満たないときは、この限りでない"}
