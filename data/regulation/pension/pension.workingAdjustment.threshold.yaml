    approval: {method: "reviewed", paths: 2, note: "令和8年度の支給停止調整額。政令の読替えと厚生労働省・日本年金機構の資料が一致。施行日はその年度の政令の施行日。法律の額は62万円（令和7年法律第74号。令和8年4月施行）で毎年度改定。令和9年度以後は延長の仮定。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合）"}
