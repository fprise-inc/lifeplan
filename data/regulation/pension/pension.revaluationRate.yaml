    approval: {method: "reviewed", paths: 2, comparedBy: "claude", comparedOn: "2026-10-09", tools: ["e-Gov法令API（条文の XML）", "PDF の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], note: "令和8年度。政令の別表第一の十一（昭和三十四年四月二日以後に生まれた者）の63行と、日本年金機構「令和８年度再評価率（一般）」の表の「昭和３１年度以後生まれ」の列の全行が一致（機械で照合。政令の別表第一の11区分×全行と機構の表の10列が一致し、区分十と十一の率は同じ）。令和7年度の率に報酬比例の改定の比 1.020（令和8年度）を掛けて小数3桁に四捨五入した値とも、直近の3期間（令和5年4月〜令和8年3月。別の規則で決まる）を除く全行（11区分で649行のうち649行）で一致。最初の行「昭和33年3月以前」には下限が無いが、形（from は必須）に合わせて from を 1900-01 にした（被保険者期間はこれより後なので、どの月にも同じ率になる）。施行日はその年度の政令の施行日（e-Gov の版）。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合）"}
