# 公的年金（老齢年金・年金生活者支援給付金）の制度データ。令和7年度・令和8年度
# 2026.2.0: 出典を公式の原本（e-Gov法令検索・日本年金機構・厚生労働省）に直した。2経路で一致し施行日も分かった行は reviewed、施行日が分からない行などは pendingReview のまま
# 2026.2.0 で足した行: 振替加算の率の3区分（昭和9年4月2日〜昭和12年4月1日生まれ）、令和10年4月からの子の加給年金額（269,600円×改定率）
# 2026.3.0 で足した行（確認待ち）: 子の加給年金の要件の月数（令和10年4月から120月）、老齢基礎年金の子の加算の基準額（令和10年4月から）
# 改定率の将来の値は持たず、プランの前提（物価・賃金・マクロ経済スライドの調整率）で延ばす（0007 の7: linkage indexed）
# 2026.4.0: 再評価率の表（pension.revaluationRate。令和7・8年度、生年月日の区分×報酬の期間の periodTable）、補足的所得基準額（pension.supplementaryBenefit.supplementaryIncomeLimit）、
#   従前額保障の値（pension.formerAmount.*: 従前の再評価率・従前額改定率・従前の乗率。計算部品はまだ無い）を足した（reviewed）。
#   値は原本の2経路で一致し施行日だけが分からなかった73行を、施行日「遅くとも2017年4月1日」（enforcedOn の notAfter）と reviewed にした（値は変えていない）。
#   2026.3.0 で確認待ちで足した3行（子の加給年金の要件の月数・老齢基礎年金の子の加算の基準額）を原本で確かめて reviewed にした（値は変えていない）
# 2026.5.0: 老齢基礎年金の子の加算の按分の月数（pension.basic.childAddition.fullMonths。300月）を新しいファイルとして足した（原本での確認待ち）。既存のファイルは変えていない
# 2026.6.0: 老齢基礎年金の子の加算の按分の月数（pension.basic.childAddition.fullMonths）を原本（国民年金法27条の6第2項の条文と社会保障審議会年金部会の資料）と
#   照らし合わせ、reviewed の行を足した（照合: claude、2026-10-09）。値は変えていない
# 2026.7.0: 遺族年金（遺族厚生年金の4分の3・300月みなし・長期要件・中高齢寡婦加算・30歳未満の妻・夫の55歳と60歳・65歳以降の調整）・寡婦年金・
#   死亡一時金・障害年金（1級の1.25・3級の最低保障・300月みなし・障害認定日）の値を新しいファイルで足した（既存のファイルは変えていない）。
#   公式のサイトにこの作業の環境から届かなかったので、検索の要約で読んだ値で、すべて原本での確認待ち（pendingReview）
# 2026.9.0: 老齢基礎年金の免除の月の割合（pension.basic.exemptionWeight.*。2009年3月以前と以後）・死亡一時金の免除の月の割合（pension.deathLumpSum.exemptionWeight.*）を
#   原本（国民年金法27条・52条の2・平成16年改正法附則10条と日本年金機構の案内）で確かめて足した。中高齢者の期間短縮の特例（pension.survivor.middleAgeSpecial.*）と
#   経過的寡婦加算の率（pension.survivor.transitionalWidowAddition.*）を新しいファイルで足した（改正法の附則の本文に届かないので原本での確認待ち）。
#   年金生活者支援給付金の免除期間の分の割合（pension.supplementaryBenefit.exemptionShare.*）を原本（法3条2号と日本年金機構の案内）で確かめて足した。既存のファイルは変えていない
