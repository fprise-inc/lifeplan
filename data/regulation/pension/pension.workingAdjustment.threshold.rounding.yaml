    approval: {method: "reviewed", paths: 2, comparedBy: "claude", comparedOn: "2026-10-25", tools: ["e-Gov法令API（条文の XML）", "原本の指紋（sha256）の計算"], note: "支給停止調整額の改定（62万円×令和7年度以後の名目賃金変動率）の端数処理。条文の端数処理と、政令で改定された令和8年度の額（65万円。1万円単位）が一致。施行日は令和7年法律第74号の施行日（令和8年4月1日。改正前の46条3項も同じ端数処理）。部品は、制度データの後の年度の額を、値のある最後の年度の額×賃金の伸び（前提）からこの端数処理で出す（0007 の追記 2026-10-25）。照合: Claude Opus 5.5（原本の本文・sha256 を機械で計算）"}
