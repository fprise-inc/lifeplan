    sources:
      - {type: "web", url: "https://laws.e-gov.go.jp/api/2/law_data/329AC0000000115_20261001_507AC0000000074?response_format=xml", retrievedAt: "2026-10-25", sha256: "1d0942ff3d38d0612341e672986f6506d7e4e5895c0f3efa58cf35d619080b40", locator: "厚生年金保険法 第46条第3項", quote: "六十二万円に令和七年度以後の各年度の物価変動率に第四十三条の二第一項第二号に掲げる率を乗じて得た率をそれぞれ乗じて得た額（その額に五千円未満の端数が生じたときは、これを切り捨て、五千円以上一万円未満の端数が生じたときは、これを一万円に切り上げるものとする。"}
