    sources:
      - {type: "web", url: "https://laws.e-gov.go.jp/api/2/law_data/334AC0000000141_20261001_507AC0000000074?response_format=xml", retrievedAt: "2026-10-08", sha256: "04c88d7cd38da702595e915f5e517c109371553efd1282873956c6d6273c0362", locator: "国民年金法 第17条第1項", quote: "年金給付の額に五十銭未満の端数が生じたときは、これを切り捨て、五十銭以上一円未満の端数が生じたときは、これを一円に切り上げるものとする"}
      - {type: "web", url: "https://laws.e-gov.go.jp/api/2/law_data/329AC0000000115_20261001_507AC0000000074?response_format=xml", retrievedAt: "2026-10-08", sha256: "1d0942ff3d38d0612341e672986f6506d7e4e5895c0f3efa58cf35d619080b40", locator: "厚生年金保険法 第35条第1項", quote: "保険給付の額に五十銭未満の端数が生じたときは、これを切り捨て、五十銭以上一円未満の端数が生じたときは、これを一円に切り上げるものとする"}
      - {type: "web", url: "https://www.nenkin.go.jp/service/jukyu/seido/kyotsu/nenkingaku/20140421-01.html", retrievedAt: "2026-10-08", sha256: "e11f76b553d6506fc8af147af77b4178d754e23b64e4572aa6f11993fcca4db6", locator: "日本年金機構「年金額の端数処理」", quote: "法律により50銭未満は切り捨てられ、50銭以上1円未満は1円に切り上げられています"}
