id: pension.survivor.transitionalWidowAddition.numerator
title: 経過的寡婦加算の率の分子（妻の生年月日。加算額＝中高齢寡婦加算の額−老齢基礎年金の満額×分子÷分母。昭和31年4月2日以後生まれは無い）
