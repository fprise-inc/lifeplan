    value: 0
    sources:
      - {"type": "web", "url": "https://www.nenkin.go.jp/service/jukyu/seido/kyotsu/nenkingaku/20150401-02.files/0804.pdf", "retrievedAt": "2026-10-10", "sha256": "64ed04ca9102f6197d0f819c1582432ed8dc742973842d6e0eacdda2ea1aa38d", "locator": "遺族厚生年金 単価表（令和8年4月）の経過的寡婦加算の欄（大正15年4月2日～昭和2年4月1日・それ以前）", "quote": "633,700円"}
      - {"type": "law", "lawNumber": "昭和六十年法律第三十四号"}
    recordedIn: "2026.9.0"
    supersededIn: null
    approval: {"method": "pendingReview", "paths": 1, "note": "昭和60年改正法附則73条1項（e-Gov に改正法の附則の本文が無く、条文と率の表は確かめていない）。率は、日本年金機構の遺族厚生年金の単価表（令和8年4月）の経過的寡婦加算の額（昭和31年4月1日以前生まれの単価: 中高齢寡婦加算 633,700円・老齢基礎年金 844,900円）から、加算額＝633,700−844,900×率（1円未満四捨五入）が全29区分で一致する率として読んだ（分子は12×区分の番号、分母は300＋12×区分の番号で480が上限）。昭和2年4月1日以前生まれは率0（中高齢寡婦加算と同じ額）"}
