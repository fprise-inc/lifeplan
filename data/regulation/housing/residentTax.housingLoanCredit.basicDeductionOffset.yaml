    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-10-09", "tools": ["e-Gov法令API（条文の XML）", "HTML の本文（公表資料）", "PDF の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], "note": "居住年が平成28年〜令和7年のとき、住民税の住宅ローン控除の上限の基礎に（所得税の基礎控除の額−48万円。0未満は0）を足す。地方税法附則5条の4第1項・6項（令和8年4月・10月の版）の条文と、総務省の事務連絡（令和7年以前の入居の控除限度額を所得税の基礎控除の引上げに合わせる措置、令和8年度分から）・国税庁 No.1199（令和6年分以前の基礎控除は48万円＝引上げ前の額）で一致。施行は令和8年4月1日・令和8年度分の住民税から（改正法附則3条1項）。それより前の年度は加算の規定が無いが、基礎控除が48万円以下だったので加算は0で結果は同じ"}
