      - {"type": "web", "url": "https://laws.e-gov.go.jp/api/2/law_data/325AC0000000226_20261001_508AC0000000002?response_format=xml", "retrievedAt": "2026-10-08", "sha256": "75423280db9e51c649df89312e99726fdc617c9229fbb67535ddddc6523a3eb9", "locator": "地方税法 附則第5条の4第1項・第6項（令和8年10月1日の版）", "quote": "居住年が平成二十八年から令和七年までの各年である場合には、当該納税義務者の前年分の所得税に係る同法第八十六条第二項に規定する基礎控除の額（租税特別措置法第四十一条の十六の二第一項の規定の適用がある場合には、その適用後の額）から四十八万円を控除して得た額"}
