# 住宅借入金等特別控除（住宅ローン控除）の制度データ（0007 の1: パック regulation.housing）。値は入居の年月（basis: anchor moveIn）で選ぶ
# 2026.1.0: 最初の版。令和4年〜12年入居（令和8年度税制改正で令和12年入居まで延長）の借入限度額・控除率・控除期間・所得の上限、住民税の控除の上限。
#   公式のサイト（国税庁・国土交通省・財務省）にこの作業の環境から届かなかったので、検索の要約で読んだ値を入れた。すべて原本での確認待ち（pendingReview）
#   令和3年以前の入居の値は入れていない（部品は値が無いと控除を計算せず N_PARAM_MISSING で知らせる）
# 2026.2.0: 公式の原本（e-Gov法令検索の条文（租税特別措置法41条・地方税法附則5条の4）と、国税庁・国土交通省・総務省の公表資料）と2つの読み方で照らし合わせ、
#   一致した行を reviewed にした（照合: claude、2026-10-09）。施行日を行ごとに持つため、入居の年の区切りを施行の単位（令和4〜7年／令和6年・7年の子育て特例／令和8〜12年／令和13年以後）に分けた（値は変えていない）。
#   住民税の控除は、令和4〜7年入居が令和5年1月1日施行、令和8〜12年入居が令和9年1月1日施行（令和13年以後の入居の行を足した）。
#   令和3年以前の入居の値は入れていない（特定取得・特別特定取得の区分と11〜13年目の別の計算が要り、今の値の形と部品では表せない）。住民税の7%・136,500円の行（特定取得だけの値）は確認待ちのまま
# 2026.3.0: 住民税の控除の上限の基礎に足す（所得税の基礎控除−48万円）の差し引きの額（residentTax.housingLoanCredit.basicDeductionOffset。居住年が平成28年〜令和7年）を
#   新しいファイルとして足した（原本での確認待ち）。既存のファイルは変えていない
# 2026.4.0: 住民税の控除の上限の基礎に足す額の差し引き（residentTax.housingLoanCredit.basicDeductionOffset）を原本（地方税法附則5条の4の条文、
#   総務省の事務連絡、国税庁 No.1199）と照らし合わせ、reviewed の行を足した（照合: claude、2026-10-09）。施行日は令和8年4月1日（令和8年度分から）。値は変えていない
# 2026.5.0: 住宅取得等資金の贈与税の非課税（省エネ等住宅1,000万円・それ以外500万円・令和8年12月31日まで・受贈者の合計所得金額2,000万円以下）を
#   新しいファイルで足した（既存のファイルは変えていない。検索の要約で読んだ値で、原本での確認待ち）
