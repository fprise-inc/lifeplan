# NISA・iDeCo・企業型DC の制度データと、課税口座の上場株式等の譲渡益の税率（0007 の1: パック regulation.nisaIdeco）
# 2026.1.0: 最初の版。公式のサイト（金融庁・厚生労働省・国税庁・財務省）にこの作業の環境から届かなかったので、
#   公式のドメインの資料の検索の要約と政府広報・報道で読んだ値を入れた。すべて原本での確認待ち（approval.method: pendingReview）
# 上場株式等の譲渡益の税率（incomeTax.listedSecurities.*・residentTax.listedSecurities.*）は税の値だが、
#   既存の regulation.tax のファイルを書き換えない約束（手元で原本から値を入れている最中）のため、このパックに置いた。値IDは税の名前のまま
# 2026.2.0: 公式の原本（e-Gov法令検索の条文（確定拠出年金法・同施行令・租税特別措置法）、厚生労働省・金融庁・財務省・国税庁・国民年金基金連合会の公表資料）と
#   2つの読み方で照らし合わせ、一致した行を reviewed にした（照合: claude、2026-10-09）。原本の写しは非公開のリポジトリに置き、出典には URL・取得日・sha256・位置・短い引用を書いた。
#   訂正: マッチング拠出の制限の撤廃は2026年4月1日施行（2026年12月分からではない）、ジュニアNISA の年齢は2022年までは20歳。
#   iDeCo の最低額（5,000円）と、ジュニアNISA の2022年までの行は確認待ちのまま（pendingReview）。
#   上場株式等の譲渡益の税率と端数（incomeTax.listedSecurities.*・residentTax.listedSecurities.*）は、値IDはそのままで regulation.tax（2026.6.0）に移した（設計記録 0007 への提案）
