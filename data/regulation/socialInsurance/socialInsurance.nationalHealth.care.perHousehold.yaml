      - {type: "web", url: "https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040442411&fileKind=4", retrievedAt: "2026-10-25", sha256: "d2832e6cd9734e8b718c25a7ddac80e67aa6ae586c6a077af761d9adabf18693", locator: "厚生労働省「国民健康保険実態調査（令和6年度）」統計表（世帯票） 世帯主が40〜64歳の5つの行の介護納付金分の世帯別平等割額の計 14,204,194千円 ÷ 世帯数の計 4,387,000世帯", quote: "第９表－１－１　世帯主の年齢階級別、保険料（税）算定状況・賦課状況　　－擬制世帯を除く世帯－"}
