    approval: {method: "reviewed", paths: 2, note: "令和7年8月〜令和8年7月の額。厚生労働省の報道発表（30歳以上45歳未満の賃金日額の上限の新旧）と労働局のリーフレットが一致し、育児休業給付金の支給上限額323,811円（＝16,110円×30日×67%）とも合う。施行日は毎月勤労統計による改定の適用日（雇用保険法17条4項・18条。リーフレットの適用日）。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合）"}
