    approval: {method: "pendingReview", paths: 1, note: "令和5年4月〜令和7年3月。労働者負担7/1,000。原本は令和7年度のご案内の下段の1つだけで、令和5年度・令和6年度のご案内（同じ厚生労働省のページの PDF）とはまだ照らし合わせていない。施行日は、ご案内の下段の期間の始まり。計算基準月の前の年の所得に対する住民税（社会保険料控除）の計算で、前の年の1〜3月の賃金に使う。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合）"}
