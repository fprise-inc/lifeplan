    approval: {"method": "pendingReview", "paths": 1, "note": "令和8年8月〜令和9年7月の額（60歳以上65歳未満の表）。12,120円で 0.8w−0.35w＝0.05w＋0.4×12,120 になり、16条2項の式と合う。令和7年8月〜令和8年7月の額は原本（PDF）でしか読めず、まだ置いていない（部品は後の期間の値で計算して知らせる）。令和9年8月以後は延長の仮定。照合: claude（2026-10-26。原本との指紋の照合は未了）"}
