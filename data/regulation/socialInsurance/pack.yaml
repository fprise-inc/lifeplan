# 2026.3.0: 公式の原本（e-Gov法令検索・国税庁・総務省・地方公共団体・協会けんぽ・日本年金機構・厚生労働省）で照合した。原本の写しは非公開のリポジトリに置き、出典には URL・取得日・sha256・位置・短い引用を書いた
# 2つの経路で一致し施行日も分かった行は approval.method: reviewed。施行日は、値を定める現行の規定の文言が e-Gov の改正履歴で最初に現れた版の施行日（それより前から同じ値のことがある）。履歴（2017年4月1日の版から）より前で特定できない行と、経路が1つの行は pendingReview のまま
# 被用者保険（健康保険・介護保険・子ども・子育て支援金・厚生年金・雇用保険）の制度データ。令和7年度・令和8年度
# 2026.4.0: 適用拡大・被扶養者・国民年金・国民健康保険・後期高齢者医療・介護保険（第1号）・休業の給付の値を新しいファイルで足した（2026.3.0 までの行は変えていない）
# 国民健康保険の全国の標準的な料率は公式の値が見つからず、置いていない（世帯の入力が要る）
# 2026.4.0 で足した行は、原本（PDF・Excel）を取得できず公式のドメインに限った検索の抜粋で読んだ値なので、原本での確認待ち（approval.method: pendingReview）
# 2026.4.1: 「確認済み（reviewed）」を「公式の原本と2つの読み方で照らし合わせて一致した」と定め（0007 の追記）、reviewed の行に照らし合わせた者・道具・日（comparedBy・tools・comparedOn）を足した。
#   値は原本の2経路で一致し施行日だけが分からなかった6行を、施行日「遅くとも2017年4月1日」（enforcedOn の notAfter）と reviewed にした（値は変えていない。新しい値・期間は無いので訂正番号を上げた）
# 2026.4.2: 値は原本の2経路で一致し施行日だけが分からなかった25行を reviewed にした（値は変えていない）。20行は e-Gov の2017年4月1日の版に文言があるので notAfter、
#   5行は値を定める現行の文言が最初に現れた版の施行日（2021-01-01・2025-04-01・2026-04-01）。新しい値・期間は無いので訂正番号を上げた
