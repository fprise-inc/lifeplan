    approval: {method: "pendingReview", paths: 1, note: "合計所得金額の給与所得と公的年金等に係る所得の合計から10万円、「その他の合計所得金額」の給与所得（所得金額調整控除の前）から10万円。第1〜5段階の保険料は同じ扱い（令和6年1月の厚生労働省の事務連絡）だが、その条文（施行令38条）は照合していない。施行日は令和3年8月の近似。原本（e-Gov法令API の条文の XML）の本文と sha256 を機械で照合した（2026-11-08）。2つ目の読み方（自治体・広域連合の説明）はまだ無いので確認待ち。照合: Claude Opus 5.5"}
