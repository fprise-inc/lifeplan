    supersededIn: null
    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-10-25", "tools": ["e-Gov法令API（条文の XML）", "HTML の本文（公表資料）", "PDF の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], "note": "任意継続被保険者の標準報酬月額は、資格を失ったときの標準報酬月額と、前年（1〜3月は前々年）9月30日の全被保険者の標準報酬月額の平均に当たる額の少ないほう（健康保険法47条1項）。協会けんぽは令和7年度（令和7年4月分から）32万円、令和8年度も32万円（令和7年9月30日の平均318,100円が第23級32万円）。令和7年3月分までは30万円（値のパックは令和7年度から）。協会けんぽのよくあるご質問・岡山支部の令和7年度の保険料額一覧表・令和8年度のお知らせで一致。健保組合・共済の上限は組合の規約で決まるので持たない"}
