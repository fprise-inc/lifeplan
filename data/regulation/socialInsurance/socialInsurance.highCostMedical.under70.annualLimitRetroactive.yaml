    sources:
      - {"type": "web", "url": "https://laws.e-gov.go.jp/api/2/law_data/215IO0000000243_20260729_508CO0000000240?response_format=xml", "retrievedAt": "2026-10-09", "sha256": "ccb0b6b668e28a61914502d7f5dbdfb2597aaeda94a809d3ed74c4f74d478dca", "locator": "健康保険法施行令 第41条の2・第42条（令和8年7月29日の版。年間上限の第41条の3は無い）", "quote": "（高額療養費算定基準額）第四十二条第四十一条第一項の高額療養費算定基準額は"}
      - {"type": "web", "url": "https://laws.e-gov.go.jp/api/2/law_data/215IO0000000243_20260801_508CO0000000240?response_format=xml", "retrievedAt": "2026-10-09", "sha256": "77a492e0652f347af67dde05dd65d8fcb329387cf3dae8b174578ecb90eefc93", "locator": "健康保険法施行令 第41条の3（令和8年8月1日の版で新設。年間上限）", "quote": "第四十一条の三高額療養費は、計算期間において"}
      - {"type": "web", "url": "https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryouhoken/juuyou/kougakuiryou/index.html", "retrievedAt": "2026-10-09", "sha256": "f0359573fdc1c984f0d71f622a59fa1ba2ac0594400175b324750877b60d05ef", "locator": "高額療養費制度（厚生労働省）", "quote": "令和８年７月までの制度では、月単位の上限額となっていますが、令和８年８月からは新たに年単位の上限額を設ける「年間上限」が設けられ"}
      - {"type": "law", "lawNumber": "大正十五年勅令第二百四十三号", "egovRevisionId": "215IO0000000243_20260801_508CO0000000240"}
    recordedIn: "2026.7.1"
    supersededIn: null
    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-10-10", "tools": ["e-Gov法令API（条文の XML）", "HTML の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], "note": "令和8年7月までは年間上限が無く、計算し直しも無い（制度なしの行）。健康保険法施行令の令和8年7月29日の版に第41条の3（年間上限）が無く、令和8年8月1日の版で新設されたことと、厚生労働省の案内で一致。施行日の欄は年間上限が始まる日"}
