id: socialInsurance.highCostMedical.under70.annualLimitRetroactive
title: 高額療養費の年間上限を次の期間の区分と年間上限で計算し直して払い戻すか（1 は払い戻す。令和8年8月〜令和9年7月の年収約200万円以下の41万円）
unit: count
kind: constant
basis: "month"
entries:
  - rev: 1
    appliesFrom: "2015-01-01"
    appliesTo: "2026-07-31"
    enforcedOn: null
    status: enacted
    jurisdiction: "national"
    conditions: []
    value: "notApplicable"
    sources:
