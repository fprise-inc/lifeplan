    recordedIn: "2026.7.0"
    supersededIn: "2026.7.1"
    approval: {"method": "pendingReview", "paths": 1, "note": "「年収換算 ～約200万円（健保：15万円以下、国保：86万円以下）」は令和9年8月からの第12区分と同じ境なので、部品は令和9年8月の区分の表と年間上限の表で計算し直す。償還の月は令和9年8月とみなす（実際はそれより後になりうる）。この行を入れたときは政令の条文（経過措置）を確かめていない（2026-10-10 に確かめた: 令和8年政令第240号の附則）"}
