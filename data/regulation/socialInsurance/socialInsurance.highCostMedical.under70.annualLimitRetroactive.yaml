    sources:
      - {"type": "web", "url": "https://laws.e-gov.go.jp/api/2/law_data/215IO0000000243_20261001_508CO0000000276?response_format=xml", "retrievedAt": "2026-10-08", "sha256": "76414ba1bf16291870f2efaa7d7edd9f1ed274ce108b88b31be6bb58d8f44ccb", "locator": "健康保険法施行令 附則（令和8年政令第240号）第19条第1項（令和8年10月1日の版）", "quote": "標準報酬月額が十六万円未満の被保険者である者（新健康保険法施行令第四十二条第十一項第四号に掲げる者を除く。）に該当していることにつき保険者の確認を受けている者については、第二号新健康保険法施行令第四十二条第十一項（第四号に係る部分に限る。）の規定の例による高額療養費算定基準額を用いて"}
      - {"type": "web", "url": "https://laws.e-gov.go.jp/api/2/law_data/333CO0000000362_20260801_508CO0000000240?response_format=xml", "retrievedAt": "2026-10-08", "sha256": "41e7dffd51eedd191464031e1e88e71ec62744e32f50ecabdd72ee4d503d0cfa", "locator": "国民健康保険法施行令 附則（令和8年政令第240号）第25条第1項（令和8年8月1日の版）", "quote": "基準所得額を合算した額が八十六万円以下の場合（新国民健康保険法施行令第二十九条の三第十二項第四号に掲げる場合を除く。）に該当していることにつき市町村又は組合の確認を受けている場合については、第二号新国民健康保険法施行令第二十九条の三第十二項（第四号に係る部分に限る。）の規定の例による高額療養費算定基準額を用いて"}
      - {"type": "web", "url": "https://laws.e-gov.go.jp/api/2/law_data/215IO0000000243_20270801_508CO0000000240?response_format=xml", "retrievedAt": "2026-10-09", "sha256": "7d0af72aec713e039e88453498b79bb5f783744ab43e664bfe7d1e09e87d3ea9", "locator": "健康保険法施行令 第42条第11項第4号（令和9年8月1日の版。附則19条1項が例による規定）", "quote": "四基準日の属する月の標準報酬月額が十六万円未満の被保険者（次号に掲げる者を除く。）四十一万円"}
      - {"type": "web", "url": "https://www.mhlw.go.jp/content/001726232.pdf", "retrievedAt": "2026-10-09", "sha256": "df9834435fe4d02466f94fbc8cecf5e7e544ea169ae111942d4ae5be9974c6b9", "locator": "高額療養費制度の見直しについて 令和８年８月～令和９年７月の表の※5（厚生労働省）", "quote": "年間上限41万円を適用し、令和９年８月以降に償還払い。"}
      - {"type": "law", "lawNumber": "大正十五年勅令第二百四十三号", "egovRevisionId": "215IO0000000243_20261001_508CO0000000276"}
      - {"type": "law", "lawNumber": "昭和三十三年政令第三百六十二号", "egovRevisionId": "333CO0000000362_20260801_508CO0000000240"}
    recordedIn: "2026.7.1"
    supersededIn: null
    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-10-10", "tools": ["e-Gov法令API（条文の XML）", "PDF の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], "note": "令和8年政令第240号の附則で、令和8年8月〜令和9年7月の年間上限は、標準報酬月額16万円未満（健康保険法施行令の附則19条1項）・世帯の基準所得額の合算86万円以下（国民健康保険法施行令の附則25条1項）と保険者の確認を受けた人について、令和9年8月1日の版の健康保険法施行令42条11項4号（国民健康保険は29条の3第12項4号）の41万円を用いて算定する。厚生労働省の資料の※5（健保15万円以下・国保86万円以下。令和9年8月以降に償還払い）と一致（標準報酬月額15万円は16万円未満の最も上の等級）。部品は令和9年8月の区分の表と年間上限の表で計算し直す。償還の月は令和9年8月とみなす（実際はそれより後になりうる。保険者の確認の手続きは扱わない）"}
