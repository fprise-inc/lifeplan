    approval: {method: "pendingReview", paths: 1, note: "全国の目安（既定の値）。市町村ごとの料率は世帯の入力で上書きする（0007 の6）。公式の統計の令和6年度の市町村国保の医療給付費分の保険料（税）算定額（軽減・賦課限度額の前）から作った: 所得割額の合計÷所得割額のある世帯の課税標準額（旧ただし書方式。総所得金額等−基礎控除）の合計＝7.767%を小数4桁に四捨五入。資産割（4方式の市町村だけ。算定額の0.2%）は入れていない。統計の値は令和6年度なので、令和7年度以後の既定として使う（新しい統計が出たら行を足す）。施行日の欄は統計の公表日（e-Stat の公開日）。照合: Claude Opus 5.5（Excel の表を機械で読み、合計から計算）"}
