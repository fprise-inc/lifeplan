    approval: {method: "pendingReview", paths: 1, note: "年金収入等の境目800,000円。第1〜3段階の公費による軽減の後の割合（0.285・0.485・0.685）は厚生労働省の資料だけで確かめた（施行令の標準割合は4.55/10・6.85/10・6.9/10で、軽減は別の規定）。境目の改定時期（令和7年4月・令和8年4月）は厚生労働省の資料による。市町村の段階・割合は条例で違う。照合: Claude Opus 5.5（原本の本文・sha256 を機械で照合）"}
