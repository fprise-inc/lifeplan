# 退職給付の制度データ（0007 の1: パック regulation.retirement）。公務員の退職手当の支給率・小規模企業共済の掛金と分割共済金
# 2026.1.0: 最初の版。公式のサイト（内閣官房・中小企業基盤整備機構）にこの作業の環境から届かなかったので、検索の要約で読んだ値を入れた。
#   すべて原本での確認待ち（pendingReview）。公務員の退職手当の支給率は、検索で確かめられた勤続年数の段だけを入れ、ほかの段は率を入れていない
#   （部品は見込み額の入力を求める）。退職所得の税の値は regulation.tax（incomeTax.retirementIncome.*）
# 2026.2.0: すべての値を原本（e-Gov法令検索の国家公務員退職手当法・小規模企業共済法の条文、内閣人事局の国家公務員退職手当支給率早見表、
#   中小企業基盤整備機構の案内と制度のしおり）と2つの読み方で照らし合わせ、reviewed の行を足した（照合: claude、2026-10-09）。古い行には supersededIn を書いた。
#   公務員の退職手当の支給率は、値の無かった勤続年数の段（定年等の11〜14・16〜19・21〜24・26〜29・31〜34年、自己都合の11〜14・16〜19・21年以上）を
#   条文から計算して足し、早見表の全行と一致することを確かめた。値は変えていない
packId: regulation.retirement
formatVersion: "0.1"
