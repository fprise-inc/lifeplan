    approval: {"method": "pendingReview", "paths": 1, "note": "15%（復興特別所得税と合わせて15.315%、住民税5%と合わせて20.315%）。令和8年度税制改正で、金融商品取引業者の登録簿に載る暗号資産（特定暗号資産）を暗号資産取引業を行う者に対して譲渡等した所得を、改正金融商品取引法の施行日の属する年の翌年1月1日（2028年1月1日の見込み）以後の譲渡等から申告分離課税にする。開始の年・税率・status（enacted）は利用者の判断の前提で、改正法の条文・施行日・国税庁と金融庁の公表は原本で確かめていない"}
