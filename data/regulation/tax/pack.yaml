# 2026.3.0: 公式の原本（e-Gov法令検索・国税庁・総務省・地方公共団体・協会けんぽ・日本年金機構・厚生労働省）で照合した。原本の写しは非公開のリポジトリに置き、出典には URL・取得日・sha256・位置・短い引用を書いた
# 2つの経路で一致し施行日も分かった行は approval.method: reviewed。施行日は、値を定める現行の規定の文言が e-Gov の改正履歴で最初に現れた版の施行日（それより前から同じ値のことがある）。履歴（2017年4月1日の版から）より前で特定できない行と、経路が1つの行は pendingReview のまま
# 所得税・住民税（森林環境税を含む）の制度データ。令和7年分・令和8年分（住民税は令和8年度・令和9年度）を中心に入れた
# 2026.4.0: 公的年金等控除・所得金額調整控除・確定申告不要制度・住民税の非課税限度額・年金からの特別徴収の値を新しいファイルで足した（2026.3.0 までの行は変えていない）
# 2026.4.0 で足した行は、原本（PDF・Excel）を取得できず公式のドメインに限った検索の抜粋で読んだ値なので、原本での確認待ち（approval.method: pendingReview）
# 2026.5.0: 「確認済み（reviewed）」を「公式の原本と2つの読み方で照らし合わせて一致した」と定め（0007 の追記）、reviewed の行に照らし合わせた者・道具・日（comparedBy・tools・comparedOn）を足した。
#   値は原本の2経路で一致し施行日だけが分からなかった41行を、施行日「遅くとも2017年4月1日」（enforcedOn の notAfter）と reviewed にした（値は変えていない）。
#   給与所得の表の区分の幅（incomeTax.employmentIncome.tableSteps）と住民税の分割金額の端数（residentTax.installment.*.rounding）を新しいファイルで足した（原本での確認待ち）
# 2026.5.1: 値は原本の2経路で一致し施行日だけが分からなかった11行を reviewed にした（値は変えていない）。8行は notAfter（2017年4月1日の版に文言がある）、
#   3行は値を定める現行の文言が最初に現れた版の施行日（2019-01-01・2021-01-01）。新しい値・期間は無いので訂正番号を上げた
# 2026.6.0: 上場株式等の譲渡所得等の税率と特定口座の源泉徴収の端数（incomeTax.listedSecurities.*・residentTax.listedSecurities.*）を regulation.nisaIdeco から値IDはそのままで移した。
#   移した行の recordedIn "2026.1.0" は regulation.nisaIdeco の版（その版で初めて入った）。税率の2つの値は原本（措置法37条の11・地方税法71条の49と国税庁の資料）と照らし合わせて reviewed の行を足した。端数の2つの値は確認待ちのまま
# 2026.7.0: 退職所得の分離課税の値（incomeTax.retirementIncome.*: 退職所得控除額・2分の1・特定役員退職手当等・短期退職手当等・重複排除期間の年数・端数）を
#   新しいファイルとして足した。公式のサイトにこの作業の環境から届かなかったので、検索の要約で読んだ値で、すべて原本での確認待ち（pendingReview）。既存のファイルは変えていない
