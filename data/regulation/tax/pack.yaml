# 2つの経路で一致し施行日も分かった行は approval.method: reviewed。施行日は、値を定める現行の規定の文言が e-Gov の改正履歴で最初に現れた版の施行日（それより前から同じ値のことがある）。履歴（2017年4月1日の版から）より前で特定できない行と、経路が1つの行は pendingReview のまま
