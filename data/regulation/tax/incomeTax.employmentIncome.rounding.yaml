      - {type: "law", lawNumber: "昭和四十年法律第三十三号", egovRevisionId: "340AC0000000033_20261001_507AC0000000070"}
    recordedIn: "2026.18.0"
    supersededIn: null
    approval: {method: "reviewed", paths: 2, comparedBy: "claude", comparedOn: "2026-11-08", tools: ["e-Gov法令API（条文の XML）", "PDF の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], note: "条文（別表第五の備考）と年末調整のしかたが一致。給与所得（収入−給与所得控除額）を1円未満切り捨て（控除額の側は切り上げになる）。660万円未満は表の区分の下限（4,000円などの倍数）で計算するので端数は出ない。令和10年1月1日の版の別表第五にも同じ備考がある。施行日は e-Gov の改正履歴（2017年4月1日の版から）より前で特定できないが、その最初の版に同じ文言があるので、遅くとも2017年4月1日には施行済み（enforcedOn の notAfter）。これまでの仮の規約 conv.tax.fractionalDeduction（控除額を切り捨て。所得が1円多くなっていた）を置き換えた（0002 の追記）"}
