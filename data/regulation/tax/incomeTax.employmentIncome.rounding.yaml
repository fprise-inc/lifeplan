      - {type: "web", url: "https://laws.e-gov.go.jp/api/2/law_data/340AC0000000033_20261001_507AC0000000070?response_format=xml", retrievedAt: "2026-10-08", sha256: "bf6869bc9ca55e4b20db4d3a2133aca06d5877eab9e2980612688033fc888121", locator: "所得税法 別表第五（備考）", quote: "給与等の金額が６，６００，０００円以上の居住者の給与所得控除後の給与等の金額に１円未満の端数があるときは、これを切り捨てた額をもつてその求める給与所得控除後の給与等の金額とする。"}
