# 所得税法別表第五の備考（給与等の金額が660万円以上の居住者の給与所得控除後の給与等の金額の1円未満の端数）
id: incomeTax.employmentIncome.rounding
title: 給与所得控除後の給与等の金額（算式で求める660万円以上）の1円未満の端数（切り捨て）
