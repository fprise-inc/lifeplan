    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-10-10", "tools": ["e-Gov法令API（条文の XML）", "PDF の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], "note": "法令に端数の定めが無い（租税特別措置法70条の2の5第3項は按分の割合だけを定める）ので、税務の取扱いをする国税庁の計算明細の様式に従う。令和7年分贈与税の申告書の3ページ目「贈与税（暦年課税）の税額の計算方法等」の３の記載例（3,660,000円×5,000,000円/15,000,000円＝1,220,000円、4,505,000円×（10,000,000円−0円）/15,000,000円＝3,003,333円。各部分に「１円未満の端数があるときは、その端数金額を切り捨てます。」、合計 4,223,333円）と、「贈与税の申告のしかた」15ページの【事例２】の計算明細（410,000円×300万/450万＝273,333円、430,000円×150万/450万＝143,333円、合計 416,666円）の2つで一致。按分の割合は配偶者控除の後の額の比（一般贈与財産の側は（一般贈与財産−配偶者控除）÷（合計−配偶者控除）。措置法70条の2の5第3項）。施行日は措置法70条の2の5第3項の文言が e-Gov の最初の版にあるので notAfter"}
