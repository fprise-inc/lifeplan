      - {"type": "web", "url": "https://laws.e-gov.go.jp/api/2/law_data/332AC0000000026_20261001_508AC0000000012?response_format=xml", "retrievedAt": "2026-10-08", "sha256": "2ffb4df56f9c0ce8bb14334cdf305d1cb089b34c5aa026d84b2758f979450cf6", "locator": "租税特別措置法 第70条の2の5第3項第2号（令和8年10月1日の版。按分の割合だけを定め、端数の定めは無い）", "quote": "一般贈与財産の価額（同法第二十一条の六の規定による控除後のものとする。）が合計贈与価額のうちに占める割合を乗じて計算した金額"}
