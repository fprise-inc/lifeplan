    approval: {method: "reviewed", paths: 2, note: "令和10年分以後は本則（収入×30%＋8万円、69万円未満は69万円）。69万円の段の上限 2,033,333円は 0.3×収入＋80,000円＝690,000円となる収入（円未満は切り捨て）。所得税法28条3項（令和8年12月1日施行）と国税庁の改正のあらましが一致し、別表第五（令和10年の版）の4,000円刻みの全行もこの表で再計算して一致。施行日は69万円の規定の施行日"}
