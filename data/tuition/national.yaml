# 国立大学の学校別の入学料・授業料（0010 の3・7・8、0219。マスタデータ master.education.tuition の正本）。FPライズが整理した部分で、CC0-1.0。
# 各大学の公式ページ（入学料・授業料の案内・授業料の改定のお知らせ・募集要項）から数値だけを取り出した。進学情報サイト・まとめサイトからは取らない。
# 原本の写しは公開しない（sources の url・取得日・指紋 sha256 だけを置く）。
#
# plans: 授業料・入学料の区分。day 学部・evening 学部の夜間主コース・medDent 東京科学大学の医学部・歯学部・master 修士・博士前期・
#   doctor 博士・博士後期・professional 専門職大学院（法科大学院を除く）・law 法科大学院
# revisions: 入学年度の区間ごとの額。from は改定の始まり（最初の行は null = それより前から）。appliesTo は改定を当てる人:
#   newEntrants（その年度からの入学者。在学生は据え置き）・allStudents（その年度から在学生も）。admission が null の区間は入学料を持たない
#   （公式に年度別の記載が無い過去の入学者。計算基準月より前に払い終わっている）
# latestEntryYear: 額が公式に出ている最も先の入学年度。それより先の入学は、この年度の額を教育費の上昇率で伸ばす（0010 の7。知らせ N_ESTIMATED）
# status: reviewed（2つの読み方で一致・省令の上限の中）・pendingReview（確かめ待ち。行を写さず、標準額で計算する）
# general: 案内にある在学中の改定の注記（inSchoolRevisionApplies = 在学中に改定されたら改定の後の額・other・none）
