    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-10-31", "tools": ["HTML の本文（公表資料）", "引用と原本の指紋（sha256）の機械照合"], "note": "令和8年9月 利率固定方式 3.000%（7〜9月は同じ）。利率見直し方式は 2.400%。2つ目の読み方: 推移の表の月ごとの並びと、案内のページの決まり（貸与が終わった月の利率・上限年3%）が合う。利率は貸与を終えた月で決まるので、今から借りる子の利率は将来の値になる（今の利率で代える）。公表日は原本に無いので、施行日の欄は取得日。毎月変わるので、リリースのたびに見直す"}
