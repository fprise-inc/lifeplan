    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-11-01", "tools": ["HTML の本文（公表資料）を表の並びで読んだ結果", "ページの表示を別の読み方（ページの要約の読み取り）で読んだ結果", "引用と原本の指紋（sha256）の機械照合"], "note": "各年度の3月（多くの人が卒業で貸与を終える月）の利率固定方式の利率: 平成23年度 1.17・24年度 1.08・25年度 0.82・26年度 0.63・27年度 0.16・28年度 0.33・29年度 0.27・30年度 0.14・令和元年度 0.070・2年度 0.268・3年度 0.369・4年度 0.905・5年度 0.940・6年度 1.641・7年度 2.423（%）。15年の平均 0.7477% を 0.01% 単位に丸めて 0.75%。2つ目の読み方: 2つの読み方の15の値がすべて一致。15年にしたのは、月5万円・4年（240万円）の返す年数が返還年数算出表で15年のため（今返している人の多くは、この15年のどこかで貸与を終えている）。中央値は 0.63% で、平均より低い。利率見直し方式の人は5年ごとに見直され、令和8年3月からの見直しの後の利率は1.2〜1.3%ほど（平成22年度・令和2年度に貸与を終えた人）で、この目安より高い。無利子の第一種は0%。借りた時期の利率で決まるので、返還の書類（返還の予定の表）でわかれば直す。新しい年度の3月の利率が出たら（毎年4月）、15年の窓を1年ずらして見直す"}
