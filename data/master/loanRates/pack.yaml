# 住宅ローン以外のローンの金利の目安（0007 の1: マスタデータ master.loanRates。奨学金・自動車ローンの推定の目安に使う）
# 2026.1.0: 最初の版。2か所で違っていた目安（子ども・教育の入力項目の貸与の奨学金とほかのローンの「奨学金の返済」、車の入力項目の自動車ローンと
#   今返している自動車ローン）を、ここの1つの値にそろえた。
#   - 貸与の奨学金: 日本学生支援機構の第二種奨学金の貸与利率（基本月額・利率固定方式。令和8年9月に貸与を終えた人）
#   - 自動車ローン: 主要な銀行が公表する自動車ローンの最も低い金利の平均（民間の公表の金利）
#   原本（公表の HTML・JSON・JS のデータ）と照らし合わせた（reviewed。照合: claude、2026-10-31）。金利は市場で動くので、リリースのたびに見直す（docs/estimates-review.md）
# 2026.2.0（2026-11-01）: 今返している奨学金の利率の目安を足した（loanRates.scholarship.repaying。日本学生支援機構の第二種奨学金の貸与利率のうち、
#   平成24年3月〜令和8年3月の15年の各年3月に貸与を終えた人の利率固定方式の利率の平均）。利率は貸与を終えた月で決まるので、今返している人には
#   今の利率（loanRates.scholarship。これから借りる子の目安）より、過去の利率が当たる。原本と照らし合わせた（reviewed。照合: claude、2026-11-01）
