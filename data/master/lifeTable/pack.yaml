# 簡易生命表の主な年齢の平均余命（0007 の1: マスタデータ master.lifeTable。必要保障額の推移の期間（配偶者の平均余命）に使う）
# 2026.1.0: 最初の版。厚生労働省「令和7(2025)年簡易生命表」（2026年7月24日公表）の主な年齢（0・20・30・40・50・60・65・70・75・80・85・90歳）の
#   平均余命（男女）。公式のサイトにこの作業の環境から届かなかったので、検索の要約で読んだ値で、原本での確認待ち（pendingReview）。
#   1歳ごとの値（統計表）は取れなかったので、年齢の間は部品が補間する（知らせ N_ESTIMATED）
# 2026.3.0: 90歳より上の段（95歳・100歳・105歳以上）を、同じ公表の全年齢の表（life25-12.xlsx）から足した。前は最後の段が90歳の値で、
#   91歳から上の人にも90歳の平均余命を使っていた（100歳の女で 5.66年。公表は 2.05年）。0〜90歳の値は変わらない（照合: claude、2026-11-15）
