    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-11-01", "tools": ["PDF の図の数値の表示（公表資料）", "PDF の本文の文（公表資料）", "引用と原本の指紋（sha256）の機械照合"], "note": "中央値は公表されていないので、図の区分の割合から求めた: 年0.5%以下が13.1%、年0.5%超〜1.0%以下が53.4%なので、真ん中（50%）は0.5%〜1.0%の区分の中。区分の中で一様に並ぶとみて 0.5% + 0.5% ×（50 − 13.1）÷ 53.4 = 0.8455% を 0.01% 単位に丸めて 0.85%。2つ目の読み方: 図の 53.4% と本文の文の 53.4% が一致し、図の区分の割合の合計が 100%（13.1+53.4+19.2+9.0+3.3+1.2+0.8）。前の 2025年4月調査（2024年10月〜2025年3月の借入）で同じく求めると約0.76%。利用者の75%が変動型（概要）。借りたときの金利で、変動金利の人はその後の金利の見直しで上がっていることがある。今返している人の金利の分布（前年度以前に借りた人の調査）は公表されていないので、直近に借りた人の中央値で代える。返済予定表でわかれば直す。調査は年2回ほど（4月・10月〔今回は1月〕）なので、新しい調査が出たら見直す"}
