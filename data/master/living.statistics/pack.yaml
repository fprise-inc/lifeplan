# 生活費の公的統計の目安（0007 の1: マスタデータ master.living.statistics。基本生活費の推定の目安に使う）
# 2026.1.0: 最初の版。総務省「家計調査」家計収支編 二人以上の世帯 詳細結果表 2025年 第3-1表（世帯人員別）の消費支出から、住居・教育・自動車等関係費を除いた額。
#   原本（e-Stat の統計表の Excel）と照らし合わせた（reviewed。照合: claude、2026-10-26）。単身世帯はこの表に無いので、1人の段は値を書いていない
# 2026.2.0: 同じ表の費目（食料・光熱・水道・家具・家事用品・被服及び履物・保健医療・交通・通信〔自動車等関係費を除く〕・教養娯楽・その他の消費支出）を足した
#   （categoryMonthly.*。総額を費目に分けるときの割合の目安。8費目の合計は basicMonthly と同じ〔表の丸めの1円の差を除く〕）
# 2026.3.0: 基本生活費の内訳を10費目（「食費」「水道・光熱費」「通信費」「交通費」「日用品」「被服・美容」「医療費」「趣味・娯楽」「こづかい・交際費」「その他」）に分け直した。
#   基本生活費の目安（basicMonthly）から家庭用耐久財（家電・家具の買い替えは年払い・数年おきの暮らしの支出で入れる）と仕送り金（子ども・教育、介護・親の項目で入れる）を除いた（rev 2）。
#   家具・家事用品は家庭用耐久財を除いた額、被服及び履物は理美容サービス・理美容用品を足した額に置き換え（rev 2）、通信（communication）・交通（transit）・こづかいと交際費（pocketAndSocial）・
#   その他（other。その他の消費支出から理美容・こづかい・交際費・仕送り金を除いた額）を足した。交通・通信（transport）とその他の消費支出（otherConsumption）は前の版の内訳の目安としてそのまま残す。
#   インターネット接続料（品目 88Y）は世帯人員別の値が2025年の品目分類の表に無いので、品目分類の第4-1表（二人以上の世帯・全国）の年額の月平均 2,954円を、どの世帯人員も
#   教養娯楽（recreation rev 2）から通信（communication）へ移した（合計は変えない）。
#   同じ原本（第3-1表。sha256 が同じ）の表を読み直した（reviewed。照合: claude、2026-10-31）。10費目の合計は basicMonthly と同じ（表の丸めの1円の差を除く）
