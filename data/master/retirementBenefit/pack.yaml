# 退職給付の公的統計の目安（0007 の1: マスタデータ master.retirementBenefit。会社員の退職一時金の推定の目安に使う）
# 2026.1.0: 最初の版。厚生労働省「就労条件総合調査」（令和5年。退職給付は5年ごとの調査）の退職給付制度がある企業の割合（企業規模計・規模別）と、
#   勤続20年以上かつ45歳以上の定年退職者の1人平均退職給付額（学歴・職種別。令和4年1年間の退職者）。原本（概況の PDF）をこの作業で取得していないので、
#   公式のドメインに限った検索の抜粋で読んだ値で、すべて原本での確認待ち（pendingReview）。勤続年数・退職事由ごとの表と、30〜99人の企業の割合は抜粋で読めなかったので入れていない
# 2026.2.0: 原本（就労条件総合調査の概況の PDF と表章データの Excel）を取得して照らし合わせ、2026.1.0 の値に reviewed の行を足した（値は変わらない。30〜99人の段 70.1% を足した）。
#   会社都合・自己都合・早期優遇の退職給付額（第22表）、定年退職の勤続年数階級別の額（第23表）、東京都産業労働局「中小企業の賃金・退職金事情」令和6年版 第8表のモデル退職金
#   （自己都合・会社都合 × 学歴。勤続20年未満の目安）を足した（照合: claude、2026-10-26）
# 2026.3.0: 人の属性（学歴）で推定の数字を分けない決まり（0118）。学歴・職種で分けた退職給付額とモデル退職金を外し、同じ原本から作った学歴を分けない値
#   （retirementBenefit.<定年|会社都合|自己都合|早期優遇>.all・retirementBenefit.mandatory.all.byService・retirementBenefit.smallFirm.<company|voluntary>.all）にした。
#   就労条件総合調査は学歴計も区分ごとの人数も公表していないので3つの区分の単純な平均、東京都の表は3つの区分を記入企業数で重み付けした平均（作り方は各値の approval.note）
