    approval: {"method": "reviewed", "paths": 2, "comparedBy": "claude", "comparedOn": "2026-11-03", "tools": ["Excel（公表の統計表）", "PDF の表（公表資料）", "引用と原本の指紋（sha256）の機械照合（非公開の原本の写し）"], "note": "学歴を分けない値: 表の3つの区分（高校卒・高専・短大卒・大学卒）の退職金支給額（千円）を、それぞれの記入企業数で重み付けした平均を千円に四捨五入した（学歴計の行は無い）。勤続1・3・5・10・15・20・25・30年は3つの区分の同じ勤続の行、最後の段は55歳の時点の行（高校卒は勤続37年・高専・短大卒は35年・大学卒は33年）を重ねて勤続33年からに当てる（区分ごとに55歳までの勤続が違うため）。1年 97千円（175社）、3年 285千円（333社）、5年 537千円（368社）、10年 1,410千円（373社）、15年 2,412千円（360社）、20年 3,718千円（381社）、25年 5,495千円（358社）、30年 7,035千円（355社）、55歳 8,519千円（353社）。モデル退職金は学校を卒業してすぐ入社し、普通の能力と成績で勤務した場合の、退職金規定による額。Excel と PDF の表が一致（PDF は独自の字形の数字を読み替えて照合）。訂正表（令和7年1月17日）は第8表を含まない。公表日は手元の原本に無いので、施行日の欄は取得日（遅くともこの日には公表済み）"}
