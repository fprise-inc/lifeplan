# 教育費の公的統計の平均（0010 の1: マスタデータ master.education.statistics。進路パターンの既定に使う）
# 2026.1.0: 最初の版。文部科学省「子供の学習費調査」（令和5年度。令和8年1月16日の訂正後）、「私立大学等の令和7年度入学者に係る学生納付金等調査」、
#   国立大学の標準額、公立大学の平均、日本政策金融公庫「教育費負担の実態調査」（令和3年度）。公式のサイトにこの作業の環境から届かなかったので、
#   検索の要約で読んだ値を入れた。すべて原本での確認待ち（pendingReview）。学校外活動費の内訳は取れた区分だけ（ほかは学習費総額だけ）。
#   学校給食費・受験費用・その他の学部の値は取れなかったので入れていない
# 2026.2.0: すべての値を原本（文部科学省の子供の学習費調査（令和8年1月16日の訂正版）・学生納付金等調査（令和7年度）と国公私立大学の授業料等の推移・
#   国立大学等の授業料その他の費用に関する省令、日本政策金融公庫の教育費負担の実態調査（令和3年度））と照らし合わせ、reviewed の行を足した
#   （照合: claude、2026-10-09）。部品が読むのに値の無かった学校外活動費5つ（公立・私立の幼稚園、私立小学校、公立・私立の中学校）を同じ表から足した。2つ目の読み方は、表の内訳の合計を計算し直した結果、または別の公表資料。施行日の欄は統計の公表日（法令の値は施行日）。値は変えていない
